  <style data-firma>
/* DHCP Network Lab — estilo de centro de operaciones de red. Sin fuentes ni recursos externos. */
:root {
  --fondo: #0a1426;
  --fondo-2: #0e1b33;
  --panel: #13233f;
  --panel-2: #182c4f;
  --borde: #2a426b;
  --borde-fuerte: #3d5d92;
  --texto: #e7eef9;
  --texto-2: #b3c2da;
  --texto-3: #8ea1c0;
  --acento: #38bdf8;
  --acento-oscuro: #0b6aa0;
  --ok: #4ade80;
  --ok-fondo: #0f3a2a;
  --mal: #f87171;
  --mal-fondo: #43191f;
  --aviso: #fbbf24;
  --aviso-fondo: #3d300c;
  --cliente: #60a5fa;
  --servidor: #d9f99d;
  --equipo: #94a3b8;
  --ampliacion: #f0abfc;
  --m-discover: #22d3ee;
  --m-offer: #c084fc;
  --m-request: #facc15;
  --m-ack: #4ade80;
  --m-nack: #f87171;
  --m-decline: #fb923c;
  --m-release: #cbd5e1;
  --m-inform: #f472b6;
  --seg-exclusion: #64748b;
  --seg-reservadas: #a78bfa;
  --seg-dinamicas: #38bdf8;
  --seg-libres: #1f3a5c;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', sans-serif;
  --radio: 10px;
  --sombra: 0 6px 24px rgba(0, 0, 0, 0.35);
  /* Respuesta inmediata al pulsar y cambios de estado: ease-out fuerte, nunca ease-in. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  /* Movimiento de algo que ya está en pantalla (el cursor de la línea temporal): ease-in-out fuerte. */
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

/* El atributo hidden siempre gana a los display de los componentes. */
[hidden] {
  display: none !important;
}

html {
  background: var(--fondo);
  -webkit-text-size-adjust: 100%;
  /* La cabecera es fija: el foco y los scrollIntoView no deben quedar debajo de ella. */
  scroll-padding-top: 124px;
}

.sin-cortar {
  white-space: nowrap;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
}

body.con-modal {
  overflow: hidden;
}

.sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.ico {
  width: 1.2em;
  height: 1.2em;
  flex: none;
  vertical-align: -0.22em;
}

a {
  color: var(--acento);
}

code,
.mono {
  font-family: var(--mono);
  font-size: 0.92em;
}

code {
  background: rgba(56, 189, 248, 0.1);
  border-radius: 4px;
  padding: 0 0.3em;
}

:focus-visible {
  outline: 3px solid var(--aviso);
  outline-offset: 2px;
}

h1,
h2,
h3 {
  line-height: 1.25;
  margin: 0 0 0.5em;
}

p {
  margin: 0 0 0.75em;
}

.saltar {
  position: absolute;
  left: 8px;
  top: -60px;
  background: var(--aviso);
  color: #000;
  padding: 10px 14px;
  border-radius: 8px;
  z-index: 100;
  font-weight: 700;
}

.saltar:focus {
  top: 8px;
}

/* ── Cabecera ── */
/* En un visor con zona segura (un móvil con muesca dentro de una app) la cabecera se pega bajo la barra del
   sistema y la franja de encima se pinta con el fondo; en un navegador normal la zona segura mide 0. */
.cabecera {
  background: rgba(8, 16, 34, 0.92);
  border-bottom: 1px solid var(--borde);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  backdrop-filter: blur(6px);
}

body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 21;
  background: var(--fondo);
}

.cabecera-fila,
.nav {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.cabecera-fila {
  justify-content: space-between;
  min-height: 56px;
}

.marca {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--texto);
  text-decoration: none;
  font-family: var(--mono);
  letter-spacing: 0.04em;
  min-height: 44px;
}

.marca-ico {
  color: var(--acento);
  width: 28px;
  height: 28px;
}

.marca-texto strong {
  color: var(--acento);
}

/* «by Ricardo Alonso» junto al logo; en el móvil baja debajo del nombre del juego. */
.marca-textos {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  column-gap: 10px;
  row-gap: 2px;
}

.marca-autor {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--sans);
  font-size: 0.8rem;
  letter-spacing: 0;
  line-height: 1.2;
  color: var(--texto-3);
}

/* Separador fino entre el nombre del juego y la firma. */
.marca-autor::before {
  content: '';
  align-self: stretch;
  width: 1px;
  margin-right: 5px;
  background: var(--borde-fuerte);
}

.marca-autor-nombre {
  color: var(--texto-2);
  font-weight: 600;
}

.marca-sello:empty {
  display: none;
}

.marca-sello .ico {
  display: block;
  width: 15px;
  height: 15px;
}

.marca-sello.ok {
  color: var(--ok);
}

.marca-sello.mal {
  color: var(--mal);
}

.cabecera-estado {
  display: flex;
  align-items: center;
  gap: 8px;
}

.marcador {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-weight: 700;
  color: var(--aviso);
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: 999px;
  padding: 6px 12px;
}

.btn-sonido {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  min-width: 44px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--borde);
  background: var(--panel);
  color: var(--texto);
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
}

.btn-sonido[aria-pressed='true'] {
  border-color: var(--ok);
  color: var(--ok);
}

.nav {
  gap: 4px;
  overflow-x: auto;
}

.nav-enlace {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 14px;
  color: var(--texto-2);
  text-decoration: none;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}

@media (hover: hover) and (pointer: fine) {
  .nav-enlace:hover {
    color: var(--texto);
  }
}

.nav-enlace[aria-current='page'] {
  color: var(--acento);
  border-bottom-color: var(--acento);
}

.aviso-guardado {
  max-width: 1120px;
  margin: 12px auto 0;
  padding: 10px 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  border: 1px solid var(--aviso);
  background: var(--aviso-fondo);
  color: #fde68a;
  border-radius: var(--radio);
  font-size: 0.92rem;
  width: calc(100% - 32px);
}

.principal {
  flex: 1;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  outline: none;
}

.pie {
  border-top: 1px solid var(--borde);
  color: var(--texto-3);
  font-size: 0.85rem;
  text-align: center;
  padding: 14px 16px 18px;
}

.pie p {
  margin: 0;
}

.pie .pie-autoria {
  margin-top: 6px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  column-gap: 6px;
}

.btn-firma {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--texto-2);
  font: inherit;
  text-decoration: underline;
  text-decoration-color: var(--borde-fuerte);
  text-underline-offset: 3px;
  cursor: pointer;
  transition: transform 160ms var(--ease-out), color 150ms ease;
}

.btn-firma .ico {
  width: 16px;
  height: 16px;
  flex: none;
}

.btn-firma.ok .ico {
  color: var(--ok);
}

.btn-firma.mal {
  color: #fca5a5;
}

.btn-firma.mal .ico {
  color: var(--mal);
}

@media (hover: hover) and (pointer: fine) {
  .btn-firma:hover {
    color: var(--texto);
    text-decoration-color: currentColor;
  }
}

.btn-firma:active {
  transform: scale(0.97);
}

/* ── Botones ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid transparent;
  font: inherit;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 150ms ease, border-color 150ms ease, transform 160ms var(--ease-out);
}

/* Al pulsar, todo lo pulsable se hunde un poco: confirma que la interfaz ha recibido el toque. */
.btn:active:not(:disabled),
.btn-icono:active:not(:disabled),
.hueco-boton:active:not(:disabled),
.segmento:active,
.ficha:active:not(:disabled) {
  transform: scale(0.97);
}

/* Las filas anchas se hunden menos: el mismo porcentaje movería demasiado sus bordes. */
.opcion:active:not(:disabled),
.linea-boton:active,
.ordenable-texto:active:not(:disabled),
.tarjeta-msg-boton:active {
  transform: scale(0.985);
}

.btn-icono,
.hueco-boton,
.segmento,
.ficha,
.opcion,
.linea-boton,
.ordenable-texto,
.tarjeta-msg-boton {
  transition: background-color 150ms ease, border-color 150ms ease, transform 160ms var(--ease-out);
}

.btn:disabled,
.btn-deshabilitado {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primario {
  background: var(--acento);
  color: #04203a;
}

.btn-secundario {
  background: var(--panel-2);
  color: var(--texto);
  border-color: var(--borde-fuerte);
}

.btn-fantasma {
  background: transparent;
  color: var(--acento);
  border-color: var(--borde);
}

/* El hover solo con ratón: en pantallas táctiles se quedaría «pegado» tras tocar. */
@media (hover: hover) and (pointer: fine) {
  .btn-primario:hover:not(:disabled) {
    background: #7dd3fc;
  }

  .btn-secundario:hover:not(:disabled),
  .btn-fantasma:hover:not(:disabled) {
    border-color: var(--acento);
  }
}

.btn-peligro {
  background: var(--mal);
  color: #2a0509;
}

.btn-deshabilitado {
  background: var(--panel);
  color: var(--texto-3);
  border-color: var(--borde);
}

.btn-compacto {
  min-height: 44px;
  padding: 6px 12px;
  font-size: 0.9rem;
}

.btn-icono {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  border-radius: 8px;
  border: 1px solid var(--borde);
  background: var(--panel-2);
  color: var(--texto);
  cursor: pointer;
}

.btn-icono:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.acciones {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}

/* ── Elementos comunes ── */
.panel {
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--sombra);
}


.titulo-pantalla {
  font-size: clamp(1.4rem, 4vw, 2rem);
}

.subtitulo {
  color: var(--texto-2);
  max-width: 70ch;
}

.nota {
  color: var(--texto-2);
  font-size: 0.92rem;
}

.nota .ico {
  margin-right: 6px;
  color: var(--acento);
}

.aviso {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 14px;
  border-radius: var(--radio);
  border: 1px solid var(--aviso);
  background: var(--aviso-fondo);
  color: #fde68a;
}

.aviso-ok {
  border-color: var(--ok);
  background: var(--ok-fondo);
  color: #bbf7d0;
}

.migas {
  color: var(--texto-3);
  font-size: 0.9rem;
}

.migas a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 4px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid var(--borde);
  background: var(--fondo-2);
  font-size: 0.8rem;
  color: var(--texto-2);
  white-space: nowrap;
}

/* La lista de diapositivas puede ser larga: se parte en varias líneas antes que desbordar. */
.chip-fuente {
  white-space: normal;
  max-width: 100%;
}

.chip-tipo {
  color: var(--acento);
  border-color: var(--acento-oscuro);
}

.chip-nivel.nivel-principiante {
  color: #86efac;
}

.chip-nivel.nivel-intermedio {
  color: #fcd34d;
}

.chip-nivel.nivel-experto {
  color: #fca5a5;
}

.chip-ampliacion {
  color: var(--ampliacion);
  border-color: var(--ampliacion);
  border-style: dashed;
  font-weight: 700;
  margin-left: 6px;
}

.ejercicio-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.barra {
  height: 10px;
  border-radius: 999px;
  background: var(--fondo-2);
  border: 1px solid var(--borde);
  overflow: hidden;
  min-width: 80px;
}

.barra-relleno {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--acento), var(--ok));
  transition: width 0.4s;
}

.barra-texto {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--texto-2);
  display: inline-block;
  margin-top: 4px;
}

.tabla-scroll {
  overflow-x: auto;
  max-width: 100%;
  -webkit-overflow-scrolling: touch;
}

.tabla {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
}

.tabla th,
.tabla td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--borde);
  vertical-align: top;
}

.tabla thead th {
  color: var(--texto-2);
  font-weight: 600;
  background: var(--fondo-2);
}

/* ── Inicio ── */
.hero {
  padding: 18px 0 8px;
}

.hero-titulo {
  font-family: var(--mono);
  font-size: clamp(2rem, 8vw, 3.6rem);
  letter-spacing: 0.06em;
  margin: 0 0 10px;
  color: var(--texto);
}

.hero-titulo span {
  color: var(--acento);
}

.hero-sub {
  color: var(--texto-2);
  max-width: 62ch;
  font-size: 1.05rem;
}

.tablero-inicio {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin: 18px 0;
}

.dato {
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 14px 16px;
}

.dato-titulo {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--texto-2);
  font-size: 0.85rem;
  margin: 0 0 4px;
}

.dato-titulo .ico {
  color: var(--acento);
}

.dato-valor {
  font-family: var(--mono);
  font-size: 1.35rem;
  font-weight: 700;
  margin: 0 0 6px;
}

.proxima {
  border-color: var(--borde-fuerte);
}

.accesos {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}

/* ── Mapa de misiones ── */
.tramo-titulo {
  font-size: 1.15rem;
  color: var(--texto);
  margin-top: 22px;
}

.mapa {
  list-style: none;
  margin: 0;
  padding: 0 0 0 22px;
  position: relative;
}

.mapa::before {
  content: '';
  position: absolute;
  left: 21px;
  top: 10px;
  bottom: 10px;
  border-left: 3px dashed var(--borde-fuerte);
}

.mision-tarjeta {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 16px 16px 16px 40px;
  margin: 0 0 14px 18px;
}

.mision-num {
  position: absolute;
  left: -40px;
  top: 16px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 1.1rem;
  background: var(--fondo-2);
  border: 3px solid var(--borde-fuerte);
}

.estado-completada .mision-num {
  border-color: var(--ok);
  color: var(--ok);
}

.estado-disponible .mision-num {
  border-color: var(--acento);
  color: var(--acento);
}

.estado-bloqueada {
  opacity: 0.75;
}

.mision-estado {
  font-size: 0.8rem;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--texto-3);
  margin-bottom: 2px;
}

.estado-completada .mision-estado {
  color: var(--ok);
}

.estado-disponible .mision-estado {
  color: var(--acento);
}

.mision-info h3 {
  margin-bottom: 4px;
}

.mision-objetivo {
  color: var(--texto-2);
  font-size: 0.95rem;
}

.mision-meta {
  font-size: 0.85rem;
  color: var(--texto-2);
  margin: 0;
}

.mision-bloqueo {
  font-size: 0.88rem;
  color: #fde68a;
  margin: 6px 0 0;
}

/* ── Intro de misión ── */
.intro-mision h1 {
  font-size: clamp(1.4rem, 4vw, 2rem);
}

.intro-mision h2 {
  font-size: 1.05rem;
  margin-top: 16px;
  color: var(--acento);
}

.intro-mision ul {
  padding-left: 1.2em;
}

/* ── HUD ── */
.hud {
  background: var(--fondo-2);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 10px 14px;
  margin-bottom: 16px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 16px;
  align-items: center;
}

.hud-titulo {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.hud-volver {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 8px;
  border: 1px solid var(--borde);
  color: var(--texto);
}

.hud-mision {
  color: var(--texto-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hud-datos {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  margin: 0;
  font-size: 0.88rem;
}

.hud-dato {
  display: flex;
  gap: 6px;
  align-items: baseline;
}

.hud-dato dt {
  color: var(--texto-3);
}

.hud-dato dd {
  margin: 0;
  font-family: var(--mono);
  font-weight: 700;
}

.hud-puntos dd {
  color: var(--aviso);
}

.hud-acciones {
  display: flex;
  gap: 8px;
  grid-row: 1;
  grid-column: 2;
}

.hud .barra {
  grid-column: 1 / -1;
}

/* ── Laboratorio DORA ── */
.lab-grid {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
  gap: 16px;
  align-items: start;
}

.lab-diagrama,
.figura-escalera,
.rango,
.captura-sim {
  margin: 0 0 14px;
  background: var(--fondo-2);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 10px;
}

.lienzo svg {
  display: block;
  width: 100%;
  height: auto;
}

.lab-diagrama .lienzo {
  max-width: 560px;
  margin: 0 auto;
}

.animador-escalera .nodo-etiqueta {
  font-size: 12.5px;
}

.animador-escalera .nodo-ip {
  font-size: 12px;
}

.leyenda {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.85rem;
  color: var(--texto-2);
  padding: 4px 4px 12px;
  margin: 0;
}

.pista-desliza {
  display: none;
  color: var(--acento);
}

.lab-panel {
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 14px;
}

/* Los títulos de panel van en la letra normal: la monoespaciada se reserva para IP, MAC, puertos y terminal. */
.panel-subtitulo {
  font-size: 1.05rem;
  font-weight: 650;
  color: var(--texto);
  margin: 4px 0 10px;
}

.panel-transito {
  min-height: 150px;
  border: 1px dashed var(--borde-fuerte);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 12px;
  background: var(--fondo-2);
}

.transito-vacio {
  color: var(--texto-3);
  margin: 0;
}

.transito-titulo {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.transito-datos {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 10px;
  margin: 0;
  font-size: 0.9rem;
}

.transito-datos dt {
  color: var(--texto-3);
}

.transito-datos dd {
  margin: 0;
  overflow-wrap: break-word;
}

.transito-estado.estado-enviando {
  color: var(--aviso);
}

.transito-estado.estado-entregado {
  color: var(--ok);
}

.sobre {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: 6px;
  background: var(--color-msg);
  color: #071226;
  font-family: var(--mono);
}

.etiqueta-modo {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--borde-fuerte);
}

.etiqueta-modo.modo-broadcast {
  border-style: dashed;
}

.controles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}

.btn-control {
  padding: 6px 8px;
  font-size: 0.88rem;
  gap: 4px;
}

.segmentado {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.segmentado-titulo {
  font-size: 0.85rem;
  color: var(--texto-3);
  margin-right: 6px;
}

.segmento {
  min-height: 44px;
  min-width: 52px;
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px solid var(--borde-fuerte);
  background: var(--fondo-2);
  color: var(--texto);
  font: inherit;
  font-size: 0.9rem;
  cursor: pointer;
}

.segmento[aria-pressed='true'] {
  background: var(--acento);
  color: #04203a;
  border-color: var(--acento);
  font-weight: 700;
}

.segmento[aria-pressed='true']::before {
  content: '✓ ';
}

.linea-tiempo {
  list-style: none;
  padding: 0;
  margin: 0 0 14px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.linea-boton {
  width: 100%;
  min-height: 44px;
  display: grid;
  grid-template-columns: auto auto 1fr;
  grid-template-rows: auto auto;
  align-items: center;
  gap: 2px 6px;
  text-align: left;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--borde);
  background: var(--panel);
  color: var(--texto);
  font: inherit;
  cursor: pointer;
}

/* El color del mensaje va en su icono y su nombre, igual que en los paquetes del diagrama. */
.linea-boton .ico,
.linea-boton strong {
  color: var(--color-msg);
}

.linea-num {
  font-family: var(--mono);
  color: var(--texto-3);
}

.linea-modo,
.linea-estado {
  grid-column: 1 / -1;
  font-size: 0.78rem;
  color: var(--texto-3);
  font-family: var(--mono);
}

.linea-item.estado-en-curso .linea-boton {
  border-color: var(--aviso);
  box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.3);
}

.linea-item.estado-entregado .linea-estado {
  color: var(--ok);
}

.linea-item.estado-entregado .linea-estado::before {
  content: '✓ ';
}

.narracion {
  margin: 8px 0 0;
  padding-left: 0;
  list-style: none;
  color: var(--texto-3);
}

.narracion li {
  border-left: 3px solid transparent;
  padding-left: 10px !important;
}

.narracion li.actual {
  border-left-color: var(--aviso);
}

.narracion li {
  padding: 3px 0;
}

.narracion li.hecho {
  color: var(--texto-2);
}

.narracion li.actual {
  color: var(--texto);
  font-weight: 700;
}

.narracion li.actual::marker {
  color: var(--aviso);
}

.detalles-narracion {
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 10px 14px;
  margin-bottom: 14px;
}

.detalles-narracion summary {
  cursor: pointer;
  font-weight: 600;
  min-height: 44px;
  padding: 10px 0;
}

.lab-pie {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  justify-content: space-between;
}

.lab-pie .nota {
  margin: 0;
}

/* ── SVG de red ── */
.animador {
  font-family: var(--sans);
}

.cable {
  stroke: var(--borde-fuerte);
  stroke-width: 3;
}

.calle {
  stroke: var(--borde-fuerte);
  stroke-width: 2;
  stroke-dasharray: 4 5;
}

.nodo-fondo {
  fill: var(--panel);
  stroke: var(--equipo);
  stroke-width: 2.5;
}

.nodo-icono {
  color: var(--equipo);
}

.nodo-cliente .nodo-fondo {
  stroke: var(--cliente);
}

.nodo-cliente .nodo-icono {
  color: var(--cliente);
}

.nodo-servidor .nodo-fondo {
  stroke: var(--servidor);
  stroke-width: 3;
}

.nodo-servidor .nodo-icono {
  color: var(--servidor);
}

.nodo-switch .nodo-fondo {
  fill: var(--fondo-2);
}

.nodo.configurado .nodo-fondo {
  stroke: var(--ok);
  stroke-width: 3.5;
}

.nodo-etiqueta {
  fill: var(--texto);
  font-size: 13px;
  font-weight: 600;
}

.nodo-ip {
  fill: var(--texto-2);
  font-size: 11.5px;
  font-family: var(--mono);
}

.nodo.configurado .nodo-ip {
  fill: var(--ok);
  font-weight: 700;
}

.nodo-insignia {
  font-size: 12px;
  font-weight: 700;
  fill: var(--texto);
}

.nodo-insignia.ok {
  fill: var(--ok);
}

.nodo-insignia.descarta {
  fill: var(--mal);
}

.paquete {
  cursor: pointer;
}

.zona-toque {
  fill: transparent;
  pointer-events: all;
}

.paquete-caja {
  stroke: #04101f;
  stroke-width: 1.5;
}

.paquete-icono {
  color: #071226;
}

.paquete-texto {
  fill: #071226;
  font-size: 12px;
  font-weight: 800;
  font-family: var(--mono);
}

.paquete.descartado {
  opacity: 0.3;
}

.paquete:focus-visible .paquete-caja {
  stroke: var(--aviso);
  stroke-width: 3;
}

.onda {
  fill: none;
  stroke-width: 3;
}

.flecha-linea {
  stroke-width: 3;
}

.modo-broadcast .flecha-linea {
  stroke-dasharray: 8 4;
}

.flecha-etiqueta {
  cursor: pointer;
}

.flecha-etiqueta-fondo {
  fill: var(--fondo-2);
  stroke: var(--borde);
}

.flecha-etiqueta:focus-visible .flecha-etiqueta-fondo {
  stroke: var(--aviso);
  stroke-width: 2;
}

.flecha-nombre {
  font-family: var(--mono);
  font-weight: 800;
  font-size: 13px;
}

.flecha-modo {
  fill: var(--texto-2);
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
}

.flecha-nota {
  fill: var(--texto-2);
  font-size: 11px;
  font-family: var(--mono);
}

.flecha-marca {
  font-size: 11px;
  font-weight: 700;
}

.flecha-marca.ok {
  fill: var(--ok);
}

.flecha-marca.descarta {
  fill: var(--mal);
}

.hueco-fila rect {
  fill: rgba(251, 191, 36, 0.08);
  stroke: var(--aviso);
  stroke-width: 2;
  stroke-dasharray: 6 5;
}

.hueco-fila text {
  fill: var(--aviso);
  font-size: 13px;
  font-weight: 700;
  font-family: var(--mono);
}

/* ── Ejercicios ── */
.ejercicio {
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 18px;
  box-shadow: var(--sombra);
}

.ejercicio-intro {
  color: var(--texto-2);
  font-size: 0.95rem;
}

.ejercicio-enunciado {
  font-size: clamp(1.1rem, 3vw, 1.35rem);
  line-height: 1.35;
  margin: 10px 0 14px;
}

.ejercicio-cuerpo {
  margin-bottom: 12px;
}

.ejercicio-acciones {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.ayuda-interaccion {
  font-size: 0.85rem;
  color: var(--texto-3);
  margin: 8px 0 0;
}

.nota-sin-ayuda {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--aviso);
  background: var(--aviso-fondo);
  color: #fde68a;
}

.opciones {
  display: grid;
  gap: 8px;
}

.opciones-vf {
  grid-template-columns: 1fr 1fr;
}

.opcion {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--borde-fuerte);
  background: var(--fondo-2);
  color: var(--texto);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.opciones-vf .opcion {
  justify-content: center;
  font-weight: 700;
}

@media (hover: hover) and (pointer: fine) {
  .opcion:hover:not(:disabled) {
    border-color: var(--acento);
  }
}

.opcion[aria-checked='true'] {
  border-color: var(--acento);
  background: #0c3150;
  box-shadow: inset 0 0 0 1px var(--acento);
}

.opcion-letra {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-weight: 700;
  background: var(--panel-2);
  border: 1px solid var(--borde-fuerte);
}

.opcion-texto {
  flex: 1;
}

.opcion-marca {
  font-weight: 700;
  font-size: 0.85rem;
  white-space: nowrap;
}

.opcion.ok {
  border-color: var(--ok);
  background: var(--ok-fondo);
}

.opcion.ok .opcion-marca {
  color: var(--ok);
}

.opcion.mal {
  border-color: var(--mal);
  background: var(--mal-fondo);
  opacity: 0.85;
}

.opcion.mal .opcion-marca {
  color: var(--mal);
}

.opcion:disabled {
  cursor: default;
}

.feedback {
  margin-top: 12px;
}

.feedback:empty {
  display: none;
}

.feedback {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--borde);
}

.feedback > .ico {
  margin-top: 3px;
}

.feedback.ok {
  border-color: var(--ok);
  background: var(--ok-fondo);
}

.feedback.ok > .ico {
  color: var(--ok);
}

.feedback.mal {
  border-color: var(--mal);
  background: var(--mal-fondo);
}

.feedback.mal > .ico {
  color: var(--mal);
}

.feedback.solucion,
.feedback.aviso-listo {
  border-color: var(--aviso);
  background: var(--aviso-fondo);
}

.feedback-pie {
  margin: 6px 0 0;
  font-size: 0.85rem;
  color: var(--texto-2);
}

.puntos-ganados {
  color: var(--aviso);
  font-family: var(--mono);
  font-weight: 700;
}

.feedback-detalle {
  color: var(--texto-2);
  font-size: 0.88rem;
}

.pistas-texto .pista {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px dashed var(--aviso);
  background: rgba(251, 191, 36, 0.06);
  margin: 8px 0 0;
}

.pistas-texto .pista .ico {
  color: var(--aviso);
  margin-top: 3px;
}

.explicacion {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 10px;
  background: var(--fondo-2);
  border: 1px solid var(--borde);
}

.explicacion h2 {
  font-size: 1rem;
  color: var(--acento);
  margin: 6px 0 8px;
}

.lista-porqueno {
  padding-left: 1.1em;
  margin: 0 0 10px;
}

.lista-porqueno li {
  margin-bottom: 6px;
}

.explicacion-fuente {
  color: var(--texto-2);
  font-size: 0.9rem;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

/* Tablero: piezas y huecos */
.tablero {
  position: relative;
}

.pool {
  margin-top: 12px;
  padding: 12px;
  border: 1px dashed var(--borde-fuerte);
  border-radius: 10px;
  background: rgba(14, 27, 51, 0.6);
}

.pool.sobre {
  border-color: var(--acento);
}

.pool-titulo {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--texto-3);
  margin: 0 0 8px;
}

.pool-fichas {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 44px;
}

.pool-devolver {
  margin-top: 8px;
}

.ficha {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  max-width: 100%;
  padding: 8px 12px 8px 6px;
  border-radius: 10px;
  border: 1px solid var(--borde-fuerte);
  background: var(--panel-2);
  color: var(--texto);
  font: inherit;
  font-size: 0.95rem;
  text-align: left;
  cursor: grab;
  /* Con el dedo, deslizar en vertical sobre una pieza desplaza la página; para arrastrarla se usa el asa. */
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}

.ficha-asa {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  align-self: stretch;
  width: 22px;
  margin: -8px 0;
  color: var(--texto-3);
  touch-action: none;
}

/* Zona táctil de al menos 44×44 px sin cambiar el aspecto: el asa se dibuja de 22 px y esta capa invisible la amplía. */
.ficha-asa::before {
  content: '';
  position: absolute;
  inset: -1px -16px -1px -6px;
}

.ficha-asa .ico {
  width: 16px;
  height: 16px;
}

.ficha-palabra {
  font-family: var(--mono);
}

.ficha[aria-pressed='true'] {
  outline: 3px dashed var(--acento);
  outline-offset: 2px;
  background: #0c3150;
}

.ficha[aria-pressed='true']::after {
  content: 'Seleccionada';
  flex: none;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #04203a;
  background: var(--acento);
  border-radius: 999px;
  padding: 1px 8px;
}

.ficha[aria-pressed='true']:focus-visible {
  outline: 3px solid var(--aviso);
}

.ficha.ok {
  border-color: var(--ok);
  border-left-color: var(--ok);
}

.ficha.mal {
  border-color: var(--mal);
  border-left-color: var(--mal);
}

.ficha-marca {
  font-weight: 800;
}

.ficha.ok .ficha-marca {
  color: var(--ok);
}

.ficha.mal .ficha-marca {
  color: var(--mal);
}

.ficha.descartada {
  opacity: 0.55;
  text-decoration: line-through;
  cursor: not-allowed;
}

.ficha:disabled {
  cursor: default;
}

.ficha.origen-arrastre {
  opacity: 0.35;
}

.ficha-fantasma {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 1000;
  pointer-events: none;
  opacity: 0.95;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  outline: 2px solid var(--acento);
}

.hueco {
  border: 2px dashed var(--borde-fuerte);
  border-radius: 10px;
  transition: border-color 0.15s, background 0.15s;
}

.con-seleccion .hueco:not(.ocupado),
.arrastrando .hueco {
  border-color: var(--acento);
  background: rgba(56, 189, 248, 0.07);
}

.hueco.sobre {
  border-color: var(--acento);
  background: rgba(56, 189, 248, 0.12);
}

.hueco-fichas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.hueco-boton {
  min-height: 44px;
  width: 100%;
  border: none;
  background: transparent;
  color: var(--texto-3);
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
  border-radius: 8px;
}

.con-seleccion .hueco-boton {
  color: var(--acento);
  font-weight: 700;
}

.pool-aviso {
  margin: 0 0 8px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--acento);
  background: rgba(56, 189, 248, 0.1);
  font-size: 0.9rem;
}

.pool.resaltar {
  border-color: var(--acento);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
}

.relacionar-filas {
  display: grid;
  gap: 8px;
}

.relacionar-fila {
  display: grid;
  grid-template-columns: minmax(110px, 160px) 1fr;
  gap: 10px;
  align-items: stretch;
}

.relacionar-izq {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--fondo-2);
  border: 1px solid var(--borde);
  font-family: var(--mono);
  font-weight: 700;
}

.relacionar-hueco {
  padding: 4px;
  min-height: 52px;
}

.texto-huecos {
  line-height: 2.6;
  font-size: 1.02rem;
}

.hueco-inline {
  display: inline-flex;
  vertical-align: middle;
  min-width: 110px;
  padding: 2px;
  margin: 0 2px;
}

.hueco-inline .hueco-boton {
  width: auto;
  min-width: 100px;
  padding: 0 8px;
}

.hueco-inline .ficha {
  min-height: 44px;
}

.categorias {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}

.categoria {
  padding: 10px;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.categoria-titulo {
  font-size: 1rem;
  font-weight: 650;
  margin: 0;
  color: var(--texto);
}

.categoria-titulo .mono {
  color: var(--texto-2);
  font-weight: 400;
}

.categoria .hueco-fichas {
  flex-direction: column;
}

.categoria .ficha {
  width: 100%;
}

.categoria .hueco-boton {
  margin-top: auto;
  border: 1px dashed var(--borde);
}

/* Lista ordenable */
.ordenable {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}

.ordenable-item {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 6px;
  align-items: center;
  padding: 6px;
  border-radius: 10px;
  border: 1px solid var(--borde-fuerte);
  background: var(--fondo-2);
  transition: box-shadow 0.15s;
}

.ordenable-item.seleccionado {
  outline: 3px dashed var(--acento);
  outline-offset: 2px;
  background: #0c3150;
}

.ordenable-item.seleccionado .ordenable-etiqueta::after {
  content: ' · seleccionado';
  color: var(--acento);
  font-size: 0.8rem;
  font-weight: 700;
}

.ordenable-item.arrastrando {
  position: relative;
  z-index: 5;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  background: var(--panel-2);
}

.ordenable-item.destino-antes {
  box-shadow: 0 -4px 0 var(--acento);
}

.ordenable-item.ok {
  border-color: var(--ok);
}

.ordenable-item.mal {
  border-color: var(--mal);
}

.asa {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--texto-3);
  cursor: grab;
  touch-action: none;
}

.ordenable-texto {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  width: 100%;
  padding: 6px 8px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--texto);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.ordenable-pos {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-weight: 700;
  background: var(--panel-2);
  border: 1px solid var(--borde-fuerte);
}

.ordenable-etiqueta {
  flex: 1;
}

.ordenable-marca {
  font-size: 0.82rem;
  font-weight: 700;
}

.ordenable-item.ok .ordenable-marca {
  color: var(--ok);
}

.ordenable-item.mal .ordenable-marca {
  color: var(--mal);
}

.ordenable-mover {
  display: flex;
  gap: 4px;
}

.ordenable-atributos {
  grid-column: 2 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding: 0 8px 6px;
}

.segmentado.mal .segmento[aria-pressed='true'] {
  background: var(--mal);
  border-color: var(--mal);
  color: #2a0509;
}

/* El símbolo también indica el error: el color nunca es la única señal. */
.segmentado.mal .segmento[aria-pressed='true']::before {
  content: '✗ ';
}

/* Secuencias con hueco */
.secuencia {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 28px;
  align-items: stretch;
}

.secuencia-item {
  position: relative;
  flex: 1 1 180px;
  display: flex;
}

.secuencia-item + .secuencia-item::before {
  content: '→';
  position: absolute;
  left: -21px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--texto-3);
  font-weight: 700;
}

.tarjeta-msg {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--color-msg);
  background: var(--fondo-2);
  font-size: 0.88rem;
}

.tarjeta-msg-nombre {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  color: var(--color-msg);
}

.tarjeta-msg-ruta {
  color: var(--texto-2);
}

.tarjeta-msg-dir {
  color: var(--texto-3);
  font-size: 0.8rem;
}

.tarjeta-msg-boton {
  width: 100%;
  font: inherit;
  font-size: 0.88rem;
  color: var(--texto);
  text-align: left;
  cursor: pointer;
}

@media (hover: hover) and (pointer: fine) {
  .tarjeta-msg-boton:hover {
    background: var(--panel);
  }
}

.tarjeta-msg-nota {
  color: var(--texto);
  font-size: 0.82rem;
  font-style: italic;
}

.tarjeta-msg .etiqueta-modo {
  align-self: flex-start;
}

/* Pasos de captura: diseño distinto al de los mensajes DORA (borde discontinuo y numeración). */
.tarjeta-paso {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px dashed var(--borde-fuerte);
  background: var(--panel-2);
  font-size: 0.9rem;
}

.tarjeta-paso.estilo-captura {
  border-color: #94a3b8;
}

.tarjeta-paso-num {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--texto-3);
}

.tarjeta-paso-num .ico {
  color: var(--texto);
  width: 22px;
  height: 22px;
}

.tarjeta-paso-titulo {
  font-size: 1rem;
}

.tarjeta-paso-detalle {
  color: var(--texto-2);
  font-size: 0.85rem;
}

.hueco-secuencia {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  min-height: 96px;
  border-color: var(--aviso);
}

.hueco-secuencia-titulo {
  font-family: var(--mono);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--aviso);
}

.hueco-secuencia.completado {
  border-style: solid;
  border-color: var(--ok);
  background: var(--ok-fondo);
}

.hueco-secuencia.completado .hueco-secuencia-titulo {
  color: var(--ok);
}

.hueco-secuencia.completado .hueco-secuencia-titulo::before {
  content: '✓ ';
}

.ficha-pieza {
  width: 100%;
}

.figura-escalera figcaption,
.rango figcaption,
.captura-sim figcaption {
  font-size: 0.85rem;
  color: var(--texto-2);
  margin-bottom: 6px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.figura-escalera.activa {
  border-color: var(--ok);
}

/* El diagrama que aparece al acertar entra con un fundido corto desde muy cerca: no surge de la nada. */
.ejercicio-cuerpo > .figura-escalera.activa {
  transition: opacity 240ms var(--ease-out), transform 240ms var(--ease-out);
}

@starting-style {
  .ejercicio-cuerpo > .figura-escalera.activa {
    opacity: 0;
    transform: translateY(8px);
  }
}

.figura-escalera .lienzo {
  max-width: 560px;
  margin: 0 auto;
}

/* Captura simulada */
.captura-sim figcaption strong {
  color: var(--aviso);
}

.tabla-captura {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 0.8rem;
  white-space: nowrap;
}

.tabla-captura th {
  text-align: left;
  background: #1c2f52;
  color: var(--texto-2);
  padding: 6px 8px;
  font-weight: 600;
  position: sticky;
  top: 0;
}

.tabla-captura td {
  padding: 6px 8px;
  border-bottom: 1px solid rgba(42, 66, 107, 0.6);
}

.tabla-captura tr.proto-dhcp td {
  background: rgba(56, 189, 248, 0.08);
}

.tabla-captura tr.proto-ssdp td,
.tabla-captura tr.proto-igmpv2 td,
.tabla-captura tr.proto-udp td,
.tabla-captura tr.proto-icmpv6 td {
  color: var(--texto-3);
}

.tabla-captura tr[role='radio'] {
  cursor: pointer;
}

.tabla-captura tr[role='radio'] td {
  height: 44px;
}

/* Con ratón, filas más bajas para ver más paquetes a la vez; con el dedo, se mantienen los 44 px. */
@media (hover: hover) and (pointer: fine) {
  .tabla-captura tr[role='radio'] td {
    height: 32px;
    padding-top: 4px;
    padding-bottom: 4px;
  }
}

@media (hover: hover) and (pointer: fine) {
  .tabla-captura tr[role='radio']:hover td {
    background: rgba(56, 189, 248, 0.16);
  }
}

.tabla-captura tr[aria-checked='true'] td {
  background: #0b5c8f;
  color: #fff;
}

.tabla-captura tr[aria-checked='true'] td:first-child::before {
  content: '▶ ';
}

.tabla-captura tr.mal td {
  background: var(--mal-fondo);
  color: #fecaca;
  text-decoration: line-through;
}

.tabla-captura tr.mal td:first-child::before {
  content: '✗ ';
}

.tabla-captura tr.ok td,
.tabla-captura tr.fila-correcta td {
  background: var(--ok-fondo);
  color: #dcfce7;
}

.tabla-captura tr.ok td:first-child::before {
  content: '✓ ';
}

.tabla-captura tr:focus-visible {
  outline: 3px solid var(--aviso);
  outline-offset: -3px;
}

/* Mapa de rango */
.rango-barra {
  position: relative;
  display: flex;
  height: 44px;
  border-radius: 8px;
  overflow: visible;
  margin: 8px 0 18px;
}

.rango-barra.con-etiquetas {
  margin-bottom: 52px;
}

.seg {
  display: grid;
  place-items: center;
  min-width: 0;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: #06101f;
  border-right: 2px solid var(--fondo-2);
  /* El color del tramo cambia al colocar un bloque: un fundido corto indica el cambio sin moverse. */
  transition: background-color 200ms ease, color 200ms ease;
}

.seg:first-child {
  border-radius: 8px 0 0 8px;
}

.seg:last-of-type {
  border-radius: 0 8px 8px 0;
}

.seg-exclusion,
.muestra.seg-exclusion {
  background: var(--seg-exclusion);
  color: #fff;
}

.seg-reservadas,
.muestra.seg-reservadas {
  background: var(--seg-reservadas);
}

.seg-dinamicas,
.muestra.seg-dinamicas {
  background: var(--seg-dinamicas);
}

.seg-libres,
.muestra.seg-libres {
  background: var(--seg-libres);
  color: var(--texto-2);
}

.seg.seg-hueco {
  background: repeating-linear-gradient(45deg, rgba(251, 191, 36, 0.15) 0 8px, transparent 8px 16px);
  outline: 2px dashed var(--aviso);
  outline-offset: -2px;
  color: var(--aviso);
  font-size: 1rem;
}

.rango-marca {
  position: absolute;
  top: -6px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: left 1.2s ease-in-out;
  pointer-events: none;
}

.rango-pin {
  width: 4px;
  height: 58px;
  background: var(--texto);
  box-shadow: 0 0 0 2px var(--fondo-2);
}

.rango-marca-texto {
  font-size: 0.75rem;
  font-family: var(--mono);
  white-space: nowrap;
  background: var(--panel-2);
  border: 1px solid var(--borde-fuerte);
  padding: 1px 6px;
  border-radius: 6px;
  margin-top: 2px;
}

.rango-marca.problema .rango-pin {
  background: var(--mal);
}

.rango-marca.problema .rango-marca-texto {
  border-color: var(--mal);
  color: #fecaca;
}

.rango-marca.corregida .rango-pin {
  background: var(--ok);
}

.rango-marca.corregida .rango-marca-texto {
  border-color: var(--ok);
  color: #bbf7d0;
}

.rango-leyenda {
  width: auto;
}

.rango-leyenda td {
  padding: 4px 12px 4px 4px;
}

.muestra {
  display: inline-block;
  width: 18px;
  height: 14px;
  border-radius: 3px;
}

.fila-hueco td {
  color: var(--aviso);
}

.hueco-inline {
  position: relative;
}

.hueco-num {
  position: absolute;
  top: -9px;
  left: -6px;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 9px;
  background: var(--borde-fuerte);
  color: var(--texto);
  font-family: var(--mono);
  font-size: 0.7rem;
  line-height: 18px;
  text-align: center;
}

.muestra.seg-hueco {
  background: repeating-linear-gradient(45deg, rgba(251, 191, 36, 0.5) 0 4px, transparent 4px 8px);
  outline: 1px dashed var(--aviso);
}

.tabla-reservas {
  margin-top: 10px;
}

.tabla-reservas caption {
  text-align: left;
  color: var(--texto-2);
  font-size: 0.85rem;
  padding-bottom: 4px;
}

.tabla-reservas .fila-corregida td {
  background: var(--ok-fondo);
  color: #dcfce7;
}

/* ── Resultados ── */
.lista-criterio {
  list-style: none;
  padding: 0;
  margin: 0;
}

.lista-criterio li {
  padding: 4px 0;
}

.lista-criterio .ok,
.resultado-item.ok .resultado-estado {
  color: var(--ok);
}

.lista-criterio .mal,
.resultado-item.mal .resultado-estado {
  color: #fca5a5;
}

.cierre {
  border-color: var(--ok);
}

.lista-resultados {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 6px;
}

.resultado-item {
  display: grid;
  grid-template-columns: 28px 1fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--fondo-2);
  font-size: 0.92rem;
}

.resultado-num {
  font-family: var(--mono);
  color: var(--texto-3);
}

.resultado-estado,
.resultado-puntos {
  font-family: var(--mono);
  font-size: 0.85rem;
  white-space: nowrap;
}

.detalle-error {
  border: 1px solid var(--borde);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 8px;
  background: var(--fondo-2);
}

.detalle-error summary {
  cursor: pointer;
  font-weight: 600;
  min-height: 44px;
  padding: 10px 0;
}

/* ── Teoría ── */
.lista-fichas {
  list-style: none;
  padding: 0;
  margin: 0 0 18px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 10px;
}

.tarjeta-ficha {
  display: flex;
  flex-direction: column;
  gap: 6px;
  height: 100%;
  padding: 14px;
  border-radius: var(--radio);
  border: 1px solid var(--borde);
  background: var(--panel);
  color: var(--texto);
  text-decoration: none;
}

@media (hover: hover) and (pointer: fine) {
  .tarjeta-ficha:hover {
    border-color: var(--acento);
  }
}

.tarjeta-ficha span:not(.chip) {
  color: var(--texto-2);
  font-size: 0.92rem;
}

.tarjeta-ficha .chip {
  align-self: flex-start;
}

.bloque-teoria h2 {
  font-size: 1.05rem;
  color: var(--acento);
}

.ficha-contenido h2 {
  font-size: 1rem;
  color: var(--acento);
  margin: 16px 0 6px;
}

.ficha-contenido ol,
.ficha-contenido ul {
  padding-left: 1.3em;
}

.glosario dt {
  font-weight: 700;
  font-family: var(--mono);
  color: var(--acento);
  margin-top: 8px;
}

.glosario dd {
  margin: 2px 0 0 0;
}

/* ── Perfil ── */
.tabla-perfil td,
.tabla-perfil th {
  white-space: nowrap;
}

.tabla-perfil .barra {
  width: 120px;
}

.panel-peligro {
  border-color: rgba(248, 113, 113, 0.5);
}

/* ── Modal ── */
.modal-fondo {
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 16, 0.75);
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 16px;
}

.modal {
  width: min(640px, 100%);
  max-height: calc(100vh - 32px);
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--borde-fuerte);
  border-radius: 14px;
  box-shadow: var(--sombra);
  outline: none;
}

.modal-cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 12px 12px 18px;
  border-bottom: 1px solid var(--borde);
  position: sticky;
  top: 0;
  background: var(--panel);
}

.modal-cabecera h2 {
  margin: 0;
  font-size: 1.15rem;
}

.modal-cuerpo {
  padding: 16px 18px;
}

.modal-acciones {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 18px 16px;
}

/* ── Autoría y firma digital ── */
.firma-estado {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 12px;
  align-items: start;
  padding: 14px 16px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--fondo-2);
}

.firma-estado > .ico {
  width: 28px;
  height: 28px;
  color: var(--texto-3);
}

.firma-estado.ok {
  border-color: var(--ok);
  background: var(--ok-fondo);
}

.firma-estado.ok > .ico {
  color: var(--ok);
}

.firma-estado.mal {
  border-color: var(--mal);
  background: var(--mal-fondo);
}

.firma-estado.mal > .ico {
  color: var(--mal);
}

.firma-estado-titulo {
  margin: 0 0 2px;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--texto);
}

.firma-estado-texto {
  margin: 0;
  color: var(--texto-2);
}

.firma-datos {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 8px 16px;
  margin: 18px 0;
}

.firma-datos dt {
  color: var(--texto-3);
}

.firma-datos dd {
  margin: 0;
  color: var(--texto);
}

.firma-huella {
  font-family: var(--mono);
  word-spacing: 0.15em;
}

.firma-explica {
  margin: 0;
  font-size: 0.9rem;
  color: var(--texto-2);
}

.ficha-mensaje-cabecera {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.ficha-mensaje-datos dt {
  margin-top: 10px;
  font-weight: 700;
  color: var(--acento);
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.ficha-mensaje-datos dd {
  margin: 2px 0 0;
}

.dd-ampliacion {
  border-left: 3px dashed var(--ampliacion);
  padding-left: 8px;
  margin-top: 6px !important;
}

.bloque {
  display: block;
}

/* ── Escenarios (situación + varias preguntas) ── */
.situacion {
  border: 1px solid var(--borde-fuerte);
  border-radius: var(--radio);
  background: var(--fondo-2);
  padding: 12px 14px;
  margin-bottom: 14px;
}

.situacion-titulo {
  font-size: 1rem;
  color: var(--texto);
  margin: 0 0 6px;
}

.situacion-datos {
  display: grid;
  grid-template-columns: minmax(120px, auto) 1fr;
  gap: 4px 14px;
  margin: 8px 0 0;
  font-size: 0.92rem;
}

.situacion-datos dt {
  color: var(--texto-3);
}

.situacion-datos dd {
  margin: 0;
}

.subpregunta {
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 10px 12px 12px;
  margin: 0 0 12px;
  min-width: 0;
}

.subpregunta.resuelta {
  border-color: var(--ok);
}

/* La pregunta es la leyenda del grupo: flotada para que quede dentro del recuadro y no sobre el borde. */
.subpregunta-titulo {
  float: left;
  width: 100%;
  padding: 0;
  font-weight: 700;
  margin: 0 0 8px;
}

.subpregunta-titulo + * {
  clear: both;
}

.subpregunta-num {
  font-family: var(--mono);
  color: var(--acento);
}

/* ── Formularios de configuración de red ── */
.campo {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}

.campo label {
  font-weight: 600;
  font-size: 0.92rem;
}

.campo input,
.buscador {
  min-height: 44px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--borde-fuerte);
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--mono);
  font-size: 1rem;
  width: 100%;
  max-width: 340px;
}

.buscador {
  font-family: var(--sans);
  max-width: 480px;
}

.campo input:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.campo input[aria-invalid='true'] {
  border-color: var(--mal);
  box-shadow: 0 0 0 1px var(--mal);
}

.campo-ayuda {
  margin: 0;
  font-size: 0.8rem;
  color: var(--texto-3);
}

.campo-error {
  margin: 0;
  font-size: 0.85rem;
  color: #fecaca;
}

.campo-error::before {
  content: '✗ ';
  color: var(--mal);
  font-weight: 700;
}

.datos-red {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  margin: 0 0 14px;
  padding: 10px 14px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--fondo-2);
}

.datos-red div {
  display: flex;
  gap: 8px;
  align-items: baseline;
}

.datos-red dt {
  color: var(--texto-3);
  font-size: 0.85rem;
}

.datos-red dd {
  margin: 0;
  font-weight: 700;
}

.sim-mac {
  color: var(--texto-3);
  margin-bottom: 10px;
}

/* ── Simulación de la misión 1 ── */
.sim-grid,
.nic-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
  gap: 14px;
  align-items: start;
  margin-bottom: 14px;
}

.sim-contador {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px;
  margin: 4px 0 8px;
}

.sim-contador strong {
  font-size: clamp(1.6rem, 6vw, 2.4rem);
  color: var(--aviso);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

/* El contador de DHCP reserva el ancho de la cifra final: al contar, el texto de al lado no salta. */
.sim-dhcp-contador {
  display: inline-block;
  text-align: right;
}

.sim-iconos {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  color: var(--texto-2);
  margin-bottom: 8px;
}

.sim-iconos .ico {
  width: 26px;
  height: 26px;
}

.sim-mas {
  font-family: var(--mono);
  font-weight: 700;
  color: var(--aviso);
  align-self: center;
}

.sim-hechos {
  color: var(--ok);
  font-size: 0.9rem;
  margin: 0;
}

.sim-crece-titulo {
  font-size: 1.15rem;
  color: var(--aviso);
}

.sim-estimacion {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px dashed var(--aviso);
  background: rgba(251, 191, 36, 0.06);
}

.sim-estimacion .ico {
  color: var(--aviso);
  margin-top: 2px;
}

.sim-dhcp {
  border-color: var(--ok);
}

.sim-dhcp .sim-contador strong {
  color: var(--ok);
}

.tabla-usadas {
  max-width: 520px;
}

.tabla-usadas caption,
.tabla caption {
  text-align: left;
  color: var(--texto-2);
  font-size: 0.85rem;
  padding-bottom: 4px;
}

/* ── Laboratorio de la tarjeta de red ── */
.nic-paso {
  font-weight: 600;
}

.nic-pruebas {
  list-style: none;
  padding: 0;
  margin: 0 0 10px;
  display: grid;
  gap: 8px;
}

.nic-prueba {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 8px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--borde);
  background: var(--fondo-2);
}

.nic-prueba-icono {
  font-weight: 800;
  font-size: 1.2rem;
  text-align: center;
}

.nic-prueba.estado-ok {
  border-color: var(--ok);
}

.nic-prueba.estado-ok .nic-prueba-icono,
.nic-prueba.estado-ok .nic-prueba-estado {
  color: var(--ok);
}

.nic-prueba.estado-mal {
  border-color: var(--mal);
}

.nic-prueba.estado-mal .nic-prueba-icono,
.nic-prueba.estado-mal .nic-prueba-estado {
  color: var(--mal);
}

.nic-prueba-motivo {
  margin: 4px 0 0;
  font-size: 0.88rem;
  color: var(--texto-2);
}

.nic-conclusion .aviso {
  margin-bottom: 10px;
}

/* ── Mapa del rango de la misión 4 ── */
.rango-tipo {
  flex-direction: column;
  align-items: flex-start;
  font-family: var(--sans);
  font-weight: 400;
  gap: 2px;
}

.rango-tipo strong {
  font-weight: 650;
}

.rango-tipo span {
  font-size: 0.8rem;
  color: var(--texto-3);
}

.seg.seg-vacio {
  background: repeating-linear-gradient(45deg, rgba(148, 163, 184, 0.18) 0 8px, transparent 8px 16px);
  outline: 1px dashed var(--borde-fuerte);
  outline-offset: -1px;
  color: var(--texto-2);
}

/* ── Glosario ── */
.lista-glosario dt {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 1.02rem;
  margin-top: 14px;
}

.lista-glosario dd p {
  margin: 4px 0;
}

.glosario-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  font-size: 0.88rem;
}

.glosario-meta a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
}

.campo-buscar {
  margin-top: 10px;
}

/* ── Consola y notas de ampliación en las fichas ── */
.consola {
  font-family: var(--mono);
  font-size: 0.85rem;
  background: #050b17;
  color: #d1fae5;
  border: 1px solid var(--borde);
  border-radius: 8px;
  padding: 10px 12px;
  overflow-x: auto;
  white-space: pre;
}

.nota-ampliacion {
  border-left: 3px dashed var(--ampliacion);
  padding-left: 10px;
}

/* ── Panel del validador (?debug=1) ── */
.panel-validador {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 40;
  max-width: min(520px, calc(100vw - 24px));
  font-size: 0.85rem;
}

.validador-boton {
  min-height: 44px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 2px solid;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  float: right;
}

.validador-boton.ok {
  background: var(--ok-fondo);
  border-color: var(--ok);
  color: var(--ok);
}

.validador-boton.mal {
  background: var(--mal-fondo);
  border-color: var(--mal);
  color: var(--mal);
}

.validador-detalle {
  clear: both;
  margin-bottom: 8px;
  padding: 12px;
  border-radius: 10px;
  background: var(--panel);
  border: 1px solid var(--borde-fuerte);
  max-height: 50vh;
  overflow: auto;
  box-shadow: var(--sombra);
}

.validador-lista {
  padding-left: 0;
  list-style: none;
}

.validador-lista .ok {
  color: var(--ok);
}

.validador-lista .mal {
  color: #fca5a5;
}

.validador-lista .aviso {
  color: #fde68a;
  border: none;
  background: none;
  padding: 0;
}

.validador-desbloquear {
  display: flex;
  gap: 8px;
  align-items: center;
  min-height: 44px;
}

/* ── Laboratorios de la fase 3: captura (misión 9) y terminal (misión 10) ── */

/* Pasos de captura (diap. 29 y 31): borde discontinuo y gris, distinto de los colores de los mensajes DORA. */
.pasos-lab {
  list-style: none;
  margin: 0 0 14px;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.paso-lab {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px dashed #64748b;
  color: var(--texto-3);
  font-size: 0.92rem;
  transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease;
}

.paso-lab.estado-actual {
  border-style: solid;
  border-color: #94a3b8;
  background: var(--panel-2);
  color: var(--texto);
  font-weight: 650;
}

.paso-lab.estado-hecho {
  border-style: solid;
  border-color: rgba(74, 222, 128, 0.45);
  color: #bbf7d0;
}

.paso-lab.estado-hecho .ico {
  color: var(--ok);
}

.pregunta-lab {
  padding: 10px 14px;
  border: 1px solid var(--borde-fuerte);
  border-radius: var(--radio);
  background: var(--fondo-2);
  max-width: 75ch;
}

.lab-objetivo {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 6px;
}

.lab-objetivo .ico {
  color: var(--cliente);
}

.objetivo-mac {
  color: var(--cliente);
}

.panel-paso .panel-subtitulo:focus {
  outline: none;
}

.acciones-lab {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
  gap: 10px;
  margin: 12px 0;
}

.acciones-lab .btn {
  justify-content: flex-start;
  text-align: left;
  white-space: normal;
}

.resumen-lab {
  margin: 12px 0 0;
  padding-left: 1.4em;
}

.resumen-lab li {
  margin-bottom: 6px;
}

/* Respuesta escrita (Lease Time, número de intercambios…). */
.form-respuesta {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 12px 0;
}

.form-respuesta label {
  font-weight: 600;
}

.form-respuesta-fila {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.form-respuesta input {
  min-height: 44px;
  width: 100%;
  max-width: 280px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--borde-fuerte);
  background: var(--fondo);
  color: var(--texto);
  font: inherit;
  font-size: 1rem;
}

.form-respuesta input.mono {
  font-family: var(--mono);
}

.form-respuesta input:disabled {
  opacity: 0.6;
}

/* Mapa de la red: de Internet a los equipos de la Intranet, unidos por enlaces verticales. */
.mapa-red {
  margin: 12px 0;
  padding: 14px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--fondo-2);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.mapa-red figcaption {
  align-self: flex-start;
  margin-bottom: 10px;
  font-size: 0.85rem;
  color: var(--texto-2);
}

.mapa-nodo {
  width: 100%;
  max-width: 560px;
  padding: 10px 12px;
  border: 1px solid var(--borde);
  border-radius: 10px;
  background: var(--panel);
}

.mapa-nodo-titulo {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
}

.mapa-nodo-titulo .ico {
  color: var(--equipo);
}

.mapa-nodo-servidor .mapa-nodo-titulo .ico {
  color: var(--servidor);
}

/* El equipo del alumno se distingue por el color de los clientes. */
.mapa-nodo-cliente {
  border-color: var(--cliente);
}

.mapa-nodo-cliente .mapa-nodo-titulo .ico {
  color: var(--cliente);
}

.mapa-nodo-sub {
  margin: 2px 0 0;
  font-size: 0.85rem;
  color: var(--texto-3);
}

.mapa-enlace {
  width: 2px;
  height: 18px;
  background: var(--borde-fuerte);
}

/* La fila de equipos cuelga del switch: una línea horizontal y un tramo vertical por equipo. */
.mapa-fila {
  position: relative;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding-top: 18px;
  border-top: 2px solid var(--borde-fuerte);
}

.mapa-fila > .mapa-nodo {
  position: relative;
  max-width: none;
}

.mapa-fila > .mapa-nodo::before {
  content: '';
  position: absolute;
  top: -19px;
  left: 50%;
  width: 2px;
  height: 18px;
  background: var(--borde-fuerte);
}

.mapa-tarjetas {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.mapa-tarjeta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
  padding: 6px 6px 6px 10px;
  border: 1px solid var(--borde);
  border-radius: 8px;
  background: var(--fondo-2);
}

.mapa-tarjeta-texto {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 6px;
  font-size: 0.88rem;
}

.mapa-tarjeta-texto .ico {
  color: var(--texto-2);
}

/* Captura simulada al estilo de Wireshark: barra, filtro, lista de paquetes y detalle por capas. */
.ws {
  margin: 0 0 16px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: #08111f;
  overflow: hidden;
}

.ws-barra {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 10px;
  margin: 0;
  padding: 8px 12px;
  background: #0e1a30;
  border-bottom: 1px solid var(--borde);
  font-size: 0.88rem;
}

.ws-barra > .ico {
  color: var(--acento);
}

.ws-titulo {
  font-weight: 600;
}

.ws-iface {
  color: var(--acento);
}

.ws-estado {
  font-size: 0.82rem;
  color: var(--texto-3);
}

.ws-estado.estado-capturando {
  color: var(--mal);
}

.ws-aviso {
  margin-left: auto;
  font-size: 0.8rem;
  color: var(--aviso);
}

.ws-filtro {
  padding: 10px 12px;
  border-bottom: 1px solid var(--borde);
}

.ws-filtro-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 4px;
}

.ws-filtro-fila {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.ws-filtro-input {
  flex: 1 1 180px;
  min-width: 0;
  min-height: 44px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--borde-fuerte);
  background: var(--fondo);
  color: var(--texto);
  font-size: 0.95rem;
  transition: background-color 150ms ease, border-color 150ms ease;
}

/* Como en Wireshark: verde si el filtro es válido, rojo si no se entiende. */
.ws-filtro-input.valido {
  border-color: var(--ok);
  background: var(--ok-fondo);
}

.ws-filtro-input.invalido {
  border-color: var(--mal);
  background: var(--mal-fondo);
}

.ws-filtro-msg {
  margin: 6px 0 0;
  font-size: 0.82rem;
  color: var(--texto-2);
}

.ws-filtro-msg:empty {
  display: none;
}

.ws-filtro-msg.mal {
  color: #fecaca;
}

.ws-lista {
  max-height: 290px;
  overflow: auto;
  overscroll-behavior: contain;
}

.ws-tabla {
  min-width: 100%;
  width: max-content;
}

.tabla-captura .info {
  white-space: pre;
}

.tabla-captura tr.proto-dns td,
.tabla-captura tr.proto-tcp td,
.tabla-captura tr.proto-tlsv13 td,
.tabla-captura tr.proto-ntp td,
.tabla-captura tr.proto-icmp td {
  color: var(--texto-3);
}

.tabla-captura tr.proto-dhcp[aria-checked='true'] td,
.tabla-captura tr[aria-checked='true'] td {
  color: #fff;
}

.ws-desliza {
  display: none;
  margin: 0;
  padding: 6px 12px 0;
  font-size: 0.8rem;
  color: var(--acento);
}

.ws-vacia {
  margin: 0;
  padding: 14px 12px;
  color: var(--texto-3);
  font-size: 0.9rem;
}

.ws-panel-detalle {
  border-top: 1px solid var(--borde);
  padding: 8px 12px 12px;
}

.ws-subtitulo {
  margin: 0 0 6px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--texto-2);
}

.ws-detalle {
  max-height: 380px;
  overflow: auto;
  font-size: 0.8rem;
  line-height: 1.45;
}

.ws-detalle-vacio {
  margin: 0;
  font-family: var(--sans);
  color: var(--texto-3);
}

.ws-nodo > summary {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 2px 6px 2px 2px;
  border-radius: 6px;
  cursor: pointer;
  list-style: none;
  /* Las líneas largas se parten en vez de obligar a desplazar el detalle en horizontal. */
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.ws-nodo > summary::-webkit-details-marker {
  display: none;
}

/* Triángulo de despliegue: gira al abrir la rama. */
.ws-nodo > summary::before {
  content: '▸';
  flex: none;
  display: inline-block;
  width: 1em;
  text-align: center;
  color: var(--texto-3);
  transition: transform 150ms var(--ease-out);
}

.ws-nodo[open] > summary::before {
  transform: rotate(90deg);
}

.ws-nodo > summary:focus-visible {
  outline-offset: -2px;
}

@media (hover: hover) and (pointer: fine) {
  .ws-nodo > summary:hover {
    background: rgba(56, 189, 248, 0.1);
  }
}

@media (pointer: coarse) {
  .ws-nodo > summary {
    min-height: 44px;
  }
}

.ws-hijos {
  margin-left: 9px;
  padding-left: 12px;
  border-left: 1px solid var(--borde);
}

.ws-campo {
  padding: 3px 6px 3px 1.4em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--texto-2);
}

/* Campo que responde a la pregunta, enmarcado como en la diap. 40. */
.ws-campo.destacado {
  color: var(--texto);
  background: var(--aviso-fondo);
  box-shadow: inset 0 0 0 1px var(--aviso);
  border-radius: 6px;
}

.captura-ejercicio {
  margin-bottom: 4px;
}

/* Terminal simulado */
.terminal-grid {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
  gap: 16px;
  align-items: start;
  margin-bottom: 16px;
}

.terminal {
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: #050b17;
  overflow: hidden;
}

.terminal-barra {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 8px 12px;
  background: #0e1a30;
  border-bottom: 1px solid var(--borde);
  font-size: 0.85rem;
  color: var(--texto-2);
}

.terminal-salida {
  height: 300px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 0.82rem;
  line-height: 1.5;
}

.terminal-texto {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  min-height: 1.5em;
}

.terminal-texto.orden {
  color: var(--texto);
  font-weight: 600;
}

.terminal-texto.salida {
  color: #d1fae5;
}

.terminal-texto.error {
  color: #fca5a5;
}

.terminal-texto.pista {
  color: #93c5fd;
}

.terminal-linea {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  padding: 8px 12px;
  border-top: 1px solid var(--borde);
}

.terminal-prompt {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--ok);
}

.terminal-input {
  flex: 1 1 160px;
  min-width: 0;
  min-height: 44px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--borde-fuerte);
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--mono);
  font-size: 0.95rem;
}

.terminal-atajos {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 0 12px 12px;
}

.terminal-atajos-titulo {
  font-size: 0.82rem;
  color: var(--texto-3);
}

.terminal-atajos .btn {
  font-family: var(--mono);
  font-size: 0.82rem;
}

.mini-escalera {
  margin: 0;
  padding: 10px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--fondo-2);
}

.mini-escalera figcaption {
  font-size: 0.85rem;
  color: var(--texto-2);
  margin-bottom: 6px;
}

.mini-escalera-vacia {
  margin: 8px 0;
}

.tareas-lab {
  list-style: none;
  margin: 0 0 14px;
  padding: 0;
  display: grid;
  gap: 6px;
}

.tarea-lab {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--borde);
  background: var(--fondo-2);
  color: var(--texto-2);
  transition: border-color 200ms ease, color 200ms ease;
}

.tarea-lab .ico {
  margin-top: 2px;
  color: var(--texto-3);
}

.tarea-lab.estado-hecho {
  border-color: rgba(74, 222, 128, 0.45);
  color: var(--texto);
}

.tarea-lab.estado-hecho .ico {
  color: var(--ok);
}

.incidencia {
  margin-bottom: 14px;
}

/* Huecos sobre una línea de terminal (salida de dhclient). */
.texto-huecos-consola {
  font-family: var(--mono);
  font-size: 0.92rem;
  padding: 8px 12px;
  border: 1px solid var(--borde);
  border-radius: 8px;
  background: #050b17;
  color: #d1fae5;
}

.ficha-frase {
  font-family: var(--sans);
}

@media (max-width: 860px) {
  .terminal-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .pasos-lab {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .mapa-fila {
    grid-template-columns: 1fr;
    border-top: 0;
    padding-top: 0;
  }

  .mapa-fila > .mapa-nodo::before {
    display: none;
  }

  .ws-aviso {
    margin-left: 0;
    flex-basis: 100%;
  }

  .ws-desliza {
    display: block;
  }

  .terminal-salida {
    height: 240px;
  }
}

/* ── Adaptación a pantallas estrechas ── */
@media (max-width: 860px) {
  .sim-grid,
  .nic-grid {
    grid-template-columns: 1fr;
  }

  /* En una sola columna el laboratorio es un bloque normal (sticky no sale de una celda de rejilla):
     los controles quedan justo bajo el diagrama y se fijan abajo al desplazarse por el panel. */
  .lab-grid {
    display: block;
  }

  .lab-grid > * {
    margin-bottom: 10px;
  }

  .lab-panel {
    display: contents;
  }

  .lab-panel > .controles {
    position: sticky;
    bottom: 0;
    z-index: 6;
    margin: 0;
    padding: 8px;
    border: 1px solid var(--borde-fuerte);
    border-radius: var(--radio);
    background: rgba(14, 27, 51, 0.96);
    box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.35);
  }

  .lab-panel > .velocidades {
    margin: 10px 0;
  }

  .linea-tiempo {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 640px) {
  .marca-texto {
    font-size: 0.9rem;
  }

  .marca-textos {
    flex-direction: column;
    align-items: flex-start;
  }

  .marca-autor {
    font-size: 0.75rem;
  }

  .marca-autor::before {
    display: none;
  }

  .firma-datos {
    grid-template-columns: minmax(0, 1fr);
    row-gap: 2px;
  }

  .firma-datos dd + dt {
    margin-top: 10px;
  }

  .btn-sonido-texto {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  .nav-enlace {
    padding: 0 10px;
    flex: 1;
    justify-content: center;
    flex-direction: column;
    gap: 0;
    font-size: 0.78rem;
    min-height: 52px;
  }

  .principal {
    padding-top: 14px;
  }

  .panel,
  .ejercicio {
    padding: 14px;
  }

  .mision-tarjeta {
    grid-template-columns: 1fr;
    padding-left: 34px;
  }

  .hud {
    grid-template-columns: 1fr;
  }

  .hud-acciones {
    grid-column: 1;
    grid-row: auto;
  }

  .hud-mision {
    display: none;
  }

  .controles {
    grid-template-columns: repeat(2, 1fr);
  }

  .relacionar-fila {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .secuencia {
    flex-direction: column;
    gap: 22px;
  }

  .secuencia-item {
    flex: none;
  }

  .secuencia-item + .secuencia-item::before {
    content: '↓';
    left: 50%;
    top: -19px;
    transform: translateX(-50%);
  }

  .ordenable-item {
    grid-template-columns: 44px 1fr;
  }

  .ordenable-mover {
    grid-column: 2;
    justify-content: flex-end;
  }

  .ordenable-atributos {
    grid-column: 1 / -1;
  }

  .resultado-item {
    grid-template-columns: 24px 1fr;
  }

  .resultado-estado,
  .resultado-puntos {
    grid-column: 2;
  }

  .opciones-vf {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  .animador-topologia .nodo-etiqueta {
    font-size: 15px;
  }

  .animador-topologia .nodo-ip,
  .animador-topologia .nodo-insignia {
    font-size: 14px;
  }

  .animador-topologia .paquete-texto {
    font-size: 13px;
  }

  .flecha-modo,
  .flecha-marca,
  .flecha-nota {
    font-size: 12px;
  }

  .flecha-nombre {
    font-size: 13.5px;
  }

  .pista-desliza {
    display: inline;
  }

  /* Controles compactos: Reiniciar, Atrás y Paso solo con icono (conservan su aria-label). */
  .lab .controles {
    grid-template-columns: auto auto 1fr auto;
  }

  .lab .controles .btn-control:not(.btn-primario) span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  .lab .controles .btn-control {
    min-width: 48px;
  }
}

/* ═════════════ Fase 4: pestañas, línea temporal, examen, práctica e insignias ═════════════ */

/* ── Pestañas del laboratorio (misión 11): una por mensaje, con su color ── */
.pestanas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 6px;
  margin: 4px 0 16px;
}

.pestana {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--borde);
  background: var(--panel);
  color: var(--texto-2);
  font: inherit;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, transform 160ms var(--ease-out);
}

.pestana .ico {
  color: var(--color-msg);
}

.pestana-nombre {
  font-family: var(--mono);
}

.pestana-estado {
  margin-left: auto;
  display: inline-flex;
  color: var(--ok);
}

.pestana[aria-selected='true'] {
  background: var(--panel-2);
  border-color: var(--color-msg);
  color: var(--texto);
  box-shadow: inset 0 -2px 0 var(--color-msg);
}

.pestana:active {
  transform: scale(0.97);
}

@media (hover: hover) and (pointer: fine) {
  .pestana:hover {
    border-color: var(--borde-fuerte);
    color: var(--texto);
  }

  .pestana[aria-selected='true']:hover {
    border-color: var(--color-msg);
  }
}

.lab-escenario {
  font-size: 1.15rem;
  margin: 0 0 8px;
}

.lab-pie-botones {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* ── Línea temporal de una concesión (misión 11, Ampliación) ── */
.concesion-escenario {
  max-width: 70ch;
}

.concesion-figura {
  margin: 8px 0 0;
  padding: 18px 18px 14px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--fondo-2);
  /* El cursor ocupa toda la pista y se desplaza con transform: lo que sobresale se recorta aquí (la marca cabe en el relleno). */
  overflow: hidden;
}

.concesion-pista {
  position: relative;
  display: grid;
  height: 18px;
  margin: 30px 12px 10px;
}

.concesion-tramo {
  height: 100%;
}

.concesion-tramo:first-child {
  border-radius: 999px 0 0 999px;
}

.concesion-tramo:nth-child(3) {
  border-radius: 0 999px 999px 0;
}

.tramo-uso {
  background: rgba(74, 222, 128, 0.55);
}

.tramo-renovar {
  background: rgba(250, 204, 21, 0.6);
}

.tramo-revincular {
  background: rgba(251, 146, 60, 0.7);
}

.concesion-tic {
  position: absolute;
  top: -5px;
  bottom: -5px;
  width: 2px;
  margin-left: -1px;
}

/* La marca se dibuja aparte: su etiqueta queda sobre el fondo oscuro de la figura, no sobre la marca. */
.concesion-tic::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--texto-2);
}

.concesion-tic-texto {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--texto);
  white-space: nowrap;
}

/* Los extremos se alinean hacia dentro para no salirse de la pista. */
.tic-inicio .concesion-tic-texto {
  left: 0;
  transform: none;
}

.tic-fin .concesion-tic-texto {
  left: auto;
  right: 0;
  transform: none;
}

/* El cursor ocupa toda la pista: desplazarlo un 100 % lo lleva al final (solo transform, sin reflujo). */
.concesion-cursor {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transition: transform 450ms var(--ease-in-out);
}

.concesion-marca {
  position: absolute;
  left: 0;
  top: 50%;
  width: 24px;
  height: 24px;
  margin: -12px 0 0 -12px;
  border-radius: 50%;
  background: var(--texto);
  border: 5px solid var(--fondo);
  box-shadow: 0 0 0 2px var(--acento);
}

.concesion-leyenda {
  list-style: none;
  padding: 0;
  margin: 14px 0 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  font-size: 0.85rem;
  color: var(--texto-2);
}

.concesion-leyenda .muestra {
  display: inline-block;
  width: 14px;
  height: 10px;
  border-radius: 3px;
  margin-right: 6px;
}

.momentos {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 14px 0;
}

.momento-boton {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0 6px;
  align-items: center;
  min-height: 56px;
  padding: 8px 12px;
  text-align: left;
  border-radius: 10px;
  border: 1px solid var(--borde);
  background: var(--panel);
  color: var(--texto);
  font: inherit;
  cursor: pointer;
  transition: background-color 150ms ease, border-color 150ms ease, transform 160ms var(--ease-out);
}

.momento-nombre {
  grid-column: 1;
}

.momento-hora {
  grid-column: 1;
  color: var(--texto-2);
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
}

.momento-visto {
  grid-column: 2;
  grid-row: 1 / span 2;
  display: inline-flex;
  color: var(--ok);
}

.momento-boton[aria-current='step'] {
  border-color: var(--acento);
  background: var(--panel-2);
  box-shadow: 0 0 0 1px var(--acento);
}

.momento-boton:active {
  transform: scale(0.97);
}

@media (hover: hover) and (pointer: fine) {
  .momento-boton:hover {
    border-color: var(--acento);
  }
}

.concesion-info {
  margin-bottom: 0;
}

.concesion-mensajes {
  list-style: none;
  padding: 0;
  margin: 0 0 10px;
  display: grid;
  gap: 6px;
}

.concesion-mensajes li {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.concesion-ruta {
  color: var(--texto-2);
  font-size: 0.92rem;
}

.concesion-estado {
  margin-bottom: 0;
}

/* ── Examen: la nota ── */
.nota-examen {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 32px;
  border-color: var(--acento-oscuro);
}

.nota-examen-valor {
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.nota-examen-numero {
  font-family: var(--sans);
  font-size: clamp(3rem, 12vw, 4.5rem);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.nota-examen-sobre {
  color: var(--texto-2);
}

.nota-examen-texto p {
  margin: 0 0 4px;
}

.nota-examen-calificacion {
  font-size: 1.35rem;
  font-weight: 700;
}

.nota-examen-calificacion.aprobado {
  color: #86efac;
}

.nota-examen-calificacion.suspenso {
  color: #fca5a5;
}

.resultado-mision {
  color: var(--texto-3);
  font-size: 0.85rem;
  white-space: nowrap;
}

.tabla-por-mision .barra {
  max-width: 220px;
}

.dato-detalle {
  margin: 0;
  color: var(--texto-2);
  font-size: 0.85rem;
}

.celda-detalle {
  display: block;
  color: var(--texto-2);
  font-size: 0.85rem;
}

/* ── Práctica libre ── */
.practica-form {
  max-width: 780px;
}

.campo-grupo {
  border: 0;
  padding: 0;
  margin: 0 0 16px;
  min-width: 0;
}

.campo-grupo legend {
  font-weight: 600;
  font-size: 0.92rem;
  padding: 0;
  margin-bottom: 6px;
}

.opciones-segmentadas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.opcion-segmento {
  position: relative;
  display: inline-flex;
}

/* Radio nativo invisible pero enfocable: el teclado y los lectores de pantalla funcionan de serie. */
.opcion-segmento input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.opcion-segmento span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  min-width: 52px;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--borde-fuerte);
  background: var(--fondo-2);
  color: var(--texto);
  transition: background-color 150ms ease, border-color 150ms ease, transform 160ms var(--ease-out);
}

.opcion-segmento input:checked + span {
  background: var(--acento);
  color: #04203a;
  border-color: var(--acento);
  font-weight: 700;
}

.opcion-segmento input:checked + span::before {
  content: '✓\00a0';
}

.opcion-segmento input:focus-visible + span {
  outline: 3px solid var(--aviso);
  outline-offset: 2px;
}

.opcion-segmento:active span {
