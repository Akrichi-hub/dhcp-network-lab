  transform: scale(0.97);
}

@media (hover: hover) and (pointer: fine) {
  .opcion-segmento:hover input:not(:checked) + span {
    border-color: var(--acento);
  }
}

.practica-selectores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 0 16px;
}

.selector {
  min-height: 44px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--borde-fuerte);
  background: var(--fondo);
  color: var(--texto);
  font: inherit;
  width: 100%;
}

.casilla {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  margin: 0 0 8px;
  cursor: pointer;
}

.casilla input {
  flex: none;
  width: 22px;
  height: 22px;
  margin: 0;
  accent-color: var(--acento);
}

.practica-contador {
  margin: 8px 0 0;
  font-weight: 600;
}

/* ── Insignias ── */
.rejilla-insignias {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
}

.insignia {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 14px;
  border-radius: var(--radio);
  border: 1px solid var(--borde);
  background: var(--fondo-2);
}

.insignia-icono {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid currentColor;
}

.insignia-icono .ico {
  width: 22px;
  height: 22px;
}

.insignia.ganada .insignia-icono {
  color: var(--aviso);
  background: var(--aviso-fondo);
}

.insignia.pendiente .insignia-icono {
  color: var(--texto-3);
  border-style: dashed;
}

.insignia-texto {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.insignia.pendiente .insignia-nombre {
  color: var(--texto-2);
}

.insignia-descripcion {
  color: var(--texto-2);
  font-size: 0.88rem;
}

.insignia-estado {
  font-size: 0.8rem;
  color: var(--texto-3);
}

.insignia.ganada .insignia-estado {
  color: var(--ok);
}

.insignias-nuevas {
  border-color: var(--aviso);
}

/* Una insignia nueva es un momento poco frecuente: entra con un fundido y un pequeño salto. */
.insignias-nuevas .insignia {
  transition: opacity 400ms var(--ease-out), transform 400ms var(--ease-out);
}

.insignias-nuevas .insignia:nth-child(2) {
  transition-delay: 80ms;
}

.insignias-nuevas .insignia:nth-child(n + 3) {
  transition-delay: 160ms;
}

@starting-style {
  .insignias-nuevas .insignia {
    opacity: 0;
    transform: translateY(6px) scale(0.96);
  }
}

/* ── Perfil: precisión por nivel ── */
.lista-niveles {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 12px;
}

.nivel-fila {
  display: grid;
  grid-template-columns: 120px minmax(80px, 1fr) minmax(0, auto);
  align-items: center;
  gap: 12px;
}

.nivel-fila .chip {
  justify-self: start;
}

.nivel-fila .barra-texto {
  margin-top: 0;
}

@media (max-width: 640px) {
  /* Tarjetas de datos en dos columnas: con una sola, el perfil se hace interminable en el móvil. */
  .tablero-inicio {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .tablero-inicio .dato {
    padding: 12px;
  }

  .tablero-inicio .dato-valor {
    font-size: 1.15rem;
  }

  .tablero-inicio .dato-progreso {
    grid-column: 1 / -1;
  }

  .momentos {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .concesion-figura {
    padding: 16px 12px 12px;
  }

  .nota-examen {
    gap: 8px 20px;
  }

  .nivel-fila {
    grid-template-columns: 1fr;
    gap: 4px;
  }
}

/* Por debajo de 360 px (menos del mínimo previsto) el nombre del juego cabe aún en una línea. */

    resumen: 'Siglas, capa, arquitectura, transporte y puertos de DHCP.',
    contenido:
      '<p><strong>DHCP</strong> = <em>Dynamic Host Configuration Protocol</em>. Es un protocolo de la familia TCP/IP, de <strong>capa de Aplicación</strong>, con arquitectura <strong>Cliente/Servidor</strong>. Usa los puertos <strong>67 y 68</strong> y transporte <strong>UDP</strong>. <strong>Asigna dinámicamente direcciones IP</strong> y otros parámetros de configuración de red a los equipos que se conectan a la red (diap. 1).</p>' +

      '<div class="tabla-scroll"><table class="tabla">' +
      '<thead><tr><th>Capa TCP/IP</th><th>Protocolos</th></tr></thead><tbody>' +

      '<tr><td>Transporte</td><td>TCP, UDP</td></tr>' +
      '<tr><td>Internet</td><td>IP, ICMP, ARP</td></tr>' +
      '<tr><td>Interfaz de red</td><td>Interfaz de red</td></tr>' +

    id: 'teoria-puertos',

      '<h2>¿Qué puerto usa cada uno?</h2>' +
      '<p>Lo deducimos de la propia presentación: el ACK que envía el servidor lleva <code>Src Port: 67, Dst Port: 68</code> (diap. 38), y el RELEASE que envía el cliente va dirigido al servidor «port 67» (diap. 21). Por tanto, el <strong>servidor</strong> usa el puerto <strong>67</strong> y el <strong>cliente</strong> el <strong>68</strong>.</p>'

      '<p>Según la CNMC, en junio de 2025 la telefonía móvil en España superó los <strong>62 millones de líneas</strong> (62.067.902). Eso es una red grande: todo móvil con datos tiene una IP (diap. 5).</p>' +
      '<h2>DHCP al rescate</h2>' +
      '<p>Configurar manualmente una red de 10 millones de equipos es impensable. DHCP es el único modo viable de configurar los equipos de una red grande y, por tanto, uno de los protocolos más usados en las redes TCP/IP (diap. 6).</p>'

      '<dl class="glosario">' +
      '<dt>Renovación (renew) y T1</dt><dd>Al llegar el Renewal Time T1 (normalmente la mitad del Lease Time), el cliente pide al servidor que le concedió la IP que renueve la concesión, con un REQUEST en unicast; si el servidor responde con un ACK, la concesión se alarga.</dd>' +
      '<dt>Revinculación (rebind) y T2</dt><dd>Si al llegar el Rebinding Time T2 (normalmente el 87,5 % del Lease Time) no ha podido renovar, el cliente envía el REQUEST en broadcast para que le responda cualquier servidor. Si se acaba el Lease Time sin respuesta, debe dejar de usar la IP.</dd>' +
      '<dt>Varios servidores</dt><dd>Todos los servidores que reciben el DISCOVER pueden responder con un OFFER; el cliente elige uno y lo indica en el REQUEST, de modo que los demás saben que su oferta no se ha aceptado.</dd>' +

  <script data-firma>
/* js/mascaras.js */
/* DHCP Network Lab — Máscaras del día.
   Cada día (fecha local) el juego usa otras redes y otras máscaras: la red de los laboratorios de las misiones 1 y 2 y
   cinco ejercicios de máscara (misiones 2, 5, 8, 10 y 11). Cuanto más avanzado el tramo, más difícil la máscara:
   · principiante: /24, /16 y /8, en las que cada número de la IP es entero de la red o entero del equipo;
   · intermedio: de /22 a /27 (sin /24), en las que la frontera entre red y equipo cae dentro de un número;
   · experto: /19 a /21 y /28 a /30, redes grandes o muy pequeñas que obligan a calcular el bloque.
   El mismo día salen siempre las mismas redes (se puede repetir una misión) y el prefijo de cada misión rota para no
   repetirse dos días seguidos; los dos laboratorios usan cada día una máscara distinta. ?dia=AAAA-MM-DD elige el día
   (para comprobarlo y para las pruebas); una fecha que no existe se ignora.
   La presentación solo usa redes /24 (diap. 15): calcular red, broadcast y equipos con otras máscaras es Ampliación. */
(function () {
  'use strict';
  const D = (DHCP.data = DHCP.data || {});

  const PREFIJOS = { principiante: [24, 16, 8], intermedio: [27, 26, 25, 23, 22], experto: [30, 29, 28, 21, 20, 19] };

  /* ── Azar con semilla: el mismo texto da siempre la misma secuencia ── */
  function semilla(texto) {
    let h = 2166136261;
    for (let i = 0; i < texto.length; i++) {
      h ^= texto.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function azar(texto) {
    let a = semilla(texto);
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const entero = (r, min, max) => min + Math.floor(r() * (max - min + 1));
  const barajar = (r, lista) => {
    const a = lista.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  /* k números distintos entre 1 y n: cada uno se elige entre los que quedan libres. */
  const distintos = (r, n, k) => {
    const elegidos = [];
    for (let i = 0; i < k; i++) {
      let x = entero(r, 1, n - i);
      for (const e of elegidos.slice().sort((a, b) => a - b)) if (x >= e) x++;
      elegidos.push(x);
    }
    return elegidos;
  };

  /* Días desde el 1-1-1970 de una fecha AAAA-MM-DD (para rotar los prefijos día a día); antes de 1970, negativos. */
  const numeroDeDia = (dia) => {
    const [a, m, d] = dia.split('-').map(Number);
    return Math.round(Date.UTC(a, m - 1, d) / 86400000);
  };
  /* Resto de la división siempre entre 0 y m - 1, también con números negativos. */
  const modulo = (n, m) => ((n % m) + m) % m;

  /* La fecha existe en el calendario: 2026-02-30 no, ni los años 0000 a 0099 (Date los lleva a 1900-1999). */
  function fechaValida(dia) {
    const [a, m, d] = dia.split('-').map(Number);
    const f = new Date(Date.UTC(a, m - 1, d));
    return f.getUTCFullYear() === a && f.getUTCMonth() === m - 1 && f.getUTCDate() === d;
  }

  function hoy() {
    const m = /[?&]dia=(\d{4}-\d{2}-\d{2})\b/.exec(window.location.search);
    if (m && fechaValida(m[1])) return m[1];
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  const M = {
    PREFIJOS,

    /* ── Direcciones como enteros de 32 bits (sin signo) ── */
    aEntero: (ip) => ip.split('.').reduce((n, o) => n * 256 + Number(o), 0),
    aIp: (n) => [24, 16, 8, 0].map((d) => Math.floor(n / 2 ** d) % 256).join('.'),
    tamano: (p) => 2 ** (32 - p),
    mascaraDe: (p) => M.aIp(2 ** 32 - M.tamano(p)),
    redDe: (ip, p) => M.aIp(Math.floor(M.aEntero(ip) / M.tamano(p)) * M.tamano(p)),
    broadcastDe: (ip, p) => M.aIp(M.aEntero(M.redDe(ip, p)) + M.tamano(p) - 1),
    mismaRed: (a, b, p) => M.redDe(a, p) === M.redDe(b, p),
    equipos: (p) => M.tamano(p) - 2,
    /* La IP n de la red (1 = la primera que puede usar un equipo). */
    equipo: (red, n) => M.aIp(M.aEntero(red) + n),
    /* La máscara en binario, en grupos de 8: 11111111.11111111.00000000.00000000. */
    binario: (p) => ('1'.repeat(p) + '0'.repeat(32 - p)).replace(/(.{8})(?!$)/g, '$1.'),

    /* Bloque privado de cada prefijo: /24 o más largo dentro de 192.168.0.0/16; de /16 a /23, dentro de
       172.16.0.0/12; más corto, dentro de 10.0.0.0/8. */
    bloque: (p) => (p >= 24 ? ['192.168.0.0', 16] : p >= 16 ? ['172.16.0.0', 12] : ['10.0.0.0', 8]),

    redAlAzar(r, p) {
      const [base, bloque] = M.bloque(p);
      return M.aIp(M.aEntero(base) + Math.floor(r() * 2 ** (p - bloque)) * M.tamano(p));
    },

    /* Una red vecina del mismo tamaño: la siguiente o, si la red es la última de su bloque privado, la anterior. */
    vecina(red, p) {
      const [base, bloque] = M.bloque(p);
      const siguiente = M.aEntero(red) + M.tamano(p);
      return M.aIp(siguiente < M.aEntero(base) + 2 ** (32 - bloque) ? siguiente : M.aEntero(red) - M.tamano(p));
    },

    /* Una IP de equipo de la red vecina: parecida a las de la red, pero de otra red. */
    deOtraRed: (r, red, p) => M.equipo(M.vecina(red, p), entero(r, 1, Math.min(9, M.equipos(p)))),

    /* Prefijo de un elemento para un día: su tramo, en un orden propio de cada elemento, avanzando un puesto cada día.
       «paso» adelanta ese orden: con la misma clave y distinto paso, dos elementos nunca coinciden el mismo día. */
    prefijoDelDia(dia, clave, tramo, permitidos, paso = 0) {
      const lista = barajar(azar('orden|' + clave), (permitidos || PREFIJOS[tramo]).slice());
      return lista[modulo(numeroDeDia(dia) + semilla('desfase|' + clave) + paso, lista.length)];
    },

    /* Todo lo del día: la red de los laboratorios de las misiones 1 y 2 y los cinco ejercicios. */
    generar(dia) {
      const red1 = M._redDeLab(dia, 1);
      const red2 = M._redDeLab(dia, 2);
      return { dia, labs: { 1: red1, 2: red2 }, ejercicios: M._ejercicios(dia) };
    },

    /* Los dos laboratorios comparten el orden de las máscaras con un puesto de diferencia: el mismo día nunca usan la
       misma (si la misión 1 es /24, la 2 es /16 o /8). */
    _redDeLab(dia, mision) {
      const p = M.prefijoDelDia(dia, 'lab', 'principiante', null, mision - 1);
      const red = M.redAlAzar(azar(dia + '|lab-' + mision), p);
      return { red, prefijo: p, mascara: M.mascaraDe(p), puertaEnlace: M.equipo(red, 1), dns: M.equipo(red, 2) };
    },

    _ejercicios(dia) {
      return [
        M._mascaraDePrefijo(dia),
        M._ipParaImpresora(dia),
        M._mismaRed(dia),
        M._broadcastDeIpA(dia),
        M._peticionConNack(dia)
      ];
    },

    /* Misión 2 (principiante): qué máscara corresponde al prefijo de la red de hoy. */
    _mascaraDePrefijo(dia) {
      const clave = 'M2-MD';
      const r = azar(dia + '|' + clave);
      const p = M.prefijoDelDia(dia, clave, 'principiante');
      const red = M.redAlAzar(r, p);
      const mascara = M.mascaraDe(p);
      const otras = PREFIJOS.principiante.filter((q) => q !== p);
      const opciones = [mascara, ...otras.map(M.mascaraDe), '255.255.255.255'];
      const porQueNo = {};
      otras.forEach((q, i) => (porQueNo[i + 1] = `${M.mascaraDe(q)} es la máscara de una /${q}: tiene ${q} bits a 1, y la red de hoy es /${p}, con ${p} bits a 1.`));
      porQueNo[3] = '255.255.255.255 tiene los 32 bits a 1: no deja ningún bit para los equipos, así que no sirve como máscara de una red.';
      return {
        id: clave,
        mision: 2,
        nivel: 'principiante',
        tipo: 'multiple',
        intro: 'Máscara del día: la red de hoy no es la de ayer. El número tras la barra indica cuántos bits de la IP son de la red.',
        enunciado: `Hoy PC-23 tiene que entrar en la red ${red}/${p}. ¿Qué máscara de subred escribes en su tarjeta de red?`,
        opciones,
        correcta: 0,
        porQueNo,
        explicacion: `/${p} significa que los ${p} primeros bits de la máscara están a 1: ${M.binario(p)}, que es ${mascara}. Cada 255 es un número de la IP que pertenece a la red y cada 0, uno que identifica al equipo.`,
        pistas: ['Cada grupo de 8 bits a 1 forma un 255 en la máscara.', `/${p} son ${p / 8} ${p === 8 ? 'grupo' : 'grupos'} de 8 bits a 1; el resto, a 0.`],
        repasar: 'teoria-mascaras',
        fuente: [4, 13],
        ampliacion: true,
        mascaraDelDia: { tipo: 'mascara', red, prefijo: p }
      };
    },

    /* Misión 5 (intermedio): qué IP puede llevar un equipo nuevo; fallan la de red, la de broadcast y una de otra red. */
    _ipParaImpresora(dia) {
      const clave = 'M5-MD';
      const r = azar(dia + '|' + clave);
      const p = M.prefijoDelDia(dia, clave, 'intermedio');
      const red = M.redAlAzar(r, p);
      const bc = M.broadcastDe(red, p);
      const valida = M.equipo(red, entero(r, 3, M.equipos(p) - 2));
      const fuera = M.deOtraRed(r, red, p);
      return {
        id: clave,
        mision: 5,
        nivel: 'intermedio',
        tipo: 'multiple',
        intro: 'Máscara del día: con una máscara que no es /24, la frontera entre red y equipo cae dentro de un número.',
        enunciado: `La red de la oficina hoy es ${red}/${p} (máscara ${M.mascaraDe(p)}). Hay que poner a mano la IP de una impresora nueva. ¿Cuál de estas IP le sirve?`,
        opciones: [valida, red, bc, fuera],
        correcta: 0,
        porQueNo: {
          1: `${red} es la dirección de la red (todos los bits de equipo a 0): identifica a la red y no se asigna a ningún equipo.`,
          2: `${bc} es la dirección de broadcast de la red (todos los bits de equipo a 1): no se asigna a ningún equipo.`,
          3: `${fuera} pertenece a otra red, la ${M.redDe(fuera, p)}/${p}: no es de la red de la oficina.`
        },
        explicacion: `Con /${p}, cada red tiene ${M.tamano(p)} direcciones (2 elevado a ${32 - p}): la ${red} es la de la red, la ${bc} la de broadcast y los equipos usan de la ${M.equipo(red, 1)} a la ${M.equipo(red, M.equipos(p))}. La ${valida} está entre ellas.`,
        pistas: ['Calcula dónde acaba la red: la dirección de red más el tamaño del bloque, menos 1, es el broadcast.', `Con /${p}, el bloque es de ${M.tamano(p)} direcciones (2 elevado a ${32 - p}).`],
        repasar: 'teoria-mascaras',
        fuente: [4, 14, 15],
        ampliacion: true,
        mascaraDelDia: { tipo: 'ip-valida', red, prefijo: p }
      };
    },

    /* Misión 8 (intermedio): verdadero o falso, dos equipos configurados a mano están en la misma red. */
    _mismaRed(dia) {
      const clave = 'M8-MD';
      const r = azar(dia + '|' + clave);
      const p = M.prefijoDelDia(dia, clave, 'intermedio');
      const red = M.redAlAzar(r, p);
      const t = M.tamano(p);
      const [na, nb] = distintos(r, M.equipos(p), 2);
      const a = M.equipo(red, na);
      const misma = r() < 0.5;
      /* Si no es la misma red, la impresora está en la red de al lado, con una IP que se parece. */
      const b = M.equipo(misma ? red : M.vecina(red, p), nb);
      const redB = M.redDe(b, p);
      const bc = M.broadcastDe(red, p);
      return {
        id: clave,
        mision: 8,
        nivel: 'intermedio',
        tipo: 'vf',
        intro: 'Máscara del día: dos equipos solo se comunican directamente si, con su máscara, están en la misma red.',
        enunciado: `Un PC configurado a mano con la IP ${a} y la máscara ${M.mascaraDe(p)} no consigue imprimir en la impresora ${b}, que tiene la misma máscara. ¿Verdadero o falso? Con esa máscara, el PC y la impresora están en la misma red.`,
        opciones: ['Verdadero', 'Falso'],
        correcta: misma ? 0 : 1,
        porQueNo: misma
          ? { 1: `Con /${p}, las dos IP están entre la ${red} y la ${bc}: es la misma red. El fallo tiene que estar en otro sitio, por ejemplo en una IP repetida o en la impresora.` }
          : { 0: `Con /${p}, la red del PC va de la ${red} a la ${bc}, y la ${b} queda fuera: está en la red ${redB}. Sin un router entre las dos redes, no se comunican directamente.` },
        explicacion: `Para saber si dos IP están en la misma red se calcula la red de cada una con la máscara: ${a} está en la ${red}/${p} y ${b}, en la ${redB}/${p}. ${misma ? 'Coinciden: es la misma red.' : 'No coinciden: son redes distintas.'}`,
        pistas: ['Calcula la dirección de red de cada IP con la máscara: los bits de equipo, a 0.', `Con /${p}, las redes van de ${t} en ${t} direcciones.`],
        repasar: 'teoria-mascaras',
        fuente: [4],
        ampliacion: true,
        mascaraDelDia: { tipo: 'misma-red', a, b, prefijo: p, misma }
      };
    },

    /* Misión 10 (experto): la dirección de broadcast que muestra «ip a» para la IP concedida. */
    _broadcastDeIpA(dia) {
      const clave = 'M10-MD';
      const r = azar(dia + '|' + clave);
      const p = M.prefijoDelDia(dia, clave, 'experto');
      const red = M.redAlAzar(r, p);
      const ip = M.equipo(red, entero(r, 1, M.equipos(p)));
      const bc = M.broadcastDe(red, p);
      const opciones = [bc];
      const porQueNo = {};
      const anadir = (ipX, motivo) => {
        if (opciones.length < 4 && !opciones.includes(ipX)) {
          porQueNo[opciones.length] = motivo;
          opciones.push(ipX);
        }
      };
      anadir(red, `${red} es la dirección de la red, no la de broadcast: la de broadcast tiene todos los bits de equipo a 1.`);
      /* Los porqués explican el error sin decir cuál es el broadcast: tras fallar se puede volver a intentar. */
      anadir(M.aIp(M.aEntero(bc) - 1), `${M.aIp(M.aEntero(bc) - 1)} es la IP de un equipo de la red, no la de broadcast: la de broadcast tiene todos los bits de equipo a 1.`);
      const b24 = M.broadcastDe(ip, 24);
      anadir(b24, `${b24} sería el broadcast si la red fuera /24, pero es /${p}: ${p > 24 ? 'más pequeña' : 'más grande'}.`);
      for (const q of [p + 1, p - 1, p + 2, p - 2]) {
        if (q < 8 || q > 30) continue;
        const otra = M.broadcastDe(ip, q);
        const bits = Math.abs(q - p) === 1 ? 'un bit' : `${Math.abs(q - p)} bits`;
        anadir(otra, `${otra} sería el broadcast con /${q}, es decir, con ${bits} de red ${q > p ? 'de más' : 'de menos'}: la red es /${p}.`);
      }
      /* Si la red es la última de su bloque, varios de los anteriores coinciden con la respuesta: el broadcast de la
         red de al lado siempre es distinto. */
      const vecina = M.vecina(red, p);
      anadir(M.broadcastDe(vecina, p), `${M.broadcastDe(vecina, p)} es el broadcast de la red de al lado, la ${vecina}/${p}, no el de la red de ${ip}.`);
      return {
        id: clave,
        mision: 10,
        nivel: 'experto',
        tipo: 'multiple',
        intro: 'Máscara del día: en Linux, «ip a» muestra la IP con su prefijo y la dirección de broadcast (brd) de la red.',
        enunciado: `Tras renovar la concesión, «ip a» muestra «inet ${ip}/${p} brd ? scope global dynamic wlp2s0». ¿Qué dirección de broadcast falta?`,
        opciones,
        correcta: 0,
        porQueNo,
        explicacion: `La red de ${ip}/${p} es la ${red}. Con /${p} el bloque es de ${M.tamano(p)} direcciones, así que la red acaba en la ${bc}: esa es la dirección de broadcast, con todos los bits de equipo a 1.`,
        pistas: [`Primero calcula la dirección de red de ${ip} con /${p}.`, 'El broadcast es la dirección de red más el tamaño del bloque, menos 1.'],
        repasar: 'teoria-mascaras',
        fuente: [4, 21],
        ampliacion: true,
        mascaraDelDia: { tipo: 'broadcast', ip, prefijo: p }
      };
    },

    /* Misión 11 (experto): qué IP pedida en un REQUEST acabaría en NACK por no ser de la red (diap. 19). En /30 solo
       caben dos equipos, así que aquí se usan los prefijos con al menos tres. */
    _peticionConNack(dia) {
      const clave = 'M11-MD';
      const r = azar(dia + '|' + clave);
      const p = M.prefijoDelDia(dia, clave, 'experto', PREFIJOS.experto.filter((q) => M.equipos(q) >= 3));
      const red = M.redAlAzar(r, p);
      const bc = M.broadcastDe(red, p);
      const n = M.equipos(p);
      const dentro = distintos(r, n, 3).map((k) => M.equipo(red, k));
      const fuera = M.deOtraRed(r, red, p);
      const primero = M.equipo(red, 1);
      const ultimo = M.equipo(red, n);
      const porQueNo = {};
      dentro.forEach((x, i) => (porQueNo[i + 1] = `${x} está dentro de la red ${red}/${p}: si está libre, el servidor puede concedérsela con un ACK.`));
      return {
        id: clave,
        mision: 11,
        nivel: 'experto',
        tipo: 'multiple',
        intro: 'Máscara del día: el servidor responde con un NACK cuando la IP que pide el cliente no es válida para su red (diap. 19).',
        enunciado: `El servidor DHCP del aula reparte la red ${red}/${p}. Un portátil se conecta y pide en su REQUEST una IP concreta. ¿Con cuál de estas peticiones le respondería con un NACK?`,
        opciones: [fuera, ...dentro],
        correcta: 0,
        porQueNo,
        explicacion: `Con /${p}, la red ${red} acaba en la ${bc} y los equipos usan de la ${primero} a la ${ultimo}. La ${fuera} queda fuera: no es válida para esa red, así que el servidor responde con un NACK (diap. 19).`,
        pistas: ['Calcula dónde empieza y dónde acaba la red con la máscara.', 'El NACK llega cuando la IP pedida no es válida para la red del cliente.'],
        repasar: 'teoria-mascaras',
        fuente: [19],
        ampliacion: true,
        mascaraDelDia: { tipo: 'nack', red, prefijo: p }
      };
    },

    /* Pone en los datos del juego lo de hoy: la red de los laboratorios 1 y 2 y los ejercicios del día. */
    aplicar(dia) {
      const g = M.generar(dia);
      const lab1 = D.misiones.find((m) => m.id === 1).etapas.find((e) => e.tipo === 'sim-manual');
      Object.assign(lab1, g.labs[1], {
        ocupadas: [
          { ip: g.labs[1].puertaEnlace, equipo: 'Router (puerta de enlace)' },
          { ip: g.labs[1].dns, equipo: 'Servidor DNS' }
        ],
        nota: 'Escenario del juego (estos datos no salen de la presentación y cambian cada día): úsalos para configurar cada equipo.'
      });
      const lab2 = D.misiones.find((m) => m.id === 2).etapas.find((e) => e.tipo === 'lab-nic');
      const l2 = g.labs[2];
      const impresora = M.equipo(l2.red, 40);
      const remota = ['10.20.0.5', '172.31.200.5', '192.168.250.5'].find((ip) => !M.mismaRed(ip, l2.red, l2.prefijo));
      Object.assign(lab2, l2, {
        ocupadas: [
          { ip: l2.puertaEnlace, equipo: 'Router (puerta de enlace)' },
          { ip: l2.dns, equipo: 'Servidor DNS' },
          { ip: impresora, equipo: 'Impresora' }
        ],
        destinos: Object.assign({}, lab2.destinos, { local: { nombre: 'la impresora', ip: impresora }, remota: { nombre: 'el servidor de la empresa', ip: remota } }),
        nota: `Escenario del juego (cambia cada día): ${lab2.equipo} está en la red ${l2.red}/${l2.prefijo}. El router (puerta de enlace) es ${l2.puertaEnlace}, el servidor DNS es ${l2.dns} y la impresora es ${impresora}. El servidor de la empresa está en otra red, ${remota}.`
      });
      D.preguntas = (D.preguntas || []).filter((p) => !p.mascaraDelDia).concat(g.ejercicios);
      M.dia = dia;
      return g;
    }
  };

  DHCP.Mascaras = M;
  M.aplicar(hoy());
})();

</script>
  <script data-firma>
/* js/engine.js */
/* DHCP Network Lab — Núcleo: configuración, utilidades, almacenamiento (Store), router por hash,
   sonido opcional y diálogos. Scripts clásicos: todo cuelga del objeto global DHCP. */
(function () {
  'use strict';
  const DHCP = (window.DHCP = window.DHCP || {});
  DHCP.data = DHCP.data || {};

  /* ── Configuración de la gamificación (§9), reunida en un único objeto ── */
  DHCP.CONFIG = {
    version: 1,
    claveGuardado: 'dhcpLab.v1',
    puntos: { acierto: 100, sinPistas: 50, pistas: [20, 40], error: 10 },
    racha: { desde: 3, multiplicador: 1.5 },
    desbloqueo: 0.6,
    erroresParaSolucion: 2,
    velocidades: [0.25, 0.5, 1],
    duracionSalto: 750,
    /* Práctica libre: ejercicios por sesión que se pueden elegir. */
    practica: { cantidades: [5, 10, 20], porDefecto: 10 },
    tramos: [
      { id: 'principiante', nombre: 'Principiante', misiones: [1, 4] },
      { id: 'intermedio', nombre: 'Intermedio', misiones: [5, 8] },
      { id: 'experto', nombre: 'Experto', misiones: [9, 12] }
    ]
  };

  /* ── Utilidades ── */
  const util = {
    debug: /[?&]debug=1\b/.test(window.location.search),

    /* Crea un elemento HTML. attrs admite class, text, html, on<evento>, dataset, style y atributos. */
    h(tag, attrs, ...hijos) {
      const el = document.createElement(tag);
      util.aplicarAtributos(el, attrs);
      util.anadir(el, hijos);
      return el;
    },

    svg(tag, attrs, ...hijos) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      util.aplicarAtributos(el, attrs, true);
      util.anadir(el, hijos);
      return el;
    },

    aplicarAtributos(el, attrs, esSvg) {
      if (!attrs) return;
      for (const [clave, valor] of Object.entries(attrs)) {
        if (valor === undefined || valor === null || valor === false) continue;
        if (clave === 'class') el.setAttribute('class', valor);
        else if (clave === 'text') el.textContent = valor;
        else if (clave === 'html') el.innerHTML = valor;
        else if (clave === 'dataset') Object.assign(el.dataset, valor);
        else if (clave === 'style' && typeof valor === 'object') {
          /* Las propiedades personalizadas (--color-msg…) solo se pueden asignar con setProperty. */
          for (const [prop, v] of Object.entries(valor)) {
            if (prop.startsWith('--')) el.style.setProperty(prop, v);
            else el.style[prop] = v;
          }
        }
        else if (clave.startsWith('on') && typeof valor === 'function') el.addEventListener(clave.slice(2), valor);
        else if (valor === true) el.setAttribute(clave, '');
        else el.setAttribute(clave, esSvg ? String(valor) : valor);
      }
    },

    anadir(el, hijos) {
      for (const hijo of hijos.flat(Infinity)) {
        if (hijo === null || hijo === undefined || hijo === false) continue;
        el.appendChild(hijo instanceof Node ? hijo : document.createTextNode(String(hijo)));
      }
    },

    /* Icono del sprite SVG de index.html. */
    icono(nombre, clase) {
      const s = util.svg('svg', { class: 'ico ' + (clase || ''), 'aria-hidden': 'true', focusable: 'false' });
      s.appendChild(util.svg('use', { href: '#' + nombre }));
      return s;
    },

    vaciar(el) {
      while (el.firstChild) el.removeChild(el.firstChild);
      return el;
    },

    escapar(texto) {
      return String(texto).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    },

    barajar(lista) {
      const a = lista.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },

    /* Baraja asegurando que el resultado no coincide con el orden original (si hay más de un elemento). */
    barajarDistinto(lista) {
      if (lista.length < 2) return lista.slice();
      let a;
      do a = util.barajar(lista);
      while (a.every((v, i) => v === lista[i]));
      return a;
    },

    /* «Diaps. 20–24, 30, 33, 34»: tres o más diapositivas seguidas se escriben como un intervalo. */
    textoFuente(fuente) {
      const f = Array.from(new Set(fuente || [])).sort((a, b) => a - b);
      const partes = [];
      for (let i = 0; i < f.length; ) {
        let j = i;
        while (j + 1 < f.length && f[j + 1] === f[j] + 1) j++;
        if (j - i >= 2) partes.push(`${f[i]}–${f[j]}`);
        else for (let k = i; k <= j; k++) partes.push(String(f[k]));
        i = j + 1;
      }
      return (f.length === 1 ? 'Diap. ' : 'Diaps. ') + partes.join(', ');
    },

    formatoTiempo(ms) {
      const s = Math.round(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const seg = s % 60;
      if (h) return `${h} h ${m} min`;
      if (m) return `${m} min ${seg} s`;
      return `${seg} s`;
    },

    /* Con espacio de no separación, como se escribe en español: el número y el % nunca se separan de línea. */
    porcentaje(x) {
      return Math.round((x || 0) * 100) + '\u00a0%';
    },

    numero(n) {
      return Math.round(n).toLocaleString('es-ES');
    },

    movimientoReducido() {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    },

    /* «a:68 → b:67» con cada extremo indivisible: la línea solo puede partirse por la flecha. */
    direcciones(texto) {
      const partes = String(texto).split(' → ');
      const nodos = [];
      partes.forEach((p, i) => {
        if (i) nodos.push(' → ');
        nodos.push(util.h('span', { class: 'sin-cortar', text: p }));
      });
      return nodos;
    },

    /* Texto con órdenes entre comillas invertidas: «Usa `dhclient -r`» → texto + <code>. */
    conCodigo(texto) {
      return String(texto)
        .split(/(`[^`]+`)/)
        .filter(Boolean)
        .map((t) => (t[0] === '`' ? util.h('code', { text: t.slice(1, -1) }) : t));
    },

    /* El mismo texto sin las comillas invertidas (para anuncios y etiquetas). */
    sinCodigo(texto) {
      return String(texto).replace(/`/g, '');
    },

    /* Desplazamiento automático mientras se arrastra cerca del borde superior (bajo la cabecera fija)
       o inferior de la ventana. Funciona aunque el dedo se quede quieto. */
    autodesplazamiento(alDesplazar) {
      let y = null;
      let raf = null;
      const paso = () => {
        raf = null;
        if (y === null) return;
        const cabecera = document.querySelector('.cabecera');
        const arriba = cabecera ? cabecera.getBoundingClientRect().bottom : 0;
        const banda = 70;
        let v = 0;
        if (y < arriba + banda) v = -Math.ceil(((arriba + banda - y) / banda) * 14);
        else if (y > window.innerHeight - banda) v = Math.ceil(((y - (window.innerHeight - banda)) / banda) * 14);
        if (v) {
          const antes = window.scrollY;
          window.scrollBy(0, v);
          if (window.scrollY !== antes && alDesplazar) alDesplazar();
          raf = requestAnimationFrame(paso);
        }
      };
      return {
        actualizar(nuevaY) {
          y = nuevaY;
          if (!raf) raf = requestAnimationFrame(paso);
        },
        parar() {
          y = null;
          if (raf) cancelAnimationFrame(raf);
          raf = null;
        }
      };
    },

    anunciar(texto) {
      const zona = document.getElementById('anuncios');
      if (!zona) return;
      zona.textContent = '';
      window.setTimeout(() => {
        zona.textContent = texto;
      }, 30);
    }
  };
  DHCP.util = util;

  /* ── Store: progreso persistente en localStorage con clave versionada ── */
  const Store = {
    disponible: true,
    estado: null,

    defecto() {
      return {
        version: DHCP.CONFIG.version,
        misiones: {},
        ejercicios: {},
        repaso: [],
        stats: { tiempoMs: 0, pistas: 0, resueltos: 0, aciertosPrimer: 0, errores: 0, rachaMax: 0, solucionesVistas: 0 },
        logros: [],
        ajustes: { sonido: false, velocidad: 1 }
      };
    },

    guardadoIlegible: false,

    init() {
      let guardado = null;
      try {
        const prueba = DHCP.CONFIG.claveGuardado + '.prueba';
        window.localStorage.setItem(prueba, '1');
        window.localStorage.removeItem(prueba);
      } catch (e) {
        this.disponible = false;
      }
      if (this.disponible) {
        let crudo = null;
        try {
          crudo = window.localStorage.getItem(DHCP.CONFIG.claveGuardado);
          if (crudo) {
            guardado = JSON.parse(crudo);
            if (!this.valido(guardado)) throw new Error('El guardado tiene datos que no son del tipo esperado');
          }
        } catch (e) {
          /* Guardado dañado o con datos corruptos: se aparta una copia y se empieza de cero, pero se sigue guardando. */
          this.guardadoIlegible = true;
          guardado = null;
          try {
            if (crudo) window.localStorage.setItem(DHCP.CONFIG.claveGuardado + '.danado', crudo);
          } catch (err) {
            /* si tampoco se puede copiar, se pierde el guardado dañado */
          }
        }
      }
      this.estado = this.normalizar(guardado);
      if (this.guardadoIlegible) this.guardar();
    },

    /* ¿Tienen los datos guardados el tipo que espera el juego? Lo que falta se completa en normalizar(), pero un campo
       presente con otro tipo (guardado editado a mano o dañado) invalida todo el guardado: mejor empezar limpio que
       romper la pantalla de inicio o el perfil. Un guardado de otra versión no se examina: normalizar() lo descarta. */
    valido(g) {
      const d = this.defecto();
      const objeto = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
      const numero = (x) => typeof x === 'number' && Number.isFinite(x);
      const cadenas = (x) => Array.isArray(x) && x.every((s) => typeof s === 'string');
      const textos = (x) => typeof x === 'string';
      /* Nombres que, como clave de un objeto, tocarían su prototipo. */
      const claveSegura = (k) => k !== '__proto__' && k !== 'constructor' && k !== 'prototype';
      const claves = (o) => Object.keys(o).every(claveSegura);
      /* La raíz tiene que ser un objeto con su versión (un número, un texto o una lista no son un guardado). */
      if (!objeto(g) || !claves(g) || !numero(g.version)) return false;
      if (g.version !== DHCP.CONFIG.version) return true;
      /* Un registro (misión, ejercicio, estadísticas, ajustes) tiene en cada campo el tipo de su valor por defecto. */
      const registro = (e, plantilla, excepciones) => {
        if (!objeto(e) || !claves(e)) return false;
        return Object.keys(plantilla).every((k) => {
          if (!Object.hasOwn(e, k)) return true;
          if (excepciones && Object.hasOwn(excepciones, k)) return excepciones[k](e[k]);
          const p = plantilla[k];
          if (typeof p === 'boolean') return typeof e[k] === 'boolean';
          if (typeof p === 'number') return numero(e[k]);
          if (Array.isArray(p)) return cadenas(e[k]);
          /* Los mapas de la misión (requisitos y resueltas) son { id: true }. */
          if (objeto(p)) return objeto(e[k]) && claves(e[k]) && Object.values(e[k]).every((v) => typeof v === 'boolean');
          return false;
        });
      };
      const tabla = (t, plantilla, excepciones) => t === undefined || (objeto(t) && claves(t) && Object.values(t).every((e) => registro(e, plantilla, excepciones)));
      const nota = (x) => x === null || numero(x);
      const ausente = (k) => !Object.hasOwn(g, k);
      return (
        tabla(g.misiones, this.defectoMision(), { mejorNota: nota, ultimaNota: nota }) &&
        tabla(g.ejercicios, this.defectoEjercicio()) &&
        (ausente('repaso') || cadenas(g.repaso)) &&
        (ausente('stats') || registro(g.stats, d.stats)) &&
        (ausente('logros') || (Array.isArray(g.logros) && g.logros.every((l) => objeto(l) && claves(l) && textos(l.id) && textos(l.fecha)))) &&
        (ausente('ajustes') || registro(g.ajustes, d.ajustes, { velocidad: (v) => DHCP.CONFIG.velocidades.includes(v) }))
      );
    },

    /* Combina lo guardado con los valores por defecto para tolerar datos antiguos o incompletos. */
    normalizar(g) {
      const d = this.defecto();
      if (!g || typeof g !== 'object' || g.version !== DHCP.CONFIG.version) return d;
      /* Cada misión y cada ejercicio guardados se completan con sus valores por defecto: una entrada a medias
         (editada a mano o de otra versión) no deja undefined ni NaN. */
      const completar = (guardados, porDefecto) => {
        const out = {};
        if (guardados && typeof guardados === 'object') for (const [id, e] of Object.entries(guardados)) out[id] = Object.assign(porDefecto(), e && typeof e === 'object' ? e : {});
        return out;
      };
      return {
        version: d.version,
        misiones: completar(g.misiones, () => this.defectoMision()),
        ejercicios: completar(g.ejercicios, () => this.defectoEjercicio()),
        repaso: Array.isArray(g.repaso) ? g.repaso : [],
        stats: Object.assign(d.stats, g.stats || {}),
        logros: Array.isArray(g.logros) ? g.logros : [],
        ajustes: Object.assign(d.ajustes, g.ajustes || {})
      };
    },

    guardar() {
      if (!this.disponible) return;
      try {
        window.localStorage.setItem(DHCP.CONFIG.claveGuardado, JSON.stringify(this.estado));
      } catch (e) {
        this.disponible = false;
        if (DHCP.App) DHCP.App.mostrarAvisoGuardado();
      }
    },

    borrar() {
      this.estado = this.defecto();
      try {
        window.localStorage.removeItem(DHCP.CONFIG.claveGuardado);
      } catch (e) {
        /* sin almacenamiento: basta con reiniciar el estado en memoria */
      }
      this.guardar();
    },

    defectoMision() {
      return {
        completada: false,
        mejorPuntos: 0,
        mejorPrecision: 0,
        intentos: 0,
        tiempoMs: 0,
        falladas: [],
        aciertos: 0,
        total: 0,
        requisitos: {},
        resueltas: {},
        mejorNota: null,
        ultimaNota: null
      };
    },

    defectoEjercicio() {
      return { vistos: 0, aciertosPrimer: 0, errores: 0, pistas: 0, resuelto: false };
    },

    mision(id) {
      return this.estado.misiones[id] || this.defectoMision();
    },

    ejercicio(id) {
      return this.estado.ejercicios[id] || this.defectoEjercicio();
    },

    /* Registra el resultado de un ejercicio (también en modo repaso). */
    registrarEjercicio(id, r) {
      const e = this.ejercicio(id);
      e.vistos += 1;
      e.errores += r.errores;
      e.pistas += r.pistas;
      if (r.primerIntento) e.aciertosPrimer += 1;
      if (r.correcto && !r.verSolucion) e.resuelto = true;
      this.estado.ejercicios[id] = e;

      const s = this.estado.stats;
      s.pistas += r.pistas;
      s.errores += r.errores;
      if (r.correcto && !r.verSolucion) s.resueltos += 1;
      if (r.primerIntento) s.aciertosPrimer += 1;
      if (r.verSolucion) s.solucionesVistas += 1;

      const repaso = new Set(this.estado.repaso);
      if (r.primerIntento) {
        repaso.delete(id);
        /* Acertado a la primera, deja de estar pendiente también en las misiones (y en el examen) donde se falló. */
        for (const m of Object.values(this.estado.misiones)) if (m.falladas) m.falladas = m.falladas.filter((x) => x !== id);
      } else repaso.add(id);
      this.estado.repaso = Array.from(repaso);
      this.guardar();
    },

    /* Registra el final de una partida (normal o de repaso) y evalúa el criterio con lo acumulado:
       mejor precisión de una partida completa + requisitos cumplidos en cualquier partida.
       Devuelve true si la misión se acaba de completar. */
    registrarMision(id, r) {
      const m = this.mision(id);
      const yaCompletada = m.completada;
      m.requisitos = Object.assign({}, m.requisitos);
      for (const q of r.requeridos) if (q.ok) m.requisitos[q.id] = true;
      m.resueltas = Object.assign({}, m.resueltas);
      for (const ej of r.resueltas || []) m.resueltas[ej] = true;
      if (r.repaso) {
        m.falladas = (m.falladas || []).filter((x) => !r.acertadas.includes(x));
      } else {
        m.intentos += 1;
        m.tiempoMs += r.tiempoMs;
        m.mejorPuntos = Math.max(m.mejorPuntos, r.puntos);
        m.mejorPrecision = Math.max(m.mejorPrecision, r.precision);
        m.aciertos = r.aciertos;
        m.total = r.total;
        m.falladas = r.falladas;
        /* Examen final: la nota (sobre 10) queda registrada. */
        if (typeof r.nota === 'number') {
          m.ultimaNota = r.nota;
          m.mejorNota = Math.max(m.mejorNota || 0, r.nota);
        }
      }
      const criterio = r.criterio;
      const todasOk = !criterio.todas || (r.idsTodas || []).every((id) => m.resueltas[id]);
      if (m.mejorPrecision >= criterio.precisionMinima && (criterio.requiere || []).every((q) => m.requisitos[q]) && todasOk) m.completada = true;
      this.estado.misiones[id] = m;
      this.estado.stats.rachaMax = Math.max(this.estado.stats.rachaMax, r.rachaMax || 0);
      this.guardar();
      return !yaCompletada && m.completada;
    },

    /* Práctica libre: no cuenta para la campaña, pero su mejor racha sí cuenta en las estadísticas. */
    registrarPractica(r) {
      this.estado.stats.rachaMax = Math.max(this.estado.stats.rachaMax, r.rachaMax || 0);
      this.guardar();
    },

    sumarTiempo(ms) {
      this.estado.stats.tiempoMs += ms;
      this.guardar();
    },

    puntuacionTotal() {
      return Object.values(this.estado.misiones).reduce((t, m) => t + (m.mejorPuntos || 0), 0);
    },

    ajuste(clave, valor) {
      if (valor === undefined) return this.estado.ajustes[clave];
      this.estado.ajustes[clave] = valor;
      this.guardar();
      return valor;
    },

    /* Insignias ganadas: [{ id, fecha }], con la fecha local del jugador (AAAA-MM-DD). */
    logro(id) {
      return this.estado.logros.find((l) => l.id === id) || null;
    },

    /* Devuelve true si se acaba de ganar (false si ya se tenía). */
    ganarInsignia(id) {
      if (this.logro(id)) return false;
      const d = new Date();
      const dos = (n) => String(n).padStart(2, '0');
      this.estado.logros.push({ id, fecha: `${d.getFullYear()}-${dos(d.getMonth() + 1)}-${dos(d.getDate())}` });
      this.guardar();
      return true;
    }
  };
  DHCP.Store = Store;

  /* ── Insignias: evalúa las condiciones de DHCP.data.insignias al terminar una partida ──
     ctx: { mision, modo, resumen, pistasUsadas, solucionesVistas, completada, nota } */
  const Insignias = {
    cumple(c, ctx) {
      const normal = ctx.modo === 'normal';
      const deMision = c.mision === undefined || c.mision === ctx.mision.id;
      switch (c.tipo) {
        case 'completar':
          return Store.mision(c.mision).completada;
        case 'precision':
          return normal && deMision && ctx.resumen.total > 0 && ctx.resumen.precision >= c.valor;
        case 'sinSoluciones':
          return normal && deMision && ctx.completada && ctx.solucionesVistas === 0;
        case 'sinPistas':
          return normal && deMision && !ctx.mision.examen && ctx.completada && ctx.pistasUsadas === 0;
        case 'racha':
          return (ctx.resumen.rachaMax || 0) >= c.valor;
        case 'nota':
          return typeof ctx.nota === 'number' && ctx.nota >= c.valor;
        case 'campana':
          return (DHCP.data.misiones || []).every((m) => Store.mision(m.id).completada);
        default:
          return false;
      }
    },

    /* Devuelve las insignias que se acaban de ganar (ganarInsignia descarta las que ya se tenían). */
    evaluar(ctx) {
      return (DHCP.data.insignias || []).filter((i) => this.cumple(i.condicion, ctx) && Store.ganarInsignia(i.id));
    }
  };
  DHCP.Insignias = Insignias;

  /* ── Examen final: elige sus ejercicios del banco ──
     Sin Ampliación, de las misiones que no son examen, al menos uno de cada misión y tantos de cada nivel
     como fije examen.porNivel. Cada vez que se empieza, la selección cambia. */
  const ordenBanco = (a, b) => a.mision - b.mision || a.id.localeCompare(b.id, 'es', { numeric: true });
  const Examen = {
    orden: ordenBanco,

    misiones() {
      return (DHCP.data.misiones || []).filter((m) => !m.examen).map((m) => m.id);
    },

    candidatos() {
      const validas = new Set(this.misiones());
      return (DHCP.data.preguntas || []).filter((p) => !p.ampliacion && validas.has(p.mision));
    },

    /* Elige el nivel del ejercicio obligatorio de cada misión sin pasarse del cupo de ningún nivel: es un
       emparejamiento entre misiones y plazas de nivel (caminos de aumento). Devuelve { misión: nivel } o
       null si no se puede cubrir alguna misión. */
    asignarNiveles(candidatos, cupos) {
      const niveles = {};
      for (const p of candidatos) (niveles[p.mision] = niveles[p.mision] || new Set()).add(p.nivel);
      const plazas = [];
      for (const [nivel, n] of Object.entries(cupos)) for (let i = 0; i < n; i++) plazas.push(nivel);
      const ocupante = plazas.map(() => null);
      const colocar = (mision, vistas) => {
        for (const i of util.barajar(plazas.map((_, k) => k))) {
          if (vistas.has(i) || !niveles[mision] || !niveles[mision].has(plazas[i])) continue;
          vistas.add(i);
          if (ocupante[i] === null || colocar(ocupante[i], vistas)) {
            ocupante[i] = mision;
            return true;
          }
        }
        return false;
      };
      for (const m of util.barajar(this.misiones())) if (!colocar(m, new Set())) return null;
      const asignado = {};
      ocupante.forEach((m, i) => {
        if (m !== null) asignado[m] = plazas[i];
      });
      return asignado;
    },

    /* null si el banco permite montar el examen; si no, el motivo. */
    problema(examen) {
      const cand = this.candidatos();
      const suma = Object.values(examen.porNivel).reduce((a, b) => a + b, 0);
      if (suma !== examen.total) return `los cupos por nivel suman ${suma} y el examen tiene ${examen.total} ejercicios`;
      for (const [nivel, n] of Object.entries(examen.porNivel)) {
        const hay = cand.filter((p) => p.nivel === nivel).length;
        if (hay < n) return `pide ${n} ejercicios de nivel ${nivel} y el banco solo tiene ${hay} que no sean de Ampliación`;
      }
      if (!this.asignarNiveles(cand, examen.porNivel)) return 'no se puede incluir un ejercicio de cada misión sin pasarse de los cupos por nivel';
      return null;
    },

    seleccionar(examen) {
      const cand = this.candidatos();
      const elegidos = [];
      const usados = new Set();
      const tomar = (p) => {
        elegidos.push(p);
        usados.add(p.id);
      };
      const asignado = this.asignarNiveles(cand, examen.porNivel);
      if (asignado) {
        for (const [m, nivel] of Object.entries(asignado)) tomar(util.barajar(cand.filter((p) => p.mision === Number(m) && p.nivel === nivel))[0]);
        for (const [nivel, n] of Object.entries(examen.porNivel)) {
          const faltan = n - elegidos.filter((p) => p.nivel === nivel).length;
          util.barajar(cand.filter((p) => p.nivel === nivel && !usados.has(p.id))).slice(0, Math.max(0, faltan)).forEach(tomar);
        }
      }
      /* Si el banco no diera para los cupos (el validador lo avisa), se completa con lo que haya. */
      if (elegidos.length < examen.total) util.barajar(cand.filter((p) => !usados.has(p.id))).slice(0, examen.total - elegidos.length).forEach(tomar);
      return elegidos.slice(0, examen.total).sort(ordenBanco);
    }
  };
  DHCP.Examen = Examen;

  /* ── Router por hash (#/inicio, #/mision/6…) para que funcione el botón Atrás ── */
  const Router = {
    rutas: [],
    actual: null,

    add(patron, manejador) {
      const nombres = [];
      const regex = new RegExp(
        '^' +
          patron.replace(/:([a-z]+)/gi, (_, n) => {
            nombres.push(n);
            return '([^/]+)';
          }) +
          '$'
      );
      this.rutas.push({ patron, regex, nombres, manejador });
    },

    start(porDefecto) {
      this.porDefecto = porDefecto;
      window.addEventListener('hashchange', () => this.resolver());
      this.resolver();
    },

    go(ruta) {
      const destino = '#' + ruta;
      if (window.location.hash === destino) this.resolver();
      else window.location.hash = destino;
    },

    resolver() {
      const hash = window.location.hash || '';
      /* Los anclajes de la página (p. ej. el enlace «Saltar al contenido») no son rutas. */
      if (hash && !hash.startsWith('#/') && this.actual) return;
      const ruta = hash.replace(/^#/, '') || this.porDefecto;
      for (const r of this.rutas) {
        const m = ruta.match(r.regex);
        if (m) {
          const params = {};
          r.nombres.forEach((n, i) => {
            try {
              params[n] = decodeURIComponent(m[i + 1]);
            } catch (e) {
              params[n] = m[i + 1];
            }
          });
          this.actual = { ruta, patron: r.patron, params };
          r.manejador(params);
          return;
        }
      }
      /* Ruta desconocida: se sustituye en el historial para que «Atrás» no vuelva a ella. */
      try {
        window.history.replaceState(null, '', '#' + this.porDefecto);
      } catch (e) {
        window.location.replace('#' + this.porDefecto);
        return;
      }
      this.resolver();
    }
  };
  DHCP.Router = Router;

  /* ── Sonido opcional con Web Audio (desactivado por defecto) ── */
  const Sonido = {
    ctx: null,
    activo() {
      return !!Store.ajuste('sonido');
    },
    tono(frecuencias, duracion, tipo) {
      if (!this.activo()) return;
      try {
        if (!this.ctx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          this.ctx = new Ctx();
        }
        const ctx = this.ctx;
        if (ctx.state === 'suspended') ctx.resume();
        let t = ctx.currentTime;
        for (const f of frecuencias) {
          const osc = ctx.createOscillator();
          const gan = ctx.createGain();
          osc.type = tipo || 'sine';
          osc.frequency.value = f;
          gan.gain.setValueAtTime(0.0001, t);
          gan.gain.exponentialRampToValueAtTime(0.12, t + 0.015);
          gan.gain.exponentialRampToValueAtTime(0.0001, t + duracion);
          osc.connect(gan).connect(ctx.destination);
          osc.start(t);
          osc.stop(t + duracion + 0.02);
          t += duracion * 0.8;
        }
      } catch (e) {
        /* el sonido es opcional: si falla, se ignora */
      }
    },
    acierto() {
      this.tono([660, 880], 0.12);
    },
    error() {
      this.tono([220, 180], 0.16, 'triangle');
    },
    paquete() {
      this.tono([520], 0.06, 'square');
    },
    fin() {
      this.tono([523, 659, 784, 1046], 0.12);
    }
  };
  DHCP.Sonido = Sonido;

  /* ── Diálogos modales accesibles (Esc cierra, el foco vuelve a donde estaba) ── */
  const Modal = {
    abiertos: [],

    abrir({ titulo, contenido, acciones, etiquetaCerrar, clase }) {
      const capa = document.getElementById('capa-modal');
      const previo = document.activeElement;
      const idTitulo = 'modal-titulo-' + Date.now();
      const caja = util.h('div', { class: 'modal ' + (clase || ''), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': idTitulo, tabindex: '-1' });
      const fondo = util.h('div', { class: 'modal-fondo' }, caja);
      const cerrar = (valor) => {
        if (!fondo.isConnected) return;
        fondo.remove();
        document.removeEventListener('keydown', teclado, true);
        this.abiertos = this.abiertos.filter((x) => x !== instancia);
        if (!this.abiertos.length) document.body.classList.remove('con-modal');
        if (previo && previo.focus && previo.isConnected) previo.focus();
        if (instancia.alCerrar) instancia.alCerrar(valor);
      };
      const teclado = (e) => {
        if (this.abiertos[this.abiertos.length - 1] !== instancia) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          cerrar(false);
        } else if (e.key === 'Tab') {
          const foco = caja.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
          if (!foco.length) return;
          const primero = foco[0];
          const ultimo = foco[foco.length - 1];
          if (document.activeElement === caja || !caja.contains(document.activeElement)) {
            e.preventDefault();
            (e.shiftKey ? ultimo : primero).focus();
          } else if (e.shiftKey && document.activeElement === primero) {
            e.preventDefault();
            ultimo.focus();
          } else if (!e.shiftKey && document.activeElement === ultimo) {
            e.preventDefault();
            primero.focus();
          }
        }
      };
      const cabecera = util.h(
        'div',
        { class: 'modal-cabecera' },
        util.h('h2', { id: idTitulo, text: titulo }),
        util.h('button', { type: 'button', class: 'btn-icono', 'aria-label': etiquetaCerrar || 'Cerrar', onclick: () => cerrar(false) }, util.icono('i-cruz'))
      );
      const cuerpo = util.h('div', { class: 'modal-cuerpo' }, contenido);
      caja.append(cabecera, cuerpo);
      if (acciones && acciones.length) {
        caja.appendChild(
          util.h(
            'div',
            { class: 'modal-acciones' },
            acciones.map((a) =>
              util.h('button', {
                type: 'button',
                class: 'btn ' + (a.clase || (a.primario ? 'btn-primario' : 'btn-secundario')),
                text: a.texto,
                onclick: () => cerrar(a.valor)
              })
            )
          )
        );
      }
      fondo.addEventListener('mousedown', (e) => {
        if (e.target === fondo) cerrar(false);
      });
      document.addEventListener('keydown', teclado, true);
      const instancia = { cerrar, alCerrar: null, caja };
      this.abiertos.push(instancia);
      capa.appendChild(fondo);
      document.body.classList.add('con-modal');
      /* Foco inicial: la acción principal; en diálogos peligrosos, la opción segura (Cancelar). */
      const focoInicial = caja.querySelector('.modal-acciones .btn-primario') || (caja.querySelector('.modal-acciones .btn-peligro') && caja.querySelector('.modal-acciones .btn-secundario')) || caja;
      focoInicial.focus();
      return instancia;
    },

    confirmar({ titulo, texto, si, no, peligro }) {
      return new Promise((resolve) => {
        const m = this.abrir({
          titulo,
          contenido: util.h('p', { text: texto }),
          acciones: [
            { texto: no || 'Cancelar', valor: false },
            { texto: si || 'Aceptar', valor: true, primario: true, clase: peligro ? 'btn-peligro' : 'btn-primario' }
          ]
        });
        m.alCerrar = (v) => resolve(v === true);
      });
    }
  };
  DHCP.Modal = Modal;
})();

</script>
  <script data-firma>
/* js/animator.js */
/* DHCP Network Lab — Animación de paquetes.
   Reloj: interpolaciones con requestAnimationFrame que admiten pausa y velocidad.
   PacketAnimator: dibuja un escenario en SVG (topología con switch o diagrama de escalera) y anima
   cada mensaje con send({tipo, de, a, modo, ipOrigen, ipDestino, puertoOrigen, puertoDestino}).
   Secuenciador: reproduce una lista de mensajes paso a paso o en automático, con paso atrás. */
(function () {
  'use strict';
  const { util } = DHCP;
  const { h, svg } = util;

  /* ── Reloj ── */
  class Reloj {
    constructor() {
      this.velocidad = 1;
      this.pausado = false;
      this.tareas = new Set();
      this._raf = null;
      this._ultimo = 0;
    }

    /* Interpola de 0 a 1 en «duracion» ms de reloj. Con movimiento reducido salta al final,
       salvo que la tarea sea una espera de lectura (opciones.real). */
    tween(duracion, alActualizar, opciones) {
      const real = opciones && opciones.real;
      return new Promise((resolve) => {
        if (duracion <= 0 || (!real && util.movimientoReducido())) {
          alActualizar(1);
          resolve(true);
          return;
        }
        const tarea = { t: 0, duracion, alActualizar, resolve };
        this.tareas.add(tarea);
        alActualizar(0);
        this._arrancar();
      });
    }

    esperar(ms) {
      return this.tween(ms, () => {}, { real: true });
    }

    _arrancar() {
      if (this._raf) return;
      this._ultimo = performance.now();
      const paso = (ahora) => {
        const dt = Math.min(100, ahora - this._ultimo);
        this._ultimo = ahora;
        if (!this.pausado) {
          for (const t of Array.from(this.tareas)) {
            t.t += dt * this.velocidad;
            const p = Math.min(1, t.t / t.duracion);
            t.alActualizar(p);
            if (p >= 1) {
              this.tareas.delete(t);
              t.resolve(true);
            }
          }
        }
        this._raf = this.tareas.size ? requestAnimationFrame(paso) : null;
      };
      this._raf = requestAnimationFrame(paso);
    }

    /* Lleva al final todas las interpolaciones en curso. */
    completar() {
      for (const t of Array.from(this.tareas)) {
        t.alActualizar(1);
        this.tareas.delete(t);
        t.resolve(true);
      }
    }

    /* Cancela las interpolaciones en curso sin completarlas. */
    cancelar() {
      for (const t of Array.from(this.tareas)) {
        this.tareas.delete(t);
        t.resolve(false);
      }
    }
  }

  const ICONO_NODO = {
    cliente: 'i-portatil',
    servidor: 'i-servidor',
    pc: 'i-pc',
    impresora: 'i-impresora',
    switch: 'i-switch',
    router: 'i-router',
    movil: 'i-movil'
  };

  const esServidorDHCP = (nodo) => nodo.tipo === 'servidor';

  /* Quién procesa un broadcast: los del cliente (DISCOVER, REQUEST, DECLINE) los procesan los servidores DHCP;
     los del servidor (NACK) solo el cliente al que van dirigidos («para»). El resto de equipos los descarta. */
  const procesaBroadcast = (msg, nodo) => {
    const def = DHCP.data.mensajes[msg.tipo];
    return def && def.emisor === 'servidor' ? nodo.id === msg.para : esServidorDHCP(nodo);
  };

  /* Descripción legible de un mensaje dentro de un escenario. */
  function describir(msg, escenario) {
    const def = DHCP.data.mensajes[msg.tipo];
    const nodo = (id) => escenario.nodos.find((n) => n.id === id);
    const de = nodo(msg.de);
    const a = msg.a === '*' ? null : nodo(msg.a);
    const nombreNodo = (n) => (n ? n.etiqueta : '?');
    const dir = (ip, puerto) => (ip ? ip + (puerto ? ':' + puerto : '') : null);
    const origen = dir(msg.ipOrigen, msg.puertoOrigen);
    const destino = dir(msg.ipDestino, msg.puertoDestino);
    return {
      def,
      nombre: def.nombre,
      ruta: nombreNodo(de) + ' → ' + (a ? nombreNodo(a) : msg.para ? `todos (va dirigido a ${nombreNodo(nodo(msg.para))})` : 'todos'),
      modo: msg.modo,
      direcciones: origen && destino ? origen + ' → ' + destino : null
    };
  }

  /* ── PacketAnimator ── */
  class PacketAnimator {
    constructor(contenedor, escenario, opciones) {
      const o = opciones || {};
      this.contenedor = contenedor;
      this.escenario = escenario;
      this.layout = o.layout || 'topologia';
      this.alClicPaquete = o.alClicPaquete || null;
      this.alEstado = o.alEstado || null;
      this.reloj = o.reloj || new Reloj();
      this.filas = o.filas || (escenario.mensajes ? escenario.mensajes.length : 4);
      this.titulo = o.titulo || 'Diagrama de la red';
      this.generacion = 0;
      this.registro = [];
      this.estadoNodos = {};
      this.nodos = escenario.nodos.filter((n) => this.layout === 'topologia' || n.tipo !== 'switch');
      this._construir();
    }

    nodo(id) {
      return this.nodos.find((n) => n.id === id);
    }

    /* Con «saltar» activo (Paso pulsado a mitad de un mensaje) el resto del mensaje se dibuja al instante. */
    duracion(instantaneo) {
      return instantaneo || this._saltar ? 0 : DHCP.CONFIG.duracionSalto;
    }

    _construir() {
      util.vaciar(this.contenedor);
      const esc = this.layout === 'escalera';
      /* En pantallas estrechas la escalera usa un lienzo más estrecho: así se escala menos y el texto no encoge. */
      this.estrecho = esc && window.innerWidth < 480;
      this.ancho = this.estrecho ? 300 : 400;
      this.alto = esc ? 112 + this.filas * 62 : 300;
      this.svg = svg('svg', {
        class: 'animador animador-' + this.layout,
        viewBox: `0 0 ${this.ancho} ${this.alto}`,
        role: 'img',
        'aria-label': this.titulo
      });
      this.gFondo = svg('g', { class: 'capa-fondo' });
      this.gOndas = svg('g', { class: 'capa-ondas' });
      this.gFlechas = svg('g', { class: 'capa-flechas' });
      this.gNodos = svg('g', { class: 'capa-nodos' });
      this.gPaquetes = svg('g', { class: 'capa-paquetes' });
      this.svg.append(this.gFondo, this.gOndas, this.gFlechas, this.gNodos, this.gPaquetes);
      this.contenedor.appendChild(this.svg);
      if (esc) this._construirEscalera();
      else this._construirTopologia();
    }

    /* Topología en estrella alrededor de un switch. */
    _construirTopologia() {
      const sw = this.nodos.find((n) => n.tipo === 'switch');
      this.switchId = sw ? sw.id : null;
      this.posiciones = {};
      for (const n of this.nodos) this.posiciones[n.id] = { x: n.pos.x, y: n.pos.y };
      if (sw) {
        for (const n of this.nodos) {
          if (n === sw) continue;
          this.gFondo.appendChild(svg('line', { class: 'cable', x1: sw.pos.x, y1: sw.pos.y, x2: n.pos.x, y2: n.pos.y }));
        }
      }
      this.elNodos = {};
      for (const n of this.nodos) {
        const { x, y } = n.pos;
        const arriba = sw && n !== sw && y < sw.pos.y;
        const lateral = !sw || n === sw || y === sw.pos.y;
        const g = svg('g', { class: 'nodo nodo-' + n.tipo, transform: `translate(${x},${y})` });
        const r = n.tipo === 'switch' ? 20 : 25;
        g.appendChild(svg('circle', { class: 'nodo-fondo', r }));
        const uso = svg('use', { href: '#' + (n.icono || ICONO_NODO[n.tipo] || 'i-pc'), x: -15, y: -15, width: 30, height: 30, class: 'nodo-icono' });
        g.appendChild(uso);
        const yEtiqueta = arriba ? -50 : 41;
        const etiqueta = svg('text', { class: 'nodo-etiqueta', x: 0, y: yEtiqueta, 'text-anchor': 'middle' }, n.etiqueta);
        const ip = svg('text', { class: 'nodo-ip', x: 0, y: yEtiqueta + 14, 'text-anchor': 'middle' }, this._textoIp(n));
        if (n.tipo !== 'switch') g.append(etiqueta, ip);
        const insignia = lateral
          ? svg('text', { class: 'nodo-insignia', x: 0, y: -33, 'text-anchor': 'middle' })
          : svg('text', { class: 'nodo-insignia', x: 32, y: 5, 'text-anchor': 'start' });
        g.appendChild(insignia);
        this.gNodos.appendChild(g);
        this.elNodos[n.id] = { g, ip, insignia };
      }
    }

    /* Diagrama de escalera: una calle vertical por equipo y una fila por mensaje. */
    _construirEscalera() {
      const n = this.nodos.length;
      const margen = this.estrecho ? 46 : 58;
      const paso = n > 1 ? (this.ancho - 2 * margen) / (n - 1) : 0;
      this.posiciones = {};
      this.elNodos = {};
      this.nodos.forEach((nodo, i) => {
        const x = n > 1 ? margen + i * paso : this.ancho / 2;
        this.posiciones[nodo.id] = { x, y: 34 };
        this.gFondo.appendChild(svg('line', { class: 'calle', x1: x, y1: 96, x2: x, y2: this.alto - 8 }));
        const g = svg('g', { class: 'nodo nodo-' + nodo.tipo, transform: `translate(${x},34)` });
        g.appendChild(svg('circle', { class: 'nodo-fondo', r: 22 }));
        g.appendChild(svg('use', { href: '#' + (nodo.icono || ICONO_NODO[nodo.tipo] || 'i-pc'), x: -14, y: -14, width: 28, height: 28, class: 'nodo-icono' }));
        g.appendChild(svg('text', { class: 'nodo-etiqueta', x: 0, y: 40, 'text-anchor': 'middle' }, nodo.etiqueta));
        const ip = svg('text', { class: 'nodo-ip', x: 0, y: 54, 'text-anchor': 'middle' }, this._textoIp(nodo));
        g.appendChild(ip);
        this.gNodos.appendChild(g);
        this.elNodos[nodo.id] = { g, ip, insignia: null };
      });
    }

    yFila(fila) {
      return 124 + fila * 62;
    }

    _textoIp(n) {
      const est = this.estadoNodos[n.id];
      if (est && est.ip) return est.ip;
      if (n.ip) return n.ip;
      return n.tipo === 'switch' ? '' : 'sin IP';
    }

    _actualizarNodo(id) {
      const n = this.nodo(id);
      const el = this.elNodos[id];
      if (!n || !el) return;
      el.ip.textContent = this._textoIp(n);
      const est = this.estadoNodos[id];
      el.g.classList.toggle('configurado', !!(est && est.configurado));
    }

    _insignia(id, texto, clase) {
      const el = this.elNodos[id];
      if (!el || !el.insignia) return;
      el.insignia.textContent = texto || '';
      el.insignia.setAttribute('class', 'nodo-insignia ' + (clase || ''));
    }

    _limpiarInsignias() {
      for (const id of Object.keys(this.elNodos)) this._insignia(id, '');
    }

    /* Crea el «sobre» de un paquete: color, icono y nombre propios de cada mensaje. */
    _crearPaquete(msg, pos, compacto) {
      const def = DHCP.data.mensajes[msg.tipo];
      const ancho = compacto ? 84 : 98;
      const g = svg('g', {
        class: 'paquete paquete-' + msg.tipo.toLowerCase(),
        transform: `translate(${pos.x},${pos.y})`,
        tabindex: this.alClicPaquete ? '0' : null,
        role: this.alClicPaquete ? 'button' : null,
        'aria-label': `${def.nombre}, ${msg.modo}. Abrir ficha del mensaje`
      });
      /* Zona de toque transparente, más alta que el paquete, para que sea fácil de pulsar con el dedo. */
      if (this.alClicPaquete) g.appendChild(svg('rect', { x: -ancho / 2 - 4, y: -29, width: ancho + 8, height: 58, class: 'zona-toque' }));
      g.appendChild(svg('rect', { x: -ancho / 2, y: -12, width: ancho, height: 24, rx: 6, fill: def.color, class: 'paquete-caja' }));
      g.appendChild(svg('use', { href: '#' + def.icono, x: -ancho / 2 + 4, y: -8, width: 16, height: 16, class: 'paquete-icono' }));
      g.appendChild(svg('text', { x: 9, y: 4, 'text-anchor': 'middle', class: 'paquete-texto' }, def.nombre));
      if (this.alClicPaquete) {
        const abrir = (e) => {
          e.stopPropagation();
          this.alClicPaquete(msg);
        };
        g.addEventListener('click', abrir);
        g.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            abrir(e);
          }
        });
      }
      this.gPaquetes.appendChild(g);
      return g;
    }

    /* Punto junto al borde de un nodo, en dirección a «hacia», para que el paquete no tape el icono. */
    _borde(nodo, hacia, compacto) {
      const dx = hacia.x - nodo.x;
      const dy = hacia.y - nodo.y;
      const d = Math.hypot(dx, dy);
      if (!d) return { x: nodo.x, y: nodo.y };
      const separacion = Math.abs(dx) > Math.abs(dy) ? 28 + (compacto ? 42 : 49) : 28 + 14;
      const k = Math.min(separacion, d / 2) / d;
      return { x: nodo.x + dx * k, y: nodo.y + dy * k };
    }

    _mover(el, a, b, duracion) {
      return this.reloj.tween(duracion, (p) => {
        const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const x = a.x + (b.x - a.x) * e;
        const y = a.y + (b.y - a.y) * e;
        el.setAttribute('transform', `translate(${x},${y})`);
      });
    }

    _onda(centro, color, radio, instantaneo) {
      if (instantaneo || this._saltar || util.movimientoReducido()) return Promise.resolve();
      const anillos = [0, 1].map(() => this.gOndas.appendChild(svg('circle', { class: 'onda', cx: centro.x, cy: centro.y, r: 6, stroke: color })));
      return Promise.all(
        anillos.map((c, i) =>
          this.reloj
            .tween(this.duracion() * 1.1, (p) => {
              const q = Math.max(0, Math.min(1, p * 1.25 - i * 0.25));
              c.setAttribute('r', String(6 + q * radio));
              c.setAttribute('opacity', String(1 - q));
            })
            .then(() => c.remove())
        )
      );
    }

    _emitir(info) {
      if (this.alEstado) this.alEstado(info);
    }

    /* Aplica el efecto de un mensaje entregado sobre el estado de los nodos. */
    _efecto(msg) {
      if (msg.tipo === 'ACK' && msg.a !== '*') {
        this.estadoNodos[msg.a] = { ip: msg.ipDestino, configurado: true };
        this._actualizarNodo(msg.a);
      } else if (msg.tipo === 'RELEASE' || msg.tipo === 'DECLINE') {
        /* Tras un RELEASE o un DECLINE el cliente deja de usar esa IP. */
        this.estadoNodos[msg.de] = { ip: null, configurado: false };
        this._actualizarNodo(msg.de);
      } else if (msg.tipo === 'NACK' && msg.para) {
        /* Con un NACK el cliente no puede usar la IP que pedía: se queda sin configurar. */
        this.estadoNodos[msg.para] = { ip: null, configurado: false };
        this._actualizarNodo(msg.para);
      }
    }

    /* Envía un mensaje. Devuelve una Promise con {estado, entregadoA, descartadoPor}. */
    send(msg, opciones) {
      const instantaneo = !!(opciones && opciones.instantaneo);
      const fila = opciones && typeof opciones.fila === 'number' ? opciones.fila : this.registro.length;
      return this.layout === 'escalera' ? this._sendEscalera(msg, fila, instantaneo) : this._sendTopologia(msg, instantaneo);
    }

    async _sendTopologia(msg, instantaneo) {
      const gen = this.generacion;
      const def = DHCP.data.mensajes[msg.tipo];
      this._saltar = false;
      const dur = () => this.duracion(instantaneo);
      util.vaciar(this.gPaquetes);
      this._limpiarInsignias();
      const origen = this.posiciones[msg.de];
      const sw = this.switchId ? this.posiciones[this.switchId] : null;
      const resultado = { msg, estado: 'enviando', entregadoA: [], descartadoPor: [] };
      this._emitir(resultado);
      if (!instantaneo) DHCP.Sonido.paquete();

      const salida = this._borde(origen, sw || this.posiciones[msg.a] || origen, false);
      let paquete = this._crearPaquete(msg, salida);
      if (sw) {
        await this._mover(paquete, salida, sw, dur());
        if (gen !== this.generacion) return { estado: 'cancelado' };
      }
      const desde = sw || salida;
      if (msg.modo === 'broadcast') {
        const destinos = this.nodos.filter((n) => n.id !== msg.de && n.id !== this.switchId);
        const onda = this._onda(desde, def.color, 190, instantaneo);
        paquete.remove();
        const copias = destinos.map((d) => ({ d, el: this._crearPaquete(msg, desde, true) }));
        await Promise.all(copias.map((c) => this._mover(c.el, desde, this._borde(this.posiciones[c.d.id], desde, true), dur())));
        await onda;
        if (gen !== this.generacion) return { estado: 'cancelado' };
        for (const c of copias) {
          if (procesaBroadcast(msg, c.d)) {
            resultado.entregadoA.push(c.d.id);
            c.el.classList.add('entregado');
            this._insignia(c.d.id, '✓ Procesa', 'ok');
          } else {
            resultado.descartadoPor.push(c.d.id);
            c.el.classList.add('descartado');
            this._insignia(c.d.id, '✕ Descarta', 'descarta');
          }
        }
      } else {
        await this._mover(paquete, desde, this._borde(this.posiciones[msg.a], desde, false), dur());
        if (gen !== this.generacion) return { estado: 'cancelado' };
        paquete.classList.add('entregado');
        resultado.entregadoA.push(msg.a);
        this._insignia(msg.a, '✓ Recibe', 'ok');
      }
      this._efecto(msg);
      resultado.estado = 'entregado';
      this.registro.push({ tipo: msg.tipo, de: msg.de, a: msg.a, para: msg.para, modo: msg.modo, entregadoA: resultado.entregadoA.slice(), descartadoPor: resultado.descartadoPor.slice() });
      this._emitir(resultado);
      return resultado;
    }

    /* Hueco de una fila del diagrama de escalera (mensaje que el jugador debe descubrir). */
    marcarHueco(fila) {
      const y = this.yFila(fila);
      const xs = Object.values(this.posiciones).map((p) => p.x);
      const x1 = Math.min(...xs);
      const x2 = Math.max(...xs);
      const g = svg('g', { class: 'hueco-fila', 'data-fila': fila });
      g.appendChild(svg('rect', { x: x1 - 8, y: y - 20, width: x2 - x1 + 16, height: 34, rx: 8 }));
      g.appendChild(svg('text', { x: (x1 + x2) / 2, y: y + 2, 'text-anchor': 'middle' }, '? mensaje que falta'));
      this.gFlechas.appendChild(g);
      return g;
    }

    async _sendEscalera(msg, fila, instantaneo) {
      const gen = this.generacion;
      const def = DHCP.data.mensajes[msg.tipo];
      this._saltar = false;
      const dur = this.duracion(instantaneo);
      const y = this.yFila(fila);
      const hueco = this.gFlechas.querySelector(`.hueco-fila[data-fila="${fila}"]`);
      if (hueco) hueco.remove();
      const resultado = { msg, estado: 'enviando', entregadoA: [], descartadoPor: [] };
      this._emitir(resultado);
      if (!instantaneo) DHCP.Sonido.paquete();

      const xo = this.posiciones[msg.de].x;
      const destinos = msg.modo === 'broadcast' ? this.nodos.filter((n) => n.id !== msg.de) : [this.nodo(msg.a)];
      const xs = destinos.map((d) => this.posiciones[d.id].x);
      const izquierda = Math.min(xo, ...xs);
      const derecha = Math.max(xo, ...xs);
      const g = svg('g', { class: 'flecha flecha-' + msg.tipo.toLowerCase() + ' modo-' + msg.modo, 'data-fila': fila });
      this.gFlechas.appendChild(g);

      /* Etiqueta: nombre del mensaje + modo + nota opcional (clic → ficha). */
      const cx = (izquierda + derecha) / 2;
      const etiqueta = svg('g', { class: 'flecha-etiqueta', transform: `translate(${cx},${y - 9})` });
      if (this.alClicPaquete) etiqueta.appendChild(svg('rect', { x: -86, y: -27, width: 172, height: 44, class: 'zona-toque' }));
      etiqueta.appendChild(svg('rect', { x: -84, y: -15, width: 168, height: 21, rx: 5, class: 'flecha-etiqueta-fondo' }));
      etiqueta.appendChild(svg('use', { href: '#' + def.icono, x: -79, y: -12, width: 15, height: 15, class: 'flecha-icono', style: `color:${def.color}` }));
      etiqueta.appendChild(svg('text', { x: -60, y: 1, fill: def.color, class: 'flecha-nombre' }, def.nombre));
      etiqueta.appendChild(svg('text', { x: 79, y: 1, 'text-anchor': 'end', class: 'flecha-modo' }, msg.modo === 'broadcast' ? 'broadcast' : 'unicast'));
      if (msg.nota) {
        const haciaDerecha = Math.max(...xs) > xo;
        g.appendChild(
          svg('text', { x: xo + (haciaDerecha ? 8 : -8), y: y + 31, 'text-anchor': haciaDerecha ? 'start' : 'end', class: 'flecha-nota' }, msg.nota)
        );
      }
      if (this.alClicPaquete) {
        etiqueta.setAttribute('tabindex', '0');
        etiqueta.setAttribute('role', 'button');
        etiqueta.setAttribute('aria-label', `${def.nombre}, ${msg.modo}. Abrir ficha del mensaje`);
        const abrir = () => this.alClicPaquete(msg);
        etiqueta.addEventListener('click', abrir);
        etiqueta.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            abrir();
          }
        });
      }

      /* Líneas hacia cada destino: se dibujan a la vez que viaja el paquete. */
      const lineas = destinos.map((d) => {
        const xd = this.posiciones[d.id].x;
        const linea = svg('line', { x1: xo, y1: y, x2: xo, y2: y, stroke: def.color, class: 'flecha-linea' });
        g.appendChild(linea);
        return { d, xd, linea };
      });
      const paquetes = lineas.map(() => this._crearPaquete(msg, { x: xo, y }, true));
      if (msg.modo === 'broadcast') this._onda({ x: xo, y }, def.color, 40, instantaneo);
      await Promise.all(
        lineas.map((l, i) =>
          this.reloj.tween(dur, (p) => {
            const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
            const x = xo + (l.xd - xo) * e;
            l.linea.setAttribute('x2', String(x));
            paquetes[i].setAttribute('transform', `translate(${x},${y})`);
          })
        )
      );
      paquetes.forEach((p) => p.remove());
      if (gen !== this.generacion) {
        g.remove();
        return { estado: 'cancelado' };
      }
      g.insertBefore(etiqueta, g.firstChild);
      for (const l of lineas) {
        const dir = l.xd > xo ? 1 : -1;
        g.appendChild(svg('path', { d: `M${l.xd} ${y} l${-9 * dir} -5 v10 z`, fill: def.color, class: 'flecha-punta' }));
        const recibe = msg.modo === 'unicast' || procesaBroadcast(msg, l.d);
        if (recibe) resultado.entregadoA.push(l.d.id);
        else resultado.descartadoPor.push(l.d.id);
        if (msg.modo === 'broadcast') {
          g.appendChild(
            svg('text', { x: Math.min(this.ancho - 30, Math.max(30, l.xd)), y: y + 17, 'text-anchor': 'middle', class: 'flecha-marca ' + (recibe ? 'ok' : 'descarta') }, recibe ? '✓ procesa' : '✕ descarta')
          );
        }
      }
      this._efecto(msg);
      resultado.estado = 'entregado';
      this.registro.push({ tipo: msg.tipo, de: msg.de, a: msg.a, para: msg.para, modo: msg.modo, entregadoA: resultado.entregadoA.slice(), descartadoPor: resultado.descartadoPor.slice() });
      this._emitir(resultado);
      return resultado;
    }

    pausar() {
      this.reloj.pausado = true;
    }

    reanudar() {
      this.reloj.pausado = false;
    }

    setVelocidad(v) {
      this.reloj.velocidad = v;
    }

    /* Termina el mensaje en curso entero, incluidas las fases que aún no han empezado. */
    completar() {
      this._saltar = true;
      this.reloj.completar();
    }

    /* Vuelve al estado inicial: cancela animaciones y borra paquetes, flechas y estados. */
    reiniciar() {
      this.generacion += 1;
      this.reloj.cancelar();
      this.registro = [];
      this.estadoNodos = {};
      util.vaciar(this.gPaquetes);
      util.vaciar(this.gOndas);
      util.vaciar(this.gFlechas);
      this._limpiarInsignias();
      for (const id of Object.keys(this.elNodos)) this._actualizarNodo(id);
    }

    destruir() {
      this.generacion += 1;
      this.reloj.cancelar();
      util.vaciar(this.contenedor);
    }
  }
