    /* ═════════════ Mapa de misiones ═════════════ */
    pintarMisiones() {
      const main = principal();
      main.appendChild(h('h1', { class: 'titulo-pantalla', text: 'Mapa de misiones' }));
      main.appendChild(h('p', { class: 'subtitulo', text: `Cada misión se desbloquea al completar la anterior con al menos un ${Math.round(CONFIG.desbloqueo * 100)} % de aciertos a la primera. Todas se pueden repetir.` }));
      for (const tramo of CONFIG.tramos) {
        const delTramo = this.misiones().filter((m) => this.tramo(m.id) === tramo);
        if (!delTramo.length) continue;
        const lista = h('ol', { class: 'mapa' });
        for (const m of delTramo) lista.appendChild(this.tarjetaMision(m));
        main.appendChild(h('section', { class: 'tramo', 'aria-label': 'Tramo ' + tramo.nombre }, h('h2', { class: 'tramo-titulo', text: tramo.nombre }), lista));
      }
    },

    tarjetaMision(m) {
      const reg = Store.mision(m.id);
      const abierta = this.desbloqueada(m.id);
      const anterior = this.anteriorMision(m.id);
      const estado = reg.completada ? 'completada' : abierta ? 'disponible' : 'bloqueada';
      const etiquetaEstado = { completada: '✓ Completada', disponible: 'Disponible', bloqueada: '🔒 Bloqueada' }[estado];
      return h(
        'li',
        { class: 'mision-tarjeta estado-' + estado },
        h('span', { class: 'mision-num', 'aria-hidden': 'true', text: String(m.id) }),
        h(
          'div',
          { class: 'mision-info' },
          h('p', { class: 'mision-estado', text: etiquetaEstado }),
          h('h3', { text: `Misión ${m.id} · ${m.titulo}` }),
          h('p', { class: 'mision-objetivo', text: m.objetivo }),
          h('p', { class: 'mision-meta' }, h('span', { class: 'chip chip-fuente' }, util.icono('i-libro'), util.textoFuente(m.fuente)), reg.intentos ? h('span', { text: ` Mejor: ${util.numero(reg.mejorPuntos)} puntos · ${util.porcentaje(reg.mejorPrecision)} de aciertos` }) : null),
          !abierta && anterior ? h('p', { class: 'mision-bloqueo', text: `Completa la misión ${anterior.id} con al menos un ${Math.round(CONFIG.desbloqueo * 100)} % de aciertos para desbloquearla.` }) : null
        ),
        abierta
          ? h('a', { class: 'btn ' + (reg.completada ? 'btn-secundario' : 'btn-primario'), href: `#/mision/${m.id}` }, util.icono(reg.completada ? 'i-reiniciar' : 'i-play'), reg.completada ? 'Repetir' : 'Jugar')
          : h('span', { class: 'btn btn-deshabilitado', 'aria-disabled': 'true' }, util.icono('i-candado'), 'Bloqueada')
      );
    },

    /* ═════════════ Misión ═════════════ */
    pintarMision(id) {
      const m = this.mision(id);
      const main = principal();
      if (!m) {
        main.append(h('h1', { class: 'titulo-pantalla', text: 'Esa misión no existe' }), h('a', { class: 'btn btn-secundario', href: '#/misiones', text: 'Volver al mapa de misiones' }));
        return;
      }
      if (!this.desbloqueada(id)) {
        const anterior = this.anteriorMision(id);
        main.append(
          h('h1', { class: 'titulo-pantalla', text: `Misión ${m.id} · ${m.titulo}` }),
          h('p', { class: 'aviso' }, util.icono('i-candado'), `Esta misión está bloqueada. Completa antes la misión ${anterior.id} con al menos un ${Math.round(CONFIG.desbloqueo * 100)} % de aciertos.`),
          h('a', { class: 'btn btn-secundario', href: '#/misiones', text: 'Volver al mapa de misiones' })
        );
        return;
      }
      this.pintarIntro(m, this.aMedias('mision-' + id));
    },

    pintarIntro(m, guardada) {
      const main = principal();
      const reg = Store.mision(m.id);
      const tramo = this.tramo(m.id);
      const empezar = () => this.jugar(new Partida(m));
      main.append(
        h('p', { class: 'migas' }, h('a', { href: '#/misiones', text: 'Misiones' }), ' / ', `Misión ${m.id}`),
        h(
          'section',
          { class: 'panel intro-mision' },
          h('h1', { text: `Misión ${m.id} · ${m.titulo}` }),
          h('div', { class: 'ejercicio-chips' }, tramo ? h('span', { class: 'chip chip-nivel nivel-' + tramo.id, text: 'Tramo ' + tramo.nombre.toLowerCase() }) : null, h('span', { class: 'chip chip-fuente' }, util.icono('i-libro'), util.textoFuente(m.fuente))),
          h('h2', { text: 'Objetivo' }),
          h('p', { text: m.objetivo }),
          h('h2', { text: 'Instrucciones' }),
          h('ul', null, m.instrucciones.map((t) => h('li', { text: t }))),
          h('h2', { text: 'Cuándo se completa' }),
          h('p', { text: m.criterio.texto }),
          h('p', { class: 'nota', text: this.textoPuntuacion(m) }),
          reg.intentos
            ? h('p', { class: 'nota', text: `Intentos anteriores: ${reg.intentos} · Mejor puntuación: ${util.numero(reg.mejorPuntos)} · ${m.examen && reg.mejorNota !== null ? `Mejor nota: ${formatoNota(reg.mejorNota)} · Última nota: ${formatoNota(reg.ultimaNota)}` : `Mejor precisión: ${util.porcentaje(reg.mejorPrecision)}`}` })
            : null,
          h(
            'div',
            { class: 'acciones' },
            guardada
              ? [
                  h('button', { type: 'button', class: 'btn btn-primario', onclick: () => this.jugar(guardada) }, util.icono('i-play'), 'Continuar donde lo dejaste'),
                  h('button', { type: 'button', class: 'btn btn-secundario', onclick: empezar }, util.icono('i-reiniciar'), 'Empezar de nuevo')
                ]
              : h('button', { type: 'button', class: 'btn btn-primario', onclick: empezar }, util.icono('i-play'), reg.intentos ? 'Volver a jugar' : 'Empezar misión')
          )
        )
      );
    },

    /* Cómo se puntúa la misión. El examen explica además cómo se elige y se califica, y no tiene pistas. */
    textoPuntuacion(m) {
      const c = CONFIG.puntos;
      const pistas = m.examen ? '' : `, +${c.sinPistas} si no usas pistas, −${c.pistas[0]} y −${c.pistas[1]} por la 1.ª y la 2.ª pista`;
      const puntuacion = `Puntuación: +${c.acierto} por acierto${pistas}, −${c.error} por error (un ejercicio nunca baja de 0) y ${multiplicador()} a partir de ${CONFIG.racha.desde} aciertos seguidos a la primera.`;
      if (!m.examen) return puntuacion;
      const niveles = Object.entries(m.examen.porNivel).map(([nivel, n]) => `${n} de nivel ${nivel}`).join(', ');
      return `Examen: ${m.examen.total} ejercicios (${niveles}), al menos uno de cada misión y ninguno de Ampliación. Nota = aciertos a la primera ÷ ${m.examen.total} × 10. ${puntuacion}`;
    },

    empezarRepaso(id) {
      const m = this.mision(id);
      const main = principal();
      const ids = m && this.desbloqueada(id) ? this.pendientesDe(id) : [];
      if (!m || !ids.length) {
        main.append(h('h1', { class: 'titulo-pantalla', text: 'No hay ejercicios pendientes de repaso' }), h('a', { class: 'btn btn-secundario', href: '#/misiones', text: 'Volver al mapa de misiones' }));
        return;
      }
      this.partida = new Partida(m, { modo: 'repaso', ids });
      this.partida.reanudarTiempo();
      this.pintarPartida();
    },

    pendientesDe(id) {
      const reg = Store.mision(id);
      const m = this.mision(id);
      /* Examen: sus falladas son ejercicios de otras misiones; el resto de pendientes ya cuenta en su misión. */
      if (m && m.examen) {
        const existen = new Set(DHCP.data.preguntas.map((p) => p.id));
        return (reg.falladas || []).filter((x) => existen.has(x));
      }
      const delBanco = new Set(DHCP.data.preguntas.filter((p) => p.mision === id).map((p) => p.id));
      const pendientes = new Set([...(reg.falladas || []), ...Store.estado.repaso]);
      /* Una misión empezada y sin completar sigue debiendo lo que su criterio exige (el ejercicio requerido, o todos
         resueltos sin ver la solución) aunque ese ejercicio se haya acertado aparte, en la práctica libre, que no
         cuenta para la campaña: si no, la única salida sería repetir la misión entera. */
      if (m && reg.intentos > 0 && !reg.completada) {
        for (const q of m.criterio.requiere || []) if (!(reg.requisitos || {})[q]) pendientes.add(q);
        if (m.criterio.todas) for (const q of this.idsDeTodas(id)) if (!(reg.resueltas || {})[q]) pendientes.add(q);
      }
      return Array.from(pendientes).filter((x) => delBanco.has(x));
    },

    /* Vuelve a pintar la partida en la pantalla actual (sin pasar por el router). */
    refrescarPartida() {
      this.limpiarVista();
      util.vaciar(principal());
      this.pintarPartida();
      window.scrollTo(0, 0);
      /* El foco va al título de la nueva etapa y se anuncia dónde estamos. */
      const p = this.partida;
      const titulo = principal().querySelector('.ejercicio-enunciado, .lab h1, .resultados h1');
      if (titulo) {
        titulo.setAttribute('tabindex', '-1');
        titulo.focus({ preventScroll: true });
      }
      if (p && p.etapa === 'ejercicios') util.anunciar(`Ejercicio ${p.indice + 1} de ${p.ejercicios.length}`);
      else if (p && p.etapa === 'resultados') {
        const nuevas = p.insigniasNuevas || [];
        util.anunciar((p.modo === 'practica' ? 'Resultados de la práctica' : 'Resultados de la misión') + (nuevas.length ? `. ${nuevas.length === 1 ? 'Insignia nueva' : 'Insignias nuevas'}: ${nuevas.map((i) => i.nombre).join(', ')}` : ''));
      }
    },

    pintarPartida() {
      const p = this.partida;
      /* Si se salió durante la animación de un ejercicio ya resuelto, se continúa por el siguiente. */
      while (!p.terminada && p.etapa === 'ejercicios' && p.resultados[p.ejercicioActual.id]) p.avanzarEjercicio();
      const main = principal();
      const zona = h('div', { class: 'partida' });
      main.append(this.hud(p), zona);
      if (p.etapa === 'lab-dora') this.pintarLab(zona);
      else if (DHCP.Etapas[p.etapa]) this.vista = DHCP.Etapas[p.etapa]({ partida: p, zona, etapa: p.etapaActual, terminar: () => this.salirLab() });
      else if (p.etapa === 'ejercicios') this.pintarEjercicio(zona);
      else this.pintarResultados(zona);
    },

    hud(p) {
      const enEjercicio = p.etapa === 'ejercicios';
      const ej = enEjercicio ? p.ejercicioActual : null;
      const practica = p.modo === 'practica';
      const pistasDisp = ej ? (ej.sinAyuda || p.examen ? 'sin pistas' : String(2 - p.estadoDe(ej.id).pistas)) : '—';
      const progreso = enEjercicio ? `Ejercicio ${p.indice + 1} de ${p.ejercicios.length}` : p.terminada ? 'Resultados' : p.etapaActual.nombre || 'Laboratorio';
      /* La práctica se juega en #/practica: su enlace de vuelta tiene que volver a pintar esa ruta. */
      const volver = practica
        ? h('a', { href: '#/practica', class: 'hud-volver', 'aria-label': 'Volver a la práctica libre', onclick: (ev) => { ev.preventDefault(); Router.go('/practica'); } }, util.icono('i-atras'))
        : h('a', { href: '#/misiones', class: 'hud-volver', 'aria-label': 'Volver al mapa de misiones' }, util.icono('i-atras'));
      const titulo = practica ? 'Práctica libre' : p.modo === 'repaso' ? `Repaso · Misión ${p.mision.id}` : `Misión ${p.mision.id}`;
      const hud = h(
        'header',
        { class: 'hud', 'aria-label': practica ? 'Estado de la práctica' : 'Estado de la misión' },
        h('p', { class: 'hud-titulo' }, volver, h('strong', { text: titulo }), h('span', { class: 'hud-mision', text: practica ? ' · no cuenta para la campaña' : ' · ' + p.mision.titulo })),
        h(
          'dl',
          { class: 'hud-datos' },
          this.hudDato('Progreso', progreso, 'hud-progreso'),
          this.hudDato('Puntos', util.numero(p.puntos), 'hud-puntos'),
          this.hudDato('Racha', p.racha >= CONFIG.racha.desde ? `${p.racha} ${multiplicador()}` : String(p.racha), 'hud-racha'),
          p.intento === null ? null : this.hudDato('Intento', String(p.intento), 'hud-intento'),
          this.hudDato('Pistas', pistasDisp, 'hud-pistas')
        ),
        /* Ya registrada la partida (último ejercicio resuelto), pausar o reiniciar no tiene sentido. */
        p.terminada || p.resumenFinal
          ? null
          : h(
              'div',
              { class: 'hud-acciones' },
              h('button', { type: 'button', class: 'btn btn-secundario btn-compacto', onclick: () => this.pausar() }, util.icono('i-pausa'), 'Pausar'),
              h('button', { type: 'button', class: 'btn btn-secundario btn-compacto', onclick: () => this.reiniciarPartida() }, util.icono('i-reiniciar'), 'Reiniciar')
            )
      );
      if (enEjercicio) hud.appendChild(this.barra(p.indice / p.ejercicios.length, practica ? 'Progreso de la práctica' : 'Progreso de la misión'));
      return hud;
    },

    hudDato(titulo, valor, clase) {
      return h('div', { class: 'hud-dato ' + clase }, h('dt', { text: titulo }), h('dd', { text: valor }));
    },

    actualizarHud() {
      const viejo = document.querySelector('.hud');
      if (viejo && this.partida) viejo.replaceWith(this.hud(this.partida));
    },

    pausar() {
      const p = this.partida;
      if (!p || p.pausada) return;
      p.pausada = true;
      p.pausarTiempo();
      /* Se leen al pausar: algunas animaciones (p. ej. la del M7-04) se crean después de pintar el ejercicio. */
      const relojes = this.vista && this.vista.relojes ? this.vista.relojes() : [];
      const estabanPausados = relojes.map((r) => r.pausado);
      relojes.forEach((r) => (r.pausado = true));
      const m = Modal.abrir({
        titulo: p.modo === 'practica' ? 'Práctica en pausa' : 'Misión en pausa',
        contenido: h('p', { text: 'El tiempo y las animaciones están detenidos. Cuando quieras, sigue donde lo dejaste.' }),
        acciones: [{ texto: 'Reanudar', primario: true, valor: true }]
      });
      m.alCerrar = () => {
        p.pausada = false;
        relojes.forEach((r, i) => (r.pausado = estabanPausados[i]));
        if (this.partida === p) p.reanudarTiempo();
      };
    },

    async reiniciarPartida() {
      const p = this.partida;
      const practica = p.modo === 'practica';
      const ok = await Modal.confirmar({
        titulo: practica ? 'Reiniciar la práctica' : 'Reiniciar la misión',
        texto: practica ? 'Volverás a empezar con los mismos ejercicios. ¿Quieres empezar de nuevo?' : `Se perderá el progreso de esta partida (no el de partidas anteriores).${p.examen && p.modo === 'normal' ? ' El examen nuevo tendrá otros ejercicios.' : ''} ¿Quieres empezar de nuevo?`,
        si: 'Reiniciar',
        no: 'Seguir jugando'
      });
      if (!ok || this.partida !== p) return;
      this.jugar(new Partida(p.mision, p.modo === 'repaso' ? { modo: 'repaso', ids: p.ejercicios.map((e) => e.id) } : practica ? { modo: 'practica', ejercicios: p.ejercicios } : undefined));
    },

    /* ── Laboratorio de red animado: el intercambio DORA (misión 6) o varios escenarios en pestañas
       (misión 11). Con varios, hay que ver todas las animaciones completas para continuar. ── */
    pintarLab(zona) {
      const p = this.partida;
      const k = p.etapaIndice;
      const etapa = p.etapas[k];
      const ids = etapa.escenarios || [etapa.escenario];
      const varios = ids.length > 1;
      /* El estado solo se guarda cuando cambia algo: abrir el laboratorio no cuenta como progreso. */
      const est = p.estadoEtapa[k] || { actual: 0, vistos: {} };
      const guardar = () => (p.estadoEtapa[k] = est);
      const vistas = () => ids.filter((id) => est.vistos[id]).length;
      const escenario = DHCP.data.escenarios[ids[est.actual]];
      const mensajes = escenario.mensajes;
      const lienzo = h('div', { class: 'lienzo' });
      const panelEstado = h('div', { class: 'panel-transito', role: 'status', 'aria-live': 'polite' });
      const reloj = new DHCP.Reloj();
      reloj.velocidad = Store.ajuste('velocidad') || 1;

      const pintarTransito = (info) => {
        util.vaciar(panelEstado);
        if (!info) {
          panelEstado.append(h('p', { class: 'transito-vacio', text: 'Pulsa «Reproducir» o «Paso ▶» para enviar el primer mensaje.' }));
          return;
        }
        const d = DHCP.Animacion.describir(info.msg, escenario);
        const estado = info.estado === 'enviando' ? 'Enviando…' : info.msg.modo === 'broadcast' ? `Entregado. Lo procesa: ${this.nombres(escenario, info.entregadoA)}. Lo descartan: ${this.nombres(escenario, info.descartadoPor) || 'nadie'}.` : `Entregado a ${this.nombres(escenario, info.entregadoA)}.`;
        panelEstado.append(
          h('p', { class: 'transito-titulo' }, h('span', { class: 'sobre', style: { '--color-msg': d.def.color } }, util.icono(d.def.icono), h('strong', { text: d.nombre })), h('span', { class: 'etiqueta-modo modo-' + d.modo }, util.icono(d.modo === 'broadcast' ? 'i-broadcast' : 'i-unicast'), d.modo)),
          h('dl', { class: 'transito-datos' }, h('dt', { text: 'Emisor → receptor' }), h('dd', { text: d.ruta }), h('dt', { text: 'Origen → destino' }), h('dd', { class: 'mono' }, d.direcciones ? util.direcciones(d.direcciones) : '—'), h('dt', { text: 'Estado' }), h('dd', { class: 'transito-estado estado-' + info.estado, text: estado }))
        );
      };

      const equipos = escenario.nodos.filter((n) => n.tipo !== 'switch').map((n) => n.etiqueta);
      const animador = new DHCP.PacketAnimator(lienzo, escenario, {
        layout: 'topologia',
        reloj,
        titulo: `Red del aula: ${listaEs(equipos)}, conectados a un switch`,
        alClicPaquete: (msg) => this.abrirFichaMensaje(msg, escenario),
        alEstado: (info) => pintarTransito(info)
      });

      const btnAtras = h('button', { type: 'button', class: 'btn btn-secundario btn-control', 'aria-label': 'Paso atrás' }, util.icono('i-paso-atras'), h('span', { text: 'Atrás' }));
      const btnPlay = h('button', { type: 'button', class: 'btn btn-primario btn-control' });
      const btnPaso = h('button', { type: 'button', class: 'btn btn-secundario btn-control', 'aria-label': 'Paso adelante' }, h('span', { text: 'Paso' }), util.icono('i-paso'));
      const btnReiniciar = h('button', { type: 'button', class: 'btn btn-secundario btn-control', 'aria-label': 'Reiniciar la animación' }, util.icono('i-reiniciar'), h('span', { text: 'Reiniciar' }));
      const velocidades = h('div', { class: 'segmentado velocidades', role: 'group', 'aria-label': 'Velocidad de la animación' }, h('span', { class: 'segmentado-titulo', text: 'Velocidad' }));
      const siguienteEtapa = p.etapas[k + 1];
      const btnContinuar = h(
        'button',
        { type: 'button', class: 'btn btn-primario', disabled: !p.etapaHecha[k], onclick: () => this.salirLab() },
        !siguienteEtapa || siguienteEtapa.tipo === 'ejercicios' ? 'Continuar a los ejercicios' : `Continuar: ${siguienteEtapa.nombre.toLowerCase()}`,
        util.icono('i-paso')
      );
      const cuantas = NUMEROS[ids.length] || String(ids.length);
      const textoAyuda = (recien) => {
        if (!varios) return p.etapaHecha[k] ? `Ya has visto el intercambio completo. Puedes repetirlo${recien ? ' paso a paso' : ''} o continuar.` : 'Mira el intercambio completo (los cuatro mensajes) para continuar.';
        return p.etapaHecha[k] ? `Ya has visto las ${cuantas} animaciones. Puedes repetirlas o continuar.` : `Mira las ${cuantas} animaciones completas para continuar: llevas ${vistas()} de ${ids.length}.`;
      };
      const ayudaContinuar = h('p', { class: 'nota', text: textoAyuda(false) });
      /* Con varios escenarios, al terminar uno se ofrece el siguiente que falta por ver. */
      const btnOtro = h('button', { type: 'button', class: 'btn btn-secundario btn-otro-escenario', hidden: true });

      /* Pestañas (patrón ARIA «tabs»): las flechas cambian de escenario y el foco se queda en la pestaña. */
      const cambiar = (i, enfocar) => {
        if (i !== est.actual) {
          est.actual = i;
          guardar();
          this.limpiarVista();
          util.vaciar(zona);
          this.pintarLab(zona);
        }
        const pestana = enfocar && zona.querySelector('#pestana-lab-' + est.actual);
        if (pestana) pestana.focus();
      };
      const pestanas = varios
        ? ids.map((id, i) => {
            const def = DHCP.data.mensajes[DHCP.data.escenarios[id].mensaje];
            const estado = h('span', { class: 'pestana-estado' });
            const boton = h(
              'button',
              { type: 'button', role: 'tab', id: 'pestana-lab-' + i, class: 'pestana', 'aria-selected': String(i === est.actual), 'aria-controls': 'panel-lab', tabindex: i === est.actual ? '0' : '-1', style: { '--color-msg': def.color }, onclick: () => cambiar(i, true) },
              util.icono(def.icono),
              h('span', { class: 'pestana-nombre', text: def.nombre }),
              estado
            );
            return { id, def, boton, estado };
          })
        : [];
      const marcarPestanas = () =>
        pestanas.forEach((t) => {
          const visto = !!est.vistos[t.id];
          t.boton.classList.toggle('vista', visto);
          util.vaciar(t.estado);
          t.estado.append(visto ? util.icono('i-check') : '', h('span', { class: 'sr-only', text: visto ? ', vista' : ', sin ver' }));
        });
      const listaPestanas = varios ? h('div', { class: 'pestanas', role: 'tablist', 'aria-label': 'Mensajes del laboratorio' }, pestanas.map((t) => t.boton)) : null;
      if (listaPestanas)
        listaPestanas.addEventListener('keydown', (ev) => {
          const paso = { ArrowRight: 1, ArrowLeft: -1 }[ev.key];
          const i = paso ? (est.actual + paso + ids.length) % ids.length : ev.key === 'Home' ? 0 : ev.key === 'End' ? ids.length - 1 : null;
          if (i === null) return;
          ev.preventDefault();
          cambiar(i, true);
        });
      const pendiente = () => ids.findIndex((id, i) => i !== est.actual && !est.vistos[id]);
      const actualizarOtro = () => {
        const i = pendiente();
        btnOtro.hidden = !varios || !est.vistos[ids[est.actual]] || i < 0;
        if (btnOtro.hidden) return;
        util.vaciar(btnOtro);
        btnOtro.append(`Ver ${pestanas[i].def.nombre}`, util.icono('i-paso'));
        btnOtro.onclick = () => cambiar(i, true);
      };

      /* Línea temporal y narración: se crean una vez y se actualizan en su sitio, para no perder el foco. */
      const linea = h('ol', { class: 'linea-tiempo', 'aria-label': 'Línea temporal del intercambio' });
      const itemsLinea = mensajes.map((m, i) => {
        const def = DHCP.data.mensajes[m.tipo];
        const estadoEl = h('span', { class: 'linea-estado' });
        const boton = h(
          'button',
          { type: 'button', class: 'linea-boton', style: { '--color-msg': def.color }, onclick: () => this.abrirFichaMensaje(m, escenario) },
          h('span', { class: 'linea-num', text: String(i + 1) }),
          util.icono(def.icono),
          h('strong', { text: def.nombre }),
          h('span', { class: 'linea-modo', text: m.modo }),
          estadoEl
        );
        const li = h('li', { class: 'linea-item' }, boton);
        linea.appendChild(li);
        return { li, boton, estadoEl, def, m };
      });
      const tituloPasos = escenario.tituloPasos || 'Los 8 pasos de la diap. 16';
      const narracion = h('ol', { class: 'narracion', 'aria-label': tituloPasos });
      const itemsNarracion = mensajes.map((m) => {
        const antes = h('li', { text: m.antes });
        const despues = h('li', { text: m.despues });
        narracion.append(antes, despues);
        return { antes, despues };
      });

      /* Antes de desactivar el botón que tiene el foco, el foco pasa a Reproducir. */
      const desactivar = (btn, valor) => {
        if (valor && document.activeElement === btn) btnPlay.focus({ preventScroll: true });
        btn.disabled = valor;
      };

      const seq = new DHCP.Secuenciador(animador, mensajes, { alCambiar: () => actualizar() });
      const actualizar = () => {
        const enCurso = seq.ocupado ? seq.indice : -1;
        itemsLinea.forEach((it, i) => {
          const estado = i < seq.indice ? 'entregado' : i === enCurso ? 'en curso' : 'pendiente';
          it.li.className = 'linea-item estado-' + estado.replace(' ', '-');
          it.estadoEl.textContent = estado;
          it.boton.setAttribute('aria-label', `${i + 1}. ${it.def.nombre}, ${it.m.modo}, ${estado}. Abrir ficha`);
        });
        itemsNarracion.forEach((it, i) => {
          const antesHecho = i < seq.indice || i === enCurso;
          it.antes.className = antesHecho ? (i === enCurso ? 'actual' : 'hecho') : '';
          it.despues.className = i < seq.indice ? (i === seq.indice - 1 && !seq.ocupado ? 'actual' : 'hecho') : '';
        });
        util.vaciar(btnPlay);
        if (seq.auto) btnPlay.append(util.icono('i-pausa'), h('span', { text: reloj.pausado ? 'Seguir' : 'Pausar' }));
        else btnPlay.append(util.icono('i-play'), h('span', { text: seq.indice >= seq.total ? 'Ver otra vez' : 'Reproducir' }));
        desactivar(btnPaso, seq.indice >= seq.total && !seq.ocupado);
        desactivar(btnAtras, seq.indice === 0 && !seq.ocupado);
        if (seq.vistoCompleto && !est.vistos[ids[est.actual]]) {
          est.vistos[ids[est.actual]] = true;
          guardar();
          marcarPestanas();
          actualizarOtro();
          const completo = vistas() === ids.length;
          if (completo) {
            p.etapaHecha[k] = true;
            btnContinuar.disabled = false;
          }
          ayudaContinuar.textContent = textoAyuda(true);
          if (!varios) util.anunciar('Intercambio completo: el cliente queda configurado. Ya puedes continuar a los ejercicios.');
          else util.anunciar(`Animación del ${DHCP.data.mensajes[escenario.mensaje].nombre} completa. ` + (completo ? `Ya has visto las ${cuantas}: puedes continuar.` : `Llevas ${vistas()} de ${ids.length}.`));
        }
        if (!seq.ocupado && seq.indice === 0) pintarTransito(null);
      };

      btnPlay.addEventListener('click', () => {
        if (seq.auto) {
          reloj.pausado = !reloj.pausado;
          actualizar();
        } else {
          reloj.pausado = false;
          seq.reproducir();
        }
      });
      btnPaso.addEventListener('click', () => {
        reloj.pausado = false;
        seq.detener();
        seq.siguiente();
      });
      btnAtras.addEventListener('click', () => {
        reloj.pausado = false;
        seq.anterior();
      });
      btnReiniciar.addEventListener('click', () => {
        reloj.pausado = false;
        seq.reiniciar();
      });
      CONFIG.velocidades.forEach((v) => {
        const b = h('button', {
          type: 'button',
          class: 'segmento',
          'aria-pressed': String(reloj.velocidad === v),
          text: coma(v) + '×',
          onclick: () => {
            reloj.velocidad = v;
            Store.ajuste('velocidad', v);
            velocidades.querySelectorAll('.segmento').forEach((s) => s.setAttribute('aria-pressed', String(s === b)));
          }
        });
        velocidades.appendChild(b);
      });

      const contenido = [
        varios ? h('h2', { class: 'lab-escenario', text: escenario.titulo }) : null,
        h('p', { class: 'nota nota-escenario' }, util.icono('i-info'), escenario.nota),
        h(
          'div',
          { class: 'lab-grid' },
          h('figure', { class: 'lab-diagrama' }, lienzo),
          /* Controles primero: así no se mueven cuando el panel de tránsito cambia de altura, y en móvil
             quedan justo debajo del diagrama (el panel usa display: contents). */
          h(
            'div',
            { class: 'lab-panel' },
            h('div', { class: 'controles', role: 'group', 'aria-label': 'Controles de la animación' }, btnReiniciar, btnAtras, btnPlay, btnPaso),
            velocidades,
            h('h2', { class: 'panel-subtitulo', text: 'Paquete en tránsito' }),
            panelEstado
          )
        ),
        h(
          'p',
          { class: 'leyenda' },
          h('span', null, util.icono('i-broadcast'), varios ? ' Broadcast: ondas que llegan a todos; quien no tiene que procesarlo lo descarta (✕).' : ' Broadcast: ondas que llegan a todos; quien no es servidor DHCP lo descarta (✕).'),
          h('span', null, util.icono('i-unicast'), ' Unicast: el paquete va a un único destino.'),
          h('span', null, util.icono('i-info'), ' Toca un paquete o un mensaje de la línea temporal para abrir su ficha.')
        ),
        h('h2', { class: 'panel-subtitulo', text: 'Línea temporal' }),
        linea,
        h('details', { class: 'detalles-narracion', open: true }, h('summary', { text: tituloPasos }), narracion)
      ];
      zona.append(
        h(
          'section',
          { class: 'lab' + (varios ? ' lab-varios' : '') },
          h('h1', { class: 'titulo-pantalla', tabindex: '-1', text: etapa.titulo || 'Laboratorio de red: el intercambio DORA' }),
          listaPestanas,
          varios ? h('div', { id: 'panel-lab', class: 'lab-escenario-panel', role: 'tabpanel', 'aria-labelledby': 'pestana-lab-' + est.actual }, contenido) : contenido,
          h('div', { class: 'lab-pie' }, ayudaContinuar, h('div', { class: 'lab-pie-botones' }, btnOtro, btnContinuar))
        )
      );
      marcarPestanas();
      actualizarOtro();
      actualizar();
      this.vista = {
        destruir: () => {
          seq.detener();
          seq.gen += 1;
          animador.destruir();
        },
        relojes: () => [reloj]
      };
    },

    nombres(escenario, ids) {
      return ids.map((id) => escenario.nodos.find((n) => n.id === id).etiqueta).join(', ');
    },

    salirLab() {
      this.partida.avanzarEtapa();
      this.refrescarPartida();
    },

    /* ── Ejercicio ── */
    pintarEjercicio(zona) {
      const p = this.partida;
      const ej = p.ejercicioActual;
      const estado = p.estadoDe(ej.id);
      const vista = DHCP.Ejercicios.render(ej, zona, {
        estadoInicial: estado,
        /* Examen: sin pistas ni teoría en ningún ejercicio. */
        sinAyuda: p.examen,
        notaSinAyuda: p.examen ? 'Examen: no hay pistas ni teoría. Cuenta lo que aciertes a la primera; tras dos errores puedes ver la solución, pero ese ejercicio no puntúa.' : null,
        /* Puntuar y guardar van juntos, antes de la animación de acierto: salir durante ella no pierde nada. */
        puntuar: (info) => {
          const r = p.puntuar(info);
          if (!r.repetido) Store.registrarEjercicio(ej.id, info);
          /* Con el último ejercicio resuelto la partida ya está jugada: se registra aquí y no al ver los resultados. */
          if (!p.resumenFinal && p.ejercicios.every((e) => p.resultados[e.id])) this.cerrarPartida(p);
          this.actualizarHud();
          return r;
        },
        alPista: (n) => {
          estado.pistas = n;
          this.actualizarHud();
        },
        alError: (e) => {
          estado.errores = e.errores;
          this.actualizarHud();
        },
        alResolver: (info, explicacion) => {
          const ultimo = p.indice >= p.ejercicios.length - 1;
          const btn = h(
            'button',
            {
              type: 'button',
              class: 'btn btn-primario btn-siguiente',
              onclick: () => {
                p.avanzarEjercicio();
                this.refrescarPartida();
              }
            },
            ultimo ? 'Ver resultados' : 'Siguiente ejercicio',
            util.icono('i-paso')
          );
          explicacion.appendChild(h('div', { class: 'acciones' }, btn));
          btn.focus({ preventScroll: true });
        }
      });
      this.vista = {
        destruir: () => vista.destruir(),
        relojes: () => (vista.manejador && vista.manejador.animador ? [vista.manejador.animador.reloj] : [])
      };
    },

    /* ── Resultados ── */
    /* Al terminar: registra la partida (la práctica no cuenta para la campaña) y evalúa las insignias. */
    cerrarPartida(p) {
      p.pausarTiempo();
      const r = p.resumen();
      p.resumenFinal = r;
      Store.sumarTiempo(r.tiempoMs);
      if (p.modo === 'practica') Store.registrarPractica(r);
      else p.recienCompletada = Store.registrarMision(p.mision.id, Object.assign({ repaso: p.modo === 'repaso', criterio: p.mision.criterio, idsTodas: this.idsDeTodas(p.mision.id) }, r));
      p.insigniasNuevas = DHCP.Insignias.evaluar({
        mision: p.mision,
        modo: p.modo,
        resumen: r,
        pistasUsadas: p.pistasUsadas,
        solucionesVistas: r.solucionesVistas,
        completada: p.modo === 'normal' && this.superaCriterio(p.mision, r),
        nota: r.nota
      });
      this.actualizarMarcador();
    },

    /* La partida, por sí sola, cumple el criterio de la misión (lo usan las insignias «sin pistas» y «sin soluciones»). */
    superaCriterio(m, r) {
      const c = m.criterio;
      return r.precision >= c.precisionMinima && (c.requiere || []).every((id) => r.requeridos.some((q) => q.id === id && q.ok)) && (!c.todas || this.idsDeTodas(m.id).every((id) => r.resueltas.includes(id)));
    },

    pintarResultados(zona) {
      const p = this.partida;
      if (!p.resumenFinal) this.cerrarPartida(p);
      if (!p.sonidoFin) {
        p.sonidoFin = true;
        DHCP.Sonido.fin();
      }
      if (p.modo === 'practica') {
        this.pintarResultadosPractica(zona);
        return;
      }
      const r = p.resumenFinal;
      const m = p.mision;
      const reg = Store.mision(m.id);
      const siguiente = this.siguienteMision(m.id);
      const crit = m.criterio;
      const titulo = p.examen
        ? p.recienCompletada
          ? '¡Desafío final completado!'
          : p.modo === 'repaso'
            ? 'Repaso terminado'
            : 'Examen terminado'
        : p.recienCompletada
          ? '¡Misión completada!'
          : p.modo === 'repaso'
            ? 'Repaso terminado'
            : reg.completada
              ? 'Partida terminada (la misión ya estaba completada)'
              : 'Misión no superada todavía';
      /* El criterio se evalúa con lo acumulado: la mejor precisión y los requisitos cumplidos en cualquier partida. */
      const precisionOk = reg.mejorPrecision >= crit.precisionMinima;
      const condiciones = p.examen
        ? [
            h('li', {
              class: 'ok',
              text: p.modo === 'normal' ? `✓ Examen terminado: tu nota, ${formatoNota(r.nota)}, queda registrada (mejor nota: ${formatoNota(reg.mejorNota)})` : `✓ Repaso terminado. La nota del examen no cambia (mejor nota: ${formatoNota(reg.mejorNota)}): para mejorarla, haz un examen nuevo.`
            })
          ]
        : [
            h('li', { class: precisionOk ? 'ok' : 'mal', text: `${precisionOk ? '✓' : '✗'} Aciertos a la primera: ${p.modo === 'normal' ? util.porcentaje(r.precision) + ' en esta partida, ' : ''}mejor ${util.porcentaje(reg.mejorPrecision)} (mínimo ${util.porcentaje(crit.precisionMinima)})` })
          ].concat(
            (crit.requiere || []).map((id) => {
              const cumplido = !!(reg.requisitos && reg.requisitos[id]);
              const nombre = (crit.requiereTexto && crit.requiereTexto[id]) || `Ejercicio ${id} resuelto a la primera`;
              return h('li', { class: cumplido ? 'ok' : 'mal', text: `${cumplido ? '✓' : '✗'} ${nombre}${cumplido ? '' : ' (repítelo con «Repetir falladas»)'}` });
            }),
            crit.todas
              ? (() => {
                  const ids = this.idsDeTodas(m.id);
                  const hechas = ids.filter((id) => reg.resueltas && reg.resueltas[id]).length;
                  const ok = hechas === ids.length;
                  return h('li', { class: ok ? 'ok' : 'mal', text: `${ok ? '✓' : '✗'} Todas las configuraciones corregidas sin ver la solución: ${hechas} de ${ids.length}` });
                })()
              : [],
            p.modo === 'normal' ? m.etapas.filter((e) => e.tipo !== 'ejercicios').map((e) => h('li', { class: 'ok', text: `✓ ${e.nombre}: completado` })) : []
          );
      const falladas = p.ejercicios.filter((e) => r.falladas.includes(e.id));
      const nuevaPartida = () => {
        /* Desde un repaso (#/repaso/N) la partida nueva es la normal de la misión: la dirección tiene que decirlo,
           sin repintar la pantalla, para que «Atrás» no reabra el repaso. */
        if (Router.actual && Router.actual.patron === '/repaso/:id') {
          window.history.replaceState(null, '', '#/mision/' + m.id);
          Router.actual = { ruta: '/mision/' + m.id, patron: '/mision/:id', params: { id: String(m.id) } };
        }
        this.jugar(new Partida(m));
      };
      zona.appendChild(
        h(
          'section',
          { class: 'resultados' + (p.examen ? ' resultados-examen' : '') },
          h('h1', { class: 'titulo-pantalla', text: titulo }),
          p.recienCompletada && siguiente ? h('p', { class: 'aviso aviso-ok' }, util.icono('i-candado-abierto'), `Has desbloqueado la misión ${siguiente.id}: ${siguiente.titulo}.`) : null,
          p.examen && p.modo === 'normal' ? this.bloqueNota(r, reg) : null,
          this.panelInsigniasNuevas(p.insigniasNuevas),
          h(
            'div',
            { class: 'tablero-inicio' },
            this.tarjetaDato('Puntos', util.numero(r.puntos), 'i-trofeo'),
            this.tarjetaDato('Aciertos a la primera', `${r.aciertos} de ${r.total} (${util.porcentaje(r.precision)})`, 'i-check'),
            this.tarjetaDato('Tiempo', util.formatoTiempo(r.tiempoMs), 'i-reloj'),
            this.tarjetaDato('Mejor racha', String(r.rachaMax), 'i-estrella')
          ),
          p.examen && p.modo === 'normal' ? null : h('section', { class: 'panel' }, h('h2', { text: p.examen ? 'Nota del examen' : 'Criterio de la misión' }), h('ul', { class: 'lista-criterio' }, condiciones)),
          p.examen ? this.tablaPorMision(r) : null,
          h('section', { class: 'panel cierre' }, h('h2', { text: 'Lo que tienes que llevarte' }), h('p', { text: m.cierre })),
          this.listaEjercicios(p),
          this.resumenErrores(falladas),
          h(
            'div',
            { class: 'acciones' },
            falladas.length ? h('button', { type: 'button', class: 'btn btn-primario', onclick: () => this.repetirFalladas(falladas.map((e) => e.id)) }, util.icono('i-reiniciar'), `Repetir falladas (${falladas.length})`) : null,
            h('button', { type: 'button', class: 'btn btn-secundario', onclick: nuevaPartida }, util.icono('i-reiniciar'), p.examen ? 'Nuevo examen' : 'Repetir misión'),
            siguiente && this.desbloqueada(siguiente.id) ? h('a', { class: 'btn btn-primario', href: `#/mision/${siguiente.id}` }, util.icono('i-play'), `Ir a la misión ${siguiente.id}`) : null,
            p.examen ? h('a', { class: 'btn btn-secundario', href: '#/perfil' }, util.icono('i-perfil'), 'Ver tu perfil') : null,
            h('a', { class: 'btn btn-fantasma', href: '#/misiones' }, util.icono('i-mapa'), 'Mapa de misiones')
          )
        )
      );
    },

    pintarResultadosPractica(zona) {
      const p = this.partida;
      const r = p.resumenFinal;
      const falladas = p.ejercicios.filter((e) => r.falladas.includes(e.id));
      zona.appendChild(
        h(
          'section',
          { class: 'resultados' },
          h('h1', { class: 'titulo-pantalla', text: 'Práctica terminada' }),
          this.panelInsigniasNuevas(p.insigniasNuevas),
          h(
            'div',
            { class: 'tablero-inicio' },
            this.tarjetaDato('Aciertos a la primera', `${r.aciertos} de ${r.total} (${util.porcentaje(r.precision)})`, 'i-check'),
            this.tarjetaDato('Puntos de práctica', util.numero(r.puntos), 'i-trofeo'),
            this.tarjetaDato('Tiempo', util.formatoTiempo(r.tiempoMs), 'i-reloj'),
            this.tarjetaDato('Mejor racha', String(r.rachaMax), 'i-estrella')
          ),
          h('p', { class: 'nota' }, util.icono('i-info'), 'La práctica libre no cuenta para la campaña: no cambia tus misiones ni tu puntuación total. Lo que falles se queda en «Pendientes de repaso», en tu perfil.'),
          r.porMision.length > 1 ? this.tablaPorMision(r) : null,
          this.listaEjercicios(p),
          this.resumenErrores(falladas),
          h(
            'div',
            { class: 'acciones' },
            falladas.length ? h('button', { type: 'button', class: 'btn btn-primario', onclick: () => this.repetirFalladas(falladas.map((e) => e.id)) }, util.icono('i-reiniciar'), `Repetir falladas (${falladas.length})`) : null,
            h('a', { class: 'btn ' + (falladas.length ? 'btn-secundario' : 'btn-primario'), href: '#/practica', onclick: (ev) => { ev.preventDefault(); Router.go('/practica'); } }, util.icono('i-play'), 'Otra práctica'),
            h('a', { class: 'btn btn-fantasma', href: '#/misiones' }, util.icono('i-mapa'), 'Mapa de misiones')
          )
        )
      );
    },

    /* Nota del examen, grande: es el dato que el jugador viene a buscar. */
    bloqueNota(r, reg) {
      return h(
        'section',
        { class: 'panel nota-examen', 'aria-label': 'Tu nota' },
        h('p', { class: 'nota-examen-valor' }, h('span', { class: 'nota-examen-numero', text: formatoNota(r.nota) }), h('span', { class: 'nota-examen-sobre', text: 'sobre 10' })),
        h(
          'div',
          { class: 'nota-examen-texto' },
          h('p', { class: 'nota-examen-calificacion ' + (r.nota < 5 ? 'suspenso' : 'aprobado'), text: calificacion(r.nota) }),
          h('p', { text: `${r.aciertos} de ${r.total} ejercicios a la primera.` }),
          h('p', { class: 'nota', text: reg.intentos > 1 ? `Mejor nota: ${formatoNota(reg.mejorNota)} · Exámenes hechos: ${reg.intentos}` : 'Es tu primer examen: la nota queda registrada en tu perfil.' })
        )
      );
    },

    tablaPorMision(r) {
      return h(
        'section',
        { class: 'panel' },
        h('h2', { text: 'Resultados por misión' }),
        h(
          'div',
          { class: 'tabla-scroll' },
          h(
            'table',
            { class: 'tabla tabla-por-mision' },
            h('thead', null, h('tr', null, ['Misión', 'A la primera', 'Precisión'].map((t) => h('th', { scope: 'col', text: t })))),
            h(
              'tbody',
              null,
              r.porMision
                .slice()
                .sort((a, b) => a.mision - b.mision)
                .map((f) => {
                const m = this.mision(f.mision);
                return h(
                  'tr',
                  null,
                  h('th', { scope: 'row', text: m ? `${m.id}. ${m.titulo}` : `Misión ${f.mision}` }),
                  h('td', { text: `${f.aciertos} de ${f.total}` }),
                  h('td', null, this.barra(f.aciertos / f.total, `Aciertos a la primera de la misión ${f.mision}`), h('span', { class: 'barra-texto', text: util.porcentaje(f.aciertos / f.total) }))
                );
              })
            )
          )
        )
      );
    },

    listaEjercicios(p) {
      const conMision = p.examen || p.modo === 'practica';
      const filas = p.ejercicios.map((e, i) => {
        const res = p.resultados[e.id];
        const estado = !res ? '—' : res.primerIntento ? '✓ A la primera' : res.verSolucion ? '✗ Solución vista' : '↻ Con errores';
        return h(
          'li',
          { class: 'resultado-item ' + (res && res.primerIntento ? 'ok' : 'mal') },
          h('span', { class: 'resultado-num', text: String(i + 1) }),
          h('span', { class: 'resultado-texto' }, conMision ? h('span', { class: 'resultado-mision', text: `Misión ${e.mision} · ` }) : null, e.enunciado),
          h('span', { class: 'resultado-estado', text: estado }),
          h('span', { class: 'resultado-puntos', text: res ? `${res.puntos} pts` : '' })
        );
      });
      return h('section', { class: 'panel' }, h('h2', { text: 'Ejercicio a ejercicio' }), h('ol', { class: 'lista-resultados' }, filas));
    },

    resumenErrores(falladas) {
      if (!falladas.length) return null;
      return h(
        'section',
        { class: 'panel' },
        h('h2', { text: 'Resumen de errores' }),
        falladas.map((e) => h('details', { class: 'detalle-error' }, h('summary', { text: e.enunciado }), h('p', { text: e.explicacion }), h('button', { type: 'button', class: 'btn btn-fantasma', onclick: () => this.abrirFicha(e.repasar) }, util.icono('i-libro'), 'Repasar teoría')))
      );
    },

    /* ── Insignias ── */
    panelInsigniasNuevas(nuevas) {
      if (!nuevas || !nuevas.length) return null;
      return h(
        'section',
        { class: 'panel insignias-nuevas' },
        h('h2', { text: nuevas.length === 1 ? 'Insignia nueva' : `${nuevas.length} insignias nuevas` }),
        h('ul', { class: 'rejilla-insignias' }, nuevas.map((i) => this.tarjetaInsignia(i, Store.logro(i.id)))),
        h('p', { class: 'nota' }, 'Todas tus insignias están en el ', h('a', { href: '#/perfil', text: 'perfil' }), '.')
      );
    },

    tarjetaInsignia(ins, logro) {
      return h(
        'li',
        { class: 'insignia ' + (logro ? 'ganada' : 'pendiente') },
        h('span', { class: 'insignia-icono', 'aria-hidden': 'true' }, util.icono(ins.icono)),
        h(
          'span',
          { class: 'insignia-texto' },
          h('strong', { class: 'insignia-nombre', text: ins.nombre }),
          h('span', { class: 'insignia-descripcion', text: ins.descripcion }),
          h('span', { class: 'insignia-estado', text: logro ? `Conseguida el ${fechaCorta(logro.fecha)}` : 'Pendiente' })
        )
      );
    },

    repetirFalladas(ids) {
      const p = this.partida;
      this.jugar(p.modo === 'practica' ? new Partida(p.mision, { modo: 'practica', ejercicios: p.ejercicios.filter((e) => ids.includes(e.id)) }) : new Partida(p.mision, { modo: 'repaso', ids }));
    },

    /* ═════════════ Práctica libre ═════════════ */
    /* Ejercicios al azar de las misiones ya desbloqueadas, filtrados por nivel, misión y tipo. No cuenta
       para la campaña. Los filtros se recuerdan mientras la página esté abierta. */
    pintarPractica() {
      const main = principal();
      const { NOMBRES_TIPO, NOMBRES_NIVEL } = DHCP.Ejercicios;
      const f = this.filtrosPractica || (this.filtrosPractica = { nivel: 'todos', mision: 'todas', tipo: 'todos', cantidad: CONFIG.practica.porDefecto, ampliacion: true });
      const abiertas = this.misiones().filter((m) => !m.examen && this.desbloqueada(m.id) && this.idsDeMision(m.id).length);
      const idsAbiertas = new Set(abiertas.map((m) => m.id));
      const banco = DHCP.data.preguntas.filter((q) => idsAbiertas.has(q.mision));
      if (f.mision !== 'todas' && !idsAbiertas.has(Number(f.mision))) f.mision = 'todas';
      const tipos = Object.keys(NOMBRES_TIPO).filter((t) => banco.some((q) => q.tipo === t));
      if (f.tipo !== 'todos' && !tipos.includes(f.tipo)) f.tipo = 'todos';
      const filtrados = () => banco.filter((q) => (f.nivel === 'todos' || q.nivel === f.nivel) && (f.mision === 'todas' || q.mision === Number(f.mision)) && (f.tipo === 'todos' || q.tipo === f.tipo) && (f.ampliacion || !q.ampliacion));

      const contador = h('p', { class: 'practica-contador', role: 'status', 'aria-live': 'polite' });
      const btnEmpezar = h('button', { type: 'submit', class: 'btn btn-primario' }, util.icono('i-play'), 'Empezar práctica');
      const actualizar = () => {
        const n = filtrados().length;
        contador.textContent = !n
          ? 'No hay ningún ejercicio con estos filtros: prueba con otro nivel, misión o tipo.'
          : n === 1
            ? 'Hay 1 ejercicio con estos filtros.'
            : n <= f.cantidad
              ? `Hay ${n} ejercicios con estos filtros: practicarás con todos.`
              : `Hay ${n} ejercicios con estos filtros: practicarás con ${f.cantidad}, elegidos al azar.`;
        btnEmpezar.disabled = !n;
      };
      /* Grupo de opciones con radios nativos (teclado y lector de pantalla de serie) con aspecto de segmentos. */
      const grupo = (nombre, leyenda, opciones, clave) =>
        h(
          'fieldset',
          { class: 'campo-grupo' },
          h('legend', { text: leyenda }),
          h(
            'div',
            { class: 'opciones-segmentadas' },
            opciones.map((o) =>
              h(
                'label',
                { class: 'opcion-segmento' },
                h('input', {
                  type: 'radio',
                  name: nombre,
                  value: String(o.valor),
                  checked: f[clave] === o.valor,
                  onchange: () => {
                    f[clave] = o.valor;
                    actualizar();
                  }
                }),
                h('span', { text: o.texto })
              )
            )
          )
        );
      const selector = (id, etiqueta, opciones, clave, convertir) =>
        h(
          'div',
          { class: 'campo' },
          h('label', { for: id, text: etiqueta }),
          h(
            'select',
            {
              id,
              class: 'selector',
              onchange: (ev) => {
                f[clave] = convertir ? convertir(ev.target.value) : ev.target.value;
                actualizar();
              }
            },
            opciones.map((o) => h('option', { value: String(o.valor), selected: String(f[clave]) === String(o.valor), text: o.texto }))
          )
        );

      const form = h(
        'form',
        { class: 'panel practica-form', novalidate: true, 'aria-label': 'Filtros de la práctica' },
        grupo('practica-nivel', 'Nivel', [{ valor: 'todos', texto: 'Todos' }].concat(Object.keys(NOMBRES_NIVEL).map((n) => ({ valor: n, texto: NOMBRES_NIVEL[n] }))), 'nivel'),
        h(
          'div',
          { class: 'practica-selectores' },
          selector('practica-mision', 'Misión', [{ valor: 'todas', texto: `Todas las desbloqueadas (${abiertas.length})` }].concat(abiertas.map((m) => ({ valor: m.id, texto: `${m.id}. ${m.titulo}` }))), 'mision', (v) => (v === 'todas' ? v : Number(v))),
          selector('practica-tipo', 'Tipo de ejercicio', [{ valor: 'todos', texto: 'Todos los tipos' }].concat(tipos.map((t) => ({ valor: t, texto: NOMBRES_TIPO[t] }))), 'tipo')
        ),
        grupo('practica-cantidad', 'Ejercicios', CONFIG.practica.cantidades.map((n) => ({ valor: n, texto: String(n) })), 'cantidad'),
        h(
          'label',
          { class: 'casilla' },
          h('input', {
            type: 'checkbox',
            id: 'practica-ampliacion',
            checked: f.ampliacion,
            onchange: (ev) => {
              f.ampliacion = ev.target.checked;
              actualizar();
            }
          }),
          h('span', { text: 'Incluir ejercicios de Ampliación (lo que no está en la presentación)' })
        ),
        contador,
        h('div', { class: 'acciones' }, btnEmpezar)
      );
      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const lista = util.barajar(filtrados()).slice(0, f.cantidad);
        if (!lista.length) return;
        this.jugar(new Partida(this.misionPractica(), { modo: 'practica', ejercicios: lista }));
      });

      const p = this.aMedias('practica');
      /* util.anadir y no append: append convertiría el null de «sin práctica a medias» en el texto «null». */
      util.anadir(main, [
        h('h1', { class: 'titulo-pantalla', text: 'Práctica libre' }),
        h('p', { class: 'subtitulo', text: 'Elige qué quieres practicar. Los ejercicios salen de las misiones que ya has desbloqueado y se mezclan al azar. La práctica no cuenta para la campaña.' }),
        p
          ? h(
              'section',
              { class: 'panel proxima' },
              /* Con todos los ejercicios resueltos la práctica ya está registrada: solo falta ver sus resultados. */
              h('h2', { text: p.resumenFinal ? 'Tu práctica ha terminado' : 'Tienes una práctica a medias' }),
              h('p', { text: p.resumenFinal ? 'Has resuelto todos los ejercicios. Te falta ver los resultados.' : `Vas por el ejercicio ${p.indice + 1} de ${p.ejercicios.length}.` }),
              h('button', { type: 'button', class: 'btn btn-primario', onclick: () => this.jugar(p) }, util.icono('i-play'), p.resumenFinal ? 'Ver resultados' : 'Continuar la práctica')
            )
          : null,
        form
      ]);
      actualizar();
    },

    /* La práctica se juega como una partida de una misión ficticia que no se guarda en la campaña. */
    misionPractica() {
      return { id: 'practica', titulo: 'Práctica libre', etapas: [{ tipo: 'ejercicios' }], criterio: { precisionMinima: 0, requiere: [], texto: '' }, cierre: '' };
    },

    /* ═════════════ Teoría ═════════════ */
    pintarTeoria() {
      const main = principal();
      main.append(
        h('h1', { class: 'titulo-pantalla', text: 'Teoría' }),
        h('p', { class: 'subtitulo', text: 'Fichas basadas en la presentación «DHCP.01 DHCP». Cada una indica de qué diapositivas sale; lo que no está en la presentación va marcado como Ampliación.' }),
        h('nav', { class: 'accesos', 'aria-label': 'Teoría' }, h('a', { class: 'btn btn-secundario', href: '#/glosario' }, util.icono('i-libro'), `Glosario (${DHCP.data.glosario.length} términos)`))
      );
      const bloques = [];
      for (const f of DHCP.data.teoria) if (!bloques.includes(f.bloque)) bloques.push(f.bloque);
      for (const b of bloques) {
        main.appendChild(
          h(
            'section',
            { class: 'bloque-teoria' },
            h('h2', { text: b }),
            h(
              'ul',
              { class: 'lista-fichas' },
              DHCP.data.teoria
                .filter((f) => f.bloque === b)
                .map((f) => h('li', null, h('a', { class: 'tarjeta-ficha', href: '#/teoria/' + f.id }, h('strong', { text: f.titulo }), h('span', { text: f.resumen }), h('span', { class: 'chip chip-fuente' }, util.icono('i-libro'), util.textoFuente(f.fuente)))))
            )
          )
        );
      }
    },

    /* Glosario: términos ordenados alfabéticamente, con buscador; cada uno enlaza con su ficha. */
    pintarGlosario() {
      const main = principal();
      const normal = (t) => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const terminos = DHCP.data.glosario.slice().sort((a, b) => normal(a.termino).localeCompare(normal(b.termino)));
      const lista = h('dl', { class: 'glosario lista-glosario' });
      const contador = h('p', { class: 'nota', role: 'status', 'aria-live': 'polite' });
      const filas = terminos.map((t) => {
        const ficha = DHCP.data.teoria.find((f) => f.id === t.ficha);
        const dt = h('dt', { id: 'glosario-' + normal(t.termino).replace(/[^a-z0-9]+/g, '-') }, t.termino, t.ampliacion ? h('span', { class: 'chip chip-ampliacion', text: 'Ampliación' }) : null);
        const dd = h(
          'dd',
          null,
          h('p', { text: t.definicion }),
          h('p', { class: 'glosario-meta' }, h('span', { class: 'chip chip-fuente' }, util.icono('i-libro'), util.textoFuente(t.fuente)), ficha ? h('a', { href: '#/teoria/' + ficha.id, text: 'Ficha: ' + ficha.titulo }) : null)
        );
        lista.append(dt, dd);
        return { t, dt, dd, texto: normal(t.termino + ' ' + t.definicion) };
      });
      const filtrar = (consulta) => {
        const q = normal(consulta.trim());
        let visibles = 0;
        filas.forEach((f) => {
          const ver = !q || f.texto.includes(q);
          f.dt.hidden = !ver;
          f.dd.hidden = !ver;
          if (ver) visibles += 1;
        });
        contador.textContent = q ? `${visibles} de ${filas.length} términos` : `${filas.length} términos`;
      };
      const buscador = h('input', { type: 'search', id: 'glosario-buscar', class: 'buscador', placeholder: 'Por ejemplo: exclusión, ACK, puerta…', autocomplete: 'off', oninput: (ev) => filtrar(ev.target.value) });
      main.append(
        h('p', { class: 'migas' }, h('a', { href: '#/teoria', text: 'Teoría' }), ' / Glosario'),
        h('h1', { class: 'titulo-pantalla', text: 'Glosario' }),
        h('p', { class: 'subtitulo', text: 'Los términos de la unidad, con las diapositivas de donde salen y la ficha donde se explican.' }),
        h('div', { class: 'campo campo-buscar' }, h('label', { for: 'glosario-buscar', text: 'Buscar en el glosario' }), buscador),
        contador,
        h('section', { class: 'panel' }, lista)
      );
      filtrar('');
    },

    pintarFicha(id) {
      const main = principal();
      const f = DHCP.data.teoria.find((t) => t.id === id);
      main.appendChild(h('p', { class: 'migas' }, h('a', { href: '#/teoria', text: 'Teoría' }), ' / ', f ? f.titulo : 'Ficha'));
      if (!f) {
        main.appendChild(h('p', { text: 'Esa ficha no existe.' }));
        return;
      }
      main.appendChild(h('article', { class: 'panel' }, h('h1', { text: f.titulo }), this.contenidoFicha(f)));
    },

    /* ═════════════ Perfil ═════════════ */
    pintarPerfil() {
      const main = principal();
      const s = Store.estado.stats;
      const vistos = Object.values(Store.estado.ejercicios).reduce((t, e) => t + e.vistos, 0);
      const lista = this.misiones();
      const completadas = lista.filter((m) => Store.mision(m.id).completada).length;
      const examen = lista.find((m) => m.examen);
      const regExamen = examen ? Store.mision(examen.id) : null;
      const insignias = DHCP.data.insignias || [];
      const ganadas = insignias.filter((i) => Store.logro(i.id)).length;
      const { NOMBRES_NIVEL } = DHCP.Ejercicios;
      /* Precisión por nivel: de todos los intentos guardados de cada ejercicio (campaña, examen y práctica). */
      const porNivel = Object.keys(NOMBRES_NIVEL).map((nivel) => {
        let intentos = 0;
        let aciertos = 0;
        for (const q of DHCP.data.preguntas) {
          const e = q.nivel === nivel && Store.estado.ejercicios[q.id];
          if (!e) continue;
          intentos += e.vistos;
          aciertos += e.aciertosPrimer;
        }
        return { nivel, intentos, aciertos };
      });
      main.append(
        h('h1', { class: 'titulo-pantalla', text: 'Perfil del jugador' }),
        h('p', { class: 'subtitulo', text: Store.disponible ? 'Tu progreso se guarda en este navegador.' : 'El progreso no se puede guardar en este navegador: se perderá al cerrar la página.' }),
        h(
          'section',
          { class: 'tablero-inicio', 'aria-label': 'Estadísticas' },
          this.tarjetaDato('Puntuación total', util.numero(Store.puntuacionTotal()), 'i-trofeo'),
          this.tarjetaDato('Misiones completadas', `${completadas} de ${lista.length}`, 'i-mapa'),
          regExamen ? this.tarjetaDato('Mejor nota del examen', regExamen.mejorNota !== null ? formatoNota(regExamen.mejorNota) : 'Sin hacer', 'i-servidor', regExamen.mejorNota !== null ? `Última: ${formatoNota(regExamen.ultimaNota)}` : null) : null,
          this.tarjetaDato('Insignias', `${ganadas} de ${insignias.length}`, 'i-medalla'),
          this.tarjetaDato('Precisión global', vistos ? util.porcentaje(s.aciertosPrimer / vistos) : '—', 'i-check'),
          this.tarjetaDato('Ejercicios resueltos', String(s.resueltos), 'i-check'),
          this.tarjetaDato('Pistas usadas', String(s.pistas), 'i-pista'),
          this.tarjetaDato('Tiempo jugado', util.formatoTiempo(s.tiempoMs), 'i-reloj'),
          this.tarjetaDato('Mejor racha', String(s.rachaMax), 'i-estrella'),
          this.tarjetaDato('Pendientes de repaso', String(Store.estado.repaso.length), 'i-reiniciar')
        ),
        h(
          'section',
          { class: 'panel' },
          h('h2', { text: 'Insignias' }),
          h('p', { class: 'nota', text: ganadas ? `Has conseguido ${ganadas} de ${insignias.length}. Cada insignia dice cómo se consigue.` : 'Todavía no tienes ninguna. Cada insignia dice cómo se consigue: se ganan al terminar una partida.' }),
          h('ul', { class: 'rejilla-insignias' }, insignias.map((i) => this.tarjetaInsignia(i, Store.logro(i.id))))
        ),
        h(
          'section',
          { class: 'panel' },
          h('h2', { text: 'Precisión por nivel' }),
          h(
            'ul',
            { class: 'lista-niveles' },
            porNivel.map((n) =>
              h(
                'li',
                { class: 'nivel-fila' },
                h('span', { class: 'chip chip-nivel nivel-' + n.nivel, text: NOMBRES_NIVEL[n.nivel] }),
                this.barra(n.intentos ? n.aciertos / n.intentos : 0, `Precisión en los ejercicios de nivel ${NOMBRES_NIVEL[n.nivel].toLowerCase()}`),
                h('span', { class: 'barra-texto', text: n.intentos ? `${util.porcentaje(n.aciertos / n.intentos)} · ${n.aciertos} de ${n.intentos} a la primera` : 'Sin intentos' })
              )
            )
          )
        ),
        h(
          'section',
          { class: 'panel' },
          h('h2', { text: 'Precisión por misión' }),
          h(
            'div',
            { class: 'tabla-scroll' },
            h(
              'table',
              { class: 'tabla tabla-perfil' },
              h('thead', null, h('tr', null, ['Misión', 'Estado', 'Mejor precisión', 'Mejor puntuación', 'Intentos', 'Tiempo', 'Repaso'].map((t) => h('th', { scope: 'col', text: t })))),
              h(
                'tbody',
                null,
                lista.map((m) => {
                  const reg = Store.mision(m.id);
                  const pendientes = this.pendientesDe(m.id);
                  const estado = reg.completada ? '✓ Completada' : this.desbloqueada(m.id) ? 'Disponible' : '🔒 Bloqueada';
                  return h(
                    'tr',
                    null,
                    h('th', { scope: 'row', text: `${m.id}. ${m.titulo}` }),
                    h('td', null, estado, m.examen && reg.mejorNota !== null ? h('span', { class: 'celda-detalle', text: `Mejor nota: ${formatoNota(reg.mejorNota)}` }) : null),
                    h('td', null, this.barra(reg.mejorPrecision, `Precisión de la misión ${m.id}`), h('span', { class: 'barra-texto', text: reg.intentos ? util.porcentaje(reg.mejorPrecision) : '—' })),
                    h('td', { text: reg.intentos ? util.numero(reg.mejorPuntos) : '—' }),
                    h('td', { text: String(reg.intentos) }),
                    h('td', { text: reg.intentos ? util.formatoTiempo(reg.tiempoMs) : '—' }),
                    h('td', null, pendientes.length && this.desbloqueada(m.id) ? h('a', { class: 'btn btn-fantasma btn-compacto', href: '#/repaso/' + m.id, text: `Repasar ${pendientes.length}` }) : h('span', { text: '—' }))
                  );
                })
              )
            )
          )
        ),
        h(
          'section',
          { class: 'panel panel-peligro' },
          h('h2', { text: 'Borrar el progreso' }),
          h('p', { text: 'Borra puntuaciones, misiones completadas, insignias, estadísticas y ajustes guardados en este navegador. No se puede deshacer.' }),
          h('button', { type: 'button', class: 'btn btn-peligro', onclick: () => this.borrarProgreso() }, util.icono('i-papelera'), 'Borrar todo el progreso')
        )
      );
    },

    async borrarProgreso() {
      const ok = await Modal.confirmar({ titulo: 'Borrar todo el progreso', texto: 'Se borrarán tus puntuaciones, las misiones completadas, las insignias y las estadísticas. Esta acción no se puede deshacer. ¿Seguro que quieres borrarlo?', si: 'Sí, borrar', no: 'Cancelar', peligro: true });
      if (!ok) return;
      Store.borrar();
      this.partida = null;
      this.partidas = {};
      this.pintarBotonSonido();
      Router.resolver();
      util.anunciar('Progreso borrado.');
    }
  };

  DHCP.App = App;
  DHCP.Partida = Partida;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init());
  else App.init();
})();

</script>
</body>
</html>
