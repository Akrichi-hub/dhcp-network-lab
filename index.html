      const generan = acciones.filter((a) => a.genera && !a.lento);
      if (!generan.length) return err(dd, 'ninguna acción genera tráfico DHCP');
      if (!acciones.some((a) => !a.genera)) err(dd, 'faltan acciones que no generan DHCP (ping, navegador…)');
      const desde = { no: 0, t: 0 };
      for (let semilla = 1; semilla <= 60; semilla++) {
        const esc = C.escenarioLaboratorio(semilla, e);
        if (!e.leases.includes(esc.lease)) return err(dd, `semilla ${semilla}: Lease Time fuera de la lista`);
        for (const s of sitios) {
          const conDhcp = (lista) => lista.some((p) => p.proto === 'DHCP');
          if (conDhcp(C.flujoLaboratorio(esc, s, null, desde))) return err(dd, `semilla ${semilla}: la captura de fondo («${s.id}») no debe tener DHCP`);
          for (const a of acciones.filter((x) => !x.genera)) if (conDhcp(C.flujoLaboratorio(esc, s, a.id, desde))) return err(dd, `semilla ${semilla}: «${a.id}» no debería generar DHCP`);
          for (const a of generan) {
            const lista = C.flujoLaboratorio(esc, s, a.id, desde);
            if (lista.some((p, i) => p.no !== i + 1 || (i && Number(p.time) < Number(lista[i - 1].time)))) return err(dd, `semilla ${semilla}: los paquetes deben ir numerados y en orden de tiempo`);
            const propios = lista.filter((p) => p.dhcp && p.dhcp.xid === esc.cliente.xid);
            const cuenta = (t) => propios.filter((p) => p.dhcp.tipo === t).length;
            const completo = ['DISCOVER', 'OFFER', 'REQUEST', 'ACK'].every((t) => cuenta(t) > 0);
            if (completo !== s.ok) return err(dd, `semilla ${semilla}: desde «${s.id}» el DORA ${completo ? 'se ve completo' : 'no se ve completo'} con «${a.id}», pero el sitio está marcado como ${s.ok ? 'válido' : 'no válido'}`);
            if (!s.ok) continue;
            if (cuenta('DISCOVER') !== 2 || cuenta('REQUEST') !== 2) return err(dd, `semilla ${semilla}: el DORA debe repetir el Discover y el Request, como la captura de la diap. 36`);
            const ack = propios.find((p) => p.dhcp.tipo === 'ACK');
            if (ack.dhcp.lease !== esc.lease || ack.dhcp.yiaddr !== esc.cliente.ip || ack.dhcp.mac !== esc.cliente.mac) return err(dd, `semilla ${semilla}: el ACK no lleva el Lease Time, la IP o la MAC del cliente`);
            if (esc.otro && s.ve === 'todo' && !lista.some((p) => p.dhcp && p.dhcp.xid === esc.otro.xid && p.dhcp.tipo === 'ACK')) return err(dd, `semilla ${semilla}: falta el DORA del otro cliente en la captura del servidor`);
          }
        }
      }
    },

    /* Laboratorio con terminal (misión 10): la solución esperada genera DORA, RELEASE y DORA con mensajes
       correctos, los sitios válidos ven el DORA completo y la salida de dhclient -d -r es la de la diap. 21. */
    _labTerminal(e, dd, err, aviso) {
      const T = DHCP.Terminal;
      const C = DHCP.Captura;
      for (const c of ['titulo', 'incidencia', 'equipoNombre', 'macServidor', 'nota']) if (!e[c]) err(dd, `falta «${c}»`);
      const q = e.equipo || {};
      const faltan = ['usuario', 'host', 'iface', 'mac', 'ip', 'prefijo', 'servidor', 'lease'].filter((c) => q[c] === undefined || q[c] === '');
      if (faltan.length) return err(dd, 'faltan datos del equipo: ' + faltan.join(', '));
      if (q.arriba) aviso(dd, 'el equipo empieza con la tarjeta activa: no habría avería que diagnosticar');
      (e.atajos || []).forEach((orden) => {
        const r = new T.Maquina(Object.assign({ semilla: 1 }, q)).ejecutar(orden);
        if (r.lineas.some((l) => l.clase === 'error' && /orden no encontrada|Cannot find device|Unknown command/.test(l.texto))) err(dd, `el atajo «${orden}» no es una orden que entienda el terminal`);
      });
      this._sitios(e.sitios, dd, err);
      const m = new T.Maquina(Object.assign({ semilla: 7 }, q));
      const eventos = [];
      ['ip a', `sudo ip link set ${q.iface} up`, `sudo dhclient -r ${q.iface}`, `sudo dhclient ${q.iface}`].forEach((orden) => eventos.push(...m.ejecutar(orden).eventos));
      if (!eventos.some((ev) => ev.tipo === 'ipa')) err(dd, 'ip a no genera el evento de diagnóstico');
      const dhcp = eventos.filter((ev) => ev.tipo === 'dhcp');
      if (dhcp.map((ev) => ev.flujo).join(',') !== 'dora,release,dora') return err(dd, `la solución esperada genera «${dhcp.map((ev) => ev.flujo).join(', ')}» en vez de DORA, RELEASE y DORA`);
      const base = { nodos: [{ id: 'cliente', tipo: 'cliente', etiqueta: 'Portátil' }, { id: 'servidor', tipo: 'servidor', etiqueta: 'Servidor DHCP', ip: q.servidor }] };
      this._pendientes = this._pendientes || [];
      dhcp.forEach((ev) => {
        const esc = Object.assign({ mensajes: ev.mensajes }, base);
        ev.mensajes.forEach((msg, i) => this.comprobarMensaje(msg, esc).forEach((t) => err(`${dd} · ${ev.flujo} · mensaje ${i + 1}`, t)));
        this._pendientes.push(this._ejecutarEscenario(esc, 'escalera').then((fallos) => fallos.forEach((t) => err(`${dd} · ${ev.flujo}`, t))));
        if (ev.dhcp.map((d) => d.tipo).join() !== ev.mensajes.map((msg) => msg.tipo).join()) err(dd, `los paquetes capturados del ${ev.flujo} no coinciden con los mensajes animados`);
      });
      const ctx = { servidor: q.servidor };
      (e.sitios || []).forEach((s) => {
        const vistos = dhcp[0].dhcp.map((d) => Object.assign(C.paqueteDhcp(d, ctx), { ambito: 'intranet' })).filter((p) => C.visibleDesde(p, s, { cliente: { ip: q.ip } }));
        const completo = ['DISCOVER', 'OFFER', 'REQUEST', 'ACK'].every((t) => vistos.some((p) => p.dhcp.tipo === t));
        if (completo !== s.ok) err(dd, `desde «${s.id}» el DORA ${completo ? 'se ve completo' : 'no se ve completo'}, pero el sitio está marcado como ${s.ok ? 'válido' : 'no válido'}`);
      });
      /* La salida de «sudo dhclient -d -r» con una concesión activa tiene que ser la de la diap. 21. */
      const m21 = new T.Maquina(Object.assign({ semilla: 3 }, q), { arriba: true, concesion: { ip: q.ip, servidor: q.servidor, lease: q.lease } });
      const salida = m21.ejecutar(`sudo dhclient -d -r ${q.iface}`).lineas.map((l) => l.texto);
      const esperada = T.CABECERA_DHCLIENT.concat([`Listening on LPF/${q.iface}/${q.mac}`, `Sending on   LPF/${q.iface}/${q.mac}`, 'Sending on   Socket/fallback', `DHCPRELEASE of ${q.ip} on ${q.iface} to ${q.servidor} port 67`]);
      if (salida.join('\n') !== esperada.join('\n')) err(dd, 'la salida de sudo dhclient -d -r no reproduce la de la diap. 21');
      if (q.iface === 'wlp2s0' && (q.mac !== 'c0:35:32:56:18:75' || q.ip !== '10.4.56.43' || q.servidor !== '10.4.56.1')) err(dd, 'el portátil de la diap. 21 tiene la MAC c0:35:32:56:18:75, la IP 10.4.56.43 y el servidor 10.4.56.1');
    },

    /* Ejercicio de captura: la captura existe, la respuesta sale de sus datos y cada error tiene explicación. */
    _captura(ej, donde, err, aviso) {
      const C = DHCP.Captura;
      const cap = (DHCP.data.capturas || {})[ej.captura];
      if (!cap || !Array.isArray(cap.paquetes)) return err(donde, `la captura «${ej.captura}» no existe`);
      const porNo = new Map(cap.paquetes.map((p) => [p.no, p]));
      const s = ej.solucion || {};
      const tieneClave = (p, clave) => {
        const buscar = (nodos) => nodos.some((n) => n.clave === clave || (n.hijos && buscar(n.hijos)));
        return buscar(C.detalle(p, Object.assign({}, cap.contexto)));
      };
      if (s.filtro !== undefined && !C.filtrar(cap.paquetes, s.filtro).valido) err(donde, `el filtro de la solución no es válido: ${s.filtro}`);
      if (ej.xid && !cap.paquetes.some((p) => p.dhcp && p.dhcp.xid === ej.xid)) err(donde, `ningún paquete tiene el Transaction ID ${ej.xid}`);
      let paqueteSolucion = s.paquete;
      if (ej.modo === 'paquete') {
        if (!Array.isArray(ej.correctas) || !ej.correctas.length) return err(donde, 'faltan los paquetes correctos («correctas»)');
        ej.correctas.forEach((no) => !porNo.has(no) && err(donde, `el paquete correcto nº ${no} no está en la captura`));
        paqueteSolucion = ej.correctas[0];
        const rol = (p) => DHCP.Ejercicios.rolPaquete(p, ej);
        const malos = cap.paquetes.filter((p) => !ej.correctas.includes(p.no));
        const roles = new Set(malos.map(rol));
        roles.forEach((r) => (!ej.porQueNo || !ej.porQueNo[r]) && err(donde, `falta «porQueNo» para los paquetes de tipo «${r}»`));
        Object.keys(ej.porQueNo || {}).forEach((r) => !roles.has(r) && err(donde, `«porQueNo» explica «${r}», pero ningún paquete incorrecto es de ese tipo`));
        const rolesBuenos = new Set(ej.correctas.map((no) => porNo.get(no)).filter(Boolean).map(rol));
        rolesBuenos.forEach((r) => roles.has(r) && aviso(donde, `hay paquetes «${r}» correctos e incorrectos: la explicación por tipo puede confundir`));
      } else if (ej.modo === 'valor') {
        const r = ej.respuesta || {};
        if (!['duracion', 'numero', 'ip'].includes(r.tipo)) return err(donde, `tipo de respuesta no válido: ${r.tipo}`);
        if (r.valor === undefined || !r.texto) err(donde, 'la respuesta necesita «valor» y «texto»');
        for (const c of ['etiqueta', 'formato', 'errorGenerico']) if (!ej[c]) err(donde, `falta «${c}»`);
        const leer = (t) => DHCP.Ejercicios.leerValor(t, r.tipo);
        if (r.texto && String(leer(r.texto)) !== String(r.valor)) err(donde, `el texto de la respuesta («${r.texto}») no se interpreta como ${r.valor}`);
        const p = porNo.get(s.paquete);
        if (r.origen === 'lease' && !(p && p.dhcp && p.dhcp.lease === r.valor)) err(donde, 'la respuesta no coincide con el Lease Time del paquete de la solución');
        else if (r.origen === 'yiaddr' && !(p && p.dhcp && p.dhcp.yiaddr === r.valor)) err(donde, 'la respuesta no coincide con la IP concedida en el paquete de la solución');
        else if (r.origen === 'intercambios' && C.intercambios(cap.paquetes) !== r.valor) err(donde, `la captura tiene ${C.intercambios(cap.paquetes)} intercambios, no ${r.valor}`);
        else if (!['lease', 'yiaddr', 'intercambios'].includes(r.origen)) err(donde, 'la respuesta necesita un «origen» (lease, yiaddr o intercambios) para comprobarla con la captura');
        (ej.erroresTipicos || []).forEach((x) => {
          if (x.valor === undefined || !x.etiqueta || !x.texto) err(donde, 'cada error típico necesita «valor», «etiqueta» y «texto»');
          if (String(x.valor) === String(r.valor)) err(donde, `el error típico «${x.etiqueta}» coincide con la respuesta correcta`);
        });
        if (r.origen === 'intercambios') {
          const nDhcp = cap.paquetes.filter((x) => x.proto === 'DHCP').length;
          (ej.erroresTipicos || []).filter((x) => /paquetes DHCP/.test(x.texto)).forEach((x) => x.valor !== nDhcp && err(donde, `el error típico «${x.etiqueta}» habla del número de paquetes DHCP, que es ${nDhcp}`));
        }
      } else return err(donde, `modo no válido: ${ej.modo}`);
      if (paqueteSolucion !== undefined) {
        const p = porNo.get(paqueteSolucion);
        if (!p) return err(donde, `el paquete de la solución (nº ${paqueteSolucion}) no está en la captura`);
        for (const clave of [s.abrir, s.destacar].filter(Boolean)) if (!tieneClave(p, clave)) err(donde, `el detalle del paquete nº ${p.no} no tiene la rama «${clave}»`);
      }
    },

    /* Capturas de DHCP.data.capturas: orden, formato de Wireshark y coherencia de cada paquete DHCP. */
    _capturas(err, comprobarFuente) {
      const C = DHCP.Captura;
      const capturas = DHCP.data.capturas || {};
      for (const [id, cap] of Object.entries(capturas)) {
        if (id === 'ruido') continue;
        const donde = 'captura ' + id;
        const ctx = cap.contexto || {};
        const faltan = ['interfaz', 'servidor', 'macServidor', 'mascara', 'router', 'dns'].filter((c) => !ctx[c]);
        if (faltan.length) err(donde, 'faltan datos del contexto: ' + faltan.join(', '));
        if (!cap.titulo || !cap.nota) err(donde, 'la captura necesita «titulo» y «nota»');
        comprobarFuente(donde, cap.fuente);
        const macDeXid = {};
        (cap.paquetes || []).forEach((p, i, lista) => {
          const dp = `${donde} · nº ${p.no}`;
          const sinCampo = ['no', 'time', 'src', 'dst', 'proto', 'len', 'info'].filter((c) => p[c] === undefined || p[c] === '');
          if (sinCampo.length) return err(dp, 'faltan campos: ' + sinCampo.join(', '));
          if (i && (p.no <= lista[i - 1].no || Number(p.time) < Number(lista[i - 1].time))) err(dp, 'los paquetes deben ir en orden de número y de tiempo');
          if (p.proto === 'DHCP') {
            const d = p.dhcp;
            if (!d || !C.TIPOS[d.tipo] || !d.xid || !d.mac) return err(dp, 'paquete DHCP sin datos «dhcp» válidos (tipo, xid y mac)');
            const esperado = C.paqueteDhcp(d, ctx);
            if (p.info !== esperado.info) err(dp, `la columna Info no sigue el formato de Wireshark: «${esperado.info}»`);
            if (p.src !== esperado.src || p.dst !== esperado.dst) err(dp, `un ${d.tipo} va de ${esperado.src} a ${esperado.dst}`);
            if (p.len !== esperado.len) err(dp, `Length incoherente con un ${d.tipo}: ${esperado.len}`);
            if ((d.tipo === 'OFFER' || d.tipo === 'ACK') && !(d.lease > 0 && d.yiaddr)) err(dp, `un ${d.tipo} necesita «yiaddr» y «lease»`);
            if (d.tipo === 'REQUEST' && !d.pedida) err(dp, 'un REQUEST necesita la IP pedida («pedida»)');
            if (macDeXid[d.xid] && macDeXid[d.xid] !== d.mac) err(dp, `el Transaction ID ${d.xid} aparece con dos MAC distintas`);
            macDeXid[d.xid] = d.mac;
          } else if (p.dhcp) err(dp, 'solo los paquetes DHCP llevan «dhcp»');
          try {
            C.detalle(p, Object.assign({}, ctx));
          } catch (e) {
            err(dp, 'no se puede construir el detalle: ' + e.message);
          }
        });
      }
      const ruido = capturas.ruido || {};
      for (const ambito of ['intranet', 'internet']) {
        const lista = ruido[ambito] || [];
        if (!lista.length) err('captura ruido', `falta el tráfico de fondo de «${ambito}»`);
        lista.forEach((p, i) => ['src', 'dst', 'proto', 'len', 'info'].some((c) => p[c] === undefined || p[c] === '') && err('captura ruido', `la plantilla ${ambito} nº ${i + 1} está incompleta`));
      }
    },

    /* Rango de una situación o de un paso que falta: franjas consecutivas y referencias válidas. */
    _rango(r, donde, err) {
      const segs = r.segmentos || [];
      if (!r.red || !segs.length) return err(donde, 'el rango necesita «red» y «segmentos»');
      segs.forEach((s, i) => {
        if (!(s.desde >= 1 && s.hasta <= 254 && s.desde <= s.hasta)) err(donde, `franja ${i + 1} fuera de .1–.254`);
        if (i && s.desde !== segs[i - 1].hasta + 1) err(donde, 'las franjas del rango deben ser consecutivas');
      });
      (r.reservas || []).forEach((x) => (!x.equipo || !x.mac || !(x.ip >= 1 && x.ip <= 254)) && err(donde, 'cada reserva necesita «equipo», «mac» e «ip»'));
    },

    _pasoFalta(ej, donde, err) {
      if (!['dora', 'captura', 'texto'].includes(ej.estilo)) err(donde, `estilo de secuencia no válido: ${ej.estilo}`);
      if (ej.seleccion === 'fila') {
        if (!Array.isArray(ej.paquetes) || ej.paquetes.length !== ej.opciones.length) err(donde, 'con selección por fila, cada opción debe corresponder a una fila de «paquetes»');
        return;
      }
      const pasos = ej.secuencia || (ej.escenario && ej.escenario.mensajes);
      if (!pasos) return err(donde, 'necesita «secuencia» o un escenario con hueco');
      const nHuecos = ej.secuencia ? ej.secuencia.filter((p) => p.hueco).length : typeof ej.escenario.hueco === 'number' ? 1 : 0;
      if (nHuecos !== 1) err(donde, `la secuencia debe tener exactamente un hueco (tiene ${nHuecos})`);
      if (ej.estilo === 'dora' && !ej.escenario) err(donde, 'el estilo «dora» necesita un escenario');
      if (ej.rango) {
        this._rango(ej.rango, donde, err);
        const acc = ej.rango.alAcertar || {};
        if (typeof acc.moverMarca === 'number' && !(ej.rango.marcas || [])[acc.moverMarca]) err(donde, '«alAcertar.moverMarca» apunta a una marca inexistente');
        if (typeof acc.reserva === 'number' && !(ej.rango.reservas || [])[acc.reserva]) err(donde, '«alAcertar.reserva» apunta a una reserva inexistente');
        if (typeof acc.rellenar === 'number' && !(ej.rango.segmentos[acc.rellenar] && ej.rango.segmentos[acc.rellenar].hueco)) err(donde, '«alAcertar.rellenar» debe apuntar al segmento con hueco');
      }
    },

    /* Ejecuta el escenario en un animador oculto (sin animación) y comprueba quién recibe cada paquete. */
    async _ejecutarEscenario(escenario, layout) {
      const fallos = [];
      const caja = util.h('div', { style: { position: 'absolute', left: '-9999px', width: '400px' }, 'aria-hidden': 'true' });
      document.body.appendChild(caja);
      let anim = null;
      try {
        anim = new DHCP.PacketAnimator(caja, escenario, { layout, filas: escenario.mensajes.length });
        for (let i = 0; i < escenario.mensajes.length; i++) await anim.send(escenario.mensajes[i], { instantaneo: true, fila: i });
        const nodosRed = anim.nodos.filter((n) => n.tipo !== 'switch').map((n) => n.id);
        if (anim.registro.length !== escenario.mensajes.length) fallos.push(`el animador entregó ${anim.registro.length} de ${escenario.mensajes.length} mensajes`);
        anim.registro.forEach((r, i) => {
          const alcanzados = r.entregadoA.concat(r.descartadoPor).sort();
          if (r.modo === 'broadcast') {
            const esperados = nodosRed.filter((id) => id !== r.de).sort();
            if (alcanzados.join() !== esperados.join()) fallos.push(`mensaje ${i + 1} (${r.tipo}): el broadcast no alcanzó a todos los equipos del segmento`);
            if (DHCP.data.mensajes[r.tipo].emisor === 'servidor') {
              if (r.entregadoA.join() !== String(r.para)) fallos.push(`mensaje ${i + 1} (${r.tipo}): el broadcast del servidor debe procesarlo solo el cliente «${r.para}»`);
            } else {
              for (const id of r.descartadoPor) if (anim.nodo(id).tipo === 'servidor') fallos.push(`mensaje ${i + 1}: un servidor DHCP descartó el broadcast`);
              for (const id of r.entregadoA) if (anim.nodo(id).tipo !== 'servidor') fallos.push(`mensaje ${i + 1}: «${id}» procesó un broadcast sin ser servidor DHCP`);
            }
          } else if (r.entregadoA.length !== 1 || r.entregadoA[0] !== r.a || r.descartadoPor.length) {
            fallos.push(`mensaje ${i + 1} (${r.tipo}): el unicast no llegó solo a su destino`);
          }
        });
      } catch (e) {
        fallos.push('el animador falló al reproducir el escenario: ' + e.message);
      } finally {
        if (anim) anim.destruir();
        caja.remove();
      }
      return fallos;
    },

    /* Ejecuta la validación completa y espera a las comprobaciones de animación. */
    async ejecutar() {
      this._pendientes = [];
      let r;
      try {
        r = this.run();
      } catch (e) {
        r = this.resultado || { errores: [], avisos: [], resumen: { ejercicios: 0, porTipo: {}, porMision: {}, fichas: 0, misiones: 0, escenarios: 0 } };
        r.errores.push({ donde: 'validador', texto: 'la validación se interrumpió: ' + e.message });
        this.resultado = r;
      }
      /* allSettled: un escenario que falle no puede ocultar el resto de errores. */
      const estados = await Promise.allSettled(this._pendientes);
      estados.filter((x) => x.status === 'rejected').forEach((x) => r.errores.push({ donde: 'validador', texto: 'una comprobación de animación falló: ' + (x.reason && x.reason.message) }));
      return r;
    },

    async mostrar() {
      const r = await this.ejecutar();
      const titulo = `[Validador] ${r.resumen.ejercicios} ejercicios, ${r.resumen.fichas} fichas, ${r.resumen.misiones} misiones, ${r.resumen.escenarios} escenarios animados`;
      console.info(titulo + ` → ${r.errores.length} errores, ${r.avisos.length} avisos.`);
      console.info('[Validador] Ejercicios por tipo:', JSON.stringify(r.resumen.porTipo), '· por misión:', JSON.stringify(r.resumen.porMision));
      r.errores.forEach((e) => console.error(`[Validador] ${e.donde}: ${e.texto}`));
      r.avisos.forEach((a) => console.warn(`[Validador] ${a.donde}: ${a.texto}`));
      this._panel(r);
      window.DHCP.validacion = r;
      return r;
    },

    _panel(r) {
      const { h } = util;
      const anterior = document.getElementById('panel-validador');
      if (anterior) anterior.remove();
      const ok = !r.errores.length;
      const lista = h(
        'ul',
        { class: 'validador-lista' },
        r.errores.map((e) => h('li', { class: 'mal', text: `✗ ${e.donde}: ${e.texto}` })),
        r.avisos.map((a) => h('li', { class: 'aviso', text: `⚠ ${a.donde}: ${a.texto}` })),
        ok && !r.avisos.length ? h('li', { class: 'ok', text: '✓ Sin errores ni avisos.' }) : null
      );
      const detalle = h(
        'div',
        { class: 'validador-detalle', hidden: true },
        h('p', { text: `Por tipo: ${Object.entries(r.resumen.porTipo).map(([k, v]) => k + ' ' + v).join(' · ')}` }),
        h('p', { text: `Por misión: ${Object.entries(r.resumen.porMision).map(([k, v]) => 'M' + k + ' ' + v).join(' · ')}` }),
        lista,
        h('label', { class: 'validador-desbloquear' }, h('input', { type: 'checkbox', onchange: (e) => DHCP.App.desbloquearTodo(e.target.checked), checked: DHCP.App.todoDesbloqueado || undefined }), ' Desbloquear todas las misiones (solo en esta sesión)')
      );
      const boton = h('button', {
        type: 'button',
        class: 'validador-boton ' + (ok ? 'ok' : 'mal'),
        'aria-expanded': 'false',
        text: `Validador: ${r.errores.length} errores · ${r.avisos.length} avisos`,
        onclick: () => {
          detalle.hidden = !detalle.hidden;
          boton.setAttribute('aria-expanded', String(!detalle.hidden));
        }
      });
      document.body.appendChild(h('aside', { id: 'panel-validador', class: 'panel-validador', 'aria-label': 'Validador de contenido' }, boton, detalle));
    }
  };

  DHCP.Validator = Validator;
})();

  <script data-firma>
/* js/firma.js */
/* DHCP Network Lab — Firma digital del autor.
   Al generar dist/index.html (tools/build.js) se firman, con la clave privada del autor (ECDSA P-256 con SHA-256),
   la fecha de la firma y el texto de cada <style> y <script> del juego. La clave privada no viaja en el archivo; la
   firma, la clave pública y la fecha van en el bloque #firma-digital. Al abrir el juego, el navegador vuelve a
   juntar ese texto y comprueba la firma con WebCrypto; en el archivo suelto comprueba además que nadie le haya
   añadido código fuera de lo firmado. Si se cambia una sola letra del código o de la autoría, deja de coincidir.
   Ninguna comprobación que haga el propio archivo es infalible (quien sepa programar puede cambiar también esta):
   por eso la huella de la clave figura en la memoria del proyecto, y `node tools/firma.js verificar` comprueba un
   archivo por fuera con la clave pública del repositorio.
   Estados: valida · invalida (motivo firma, anadido o autoria) · sin-firma (archivo final al que le han quitado la
   firma) · trabajo (archivos del proyecto, sin generar) · no-disponible (motivo navegador o inseguro). */
(function () {
  'use strict';

  const deBase64 = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const hex = (buffer) => Array.from(new Uint8Array(buffer), (b) => b.toString(16).padStart(2, '0')).join('');

  /* Lo firmado: la fecha y el texto de cada <style> y <script> marcado con data-firma, en el orden del documento. */
  const firmados = () => Array.from(document.querySelectorAll('style[data-firma], script[data-firma]'), (el) => el.textContent);
  const mensaje = (fecha, textos) => new TextEncoder().encode(JSON.stringify({ fecha, textos }));

  /* El autor tal como se firmó: se lee del texto firmado de js/data/autoria.js, no de los datos en memoria. */
  function autorFirmado(textos) {
    for (const t of textos) {
      const m = /DHCP\.data\.autoria\s*=\s*\{[\s\S]*?\bautor:\s*'([^']*)'/.exec(t);
      if (m) return m[1];
    }
    return '';
  }

  /* Todos los elementos del documento, también los de los shadow roots abiertos (el navegador convierte en uno cada
     <template shadowrootmode="open"> del HTML) y los de otros espacios de nombres, como el <script> de un SVG, que
     document.scripts no lista. Un shadow root cerrado no se puede recorrer desde aquí: lo cubre `tools/firma.js
     verificar`, que lee el texto del archivo, y la CSP, que impide ejecutar en él scripts que no sean los del juego. */
  function todosLosElementos(raiz, salida = []) {
    for (const el of raiz.querySelectorAll('*')) {
      salida.push(el);
      if (el.shadowRoot) todosLosElementos(el.shadowRoot, salida);
    }
    return salida;
  }

  /* Código añadido fuera de lo firmado. Solo en el archivo suelto (el bloque de la firma está en <head>): dentro de
     un visor que envuelve la página, como el de los Artifacts, el visor añade sus propios elementos. */
  function codigoAnadido(bloque) {
    if (bloque.parentNode !== document.head) return false;
    const ejecutable = (s) => {
      const tipo = (s.getAttribute('type') || '').trim().toLowerCase();
      return !tipo || tipo === 'module' || /^(text|application)\/(x-)?(java|ecma)script$/.test(tipo);
    };
    const extension = (s) => /^(chrome|moz|safari-web)-extension:/.test(s.src || s.getAttribute('href') || '');
    /* Solo están firmados los elementos que firmados() recoge, que son los del documento: un data-firma dentro de un
       shadow root no está firmado y no puede servir para esquivar el escaneo. */
    const firmadosAqui = new Set(document.querySelectorAll('style[data-firma], script[data-firma]'));
    const sospechoso = (el) => {
      const etiqueta = el.localName;
      if (etiqueta === 'script' && el !== bloque && !firmadosAqui.has(el) && ejecutable(el) && !extension(el)) return true;
      if (etiqueta === 'style' && !firmadosAqui.has(el)) return true;
      if (etiqueta === 'link' && /(^|\s)stylesheet(\s|$)/i.test(el.getAttribute('rel') || '')) return true;
      if (['iframe', 'frame', 'object', 'embed', 'base'].includes(etiqueta)) return true;
      if (etiqueta === 'template' && (el.hasAttribute('shadowrootmode') || el.hasAttribute('shadowroot'))) return true;
      if (/^javascript:/i.test(el.getAttribute('href') || '') || /^javascript:/i.test(el.getAttribute('src') || '')) return true;
      return Array.from(el.attributes).some((a) => /^on/i.test(a.name));
    };
    return todosLosElementos(document).some(sospechoso);
  }

  async function comprobar() {
    const bloque = document.getElementById('firma-digital');
    if (!bloque) return { estado: document.querySelector('script[src$="js/app.js"]') ? 'trabajo' : 'sin-firma' };
    let datos;
    try {
      datos = JSON.parse(bloque.textContent);
    } catch (e) {
      return { estado: 'invalida', motivo: 'firma' };
    }
    if (!datos || typeof datos.clave !== 'string' || typeof datos.firma !== 'string' || typeof datos.fecha !== 'string') return { estado: 'invalida', motivo: 'firma' };
    const fecha = datos.fecha;
    const sutil = window.crypto && window.crypto.subtle;
    if (!sutil || typeof TextEncoder === 'undefined') return { estado: 'no-disponible', motivo: window.isSecureContext === false ? 'inseguro' : 'navegador', fecha };
    let huella = '';
    try {
      const clave = deBase64(datos.clave);
      huella = hex(await sutil.digest('SHA-256', clave));
      const textos = firmados();
      const publica = await sutil.importKey('spki', clave, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      if (!(await sutil.verify({ name: 'ECDSA', hash: 'SHA-256' }, publica, deBase64(datos.firma), mensaje(fecha, textos)))) return { estado: 'invalida', motivo: 'firma', huella, fecha };
      if (codigoAnadido(bloque)) return { estado: 'invalida', motivo: 'anadido', huella, fecha };
      return { estado: 'valida', huella, fecha, autor: autorFirmado(textos) };
    } catch (e) {
      /* Un navegador sin ECDSA no puede comprobarla; una clave o una firma dañadas sí la invalidan. */
      return e && e.name === 'NotSupportedError' ? { estado: 'no-disponible', motivo: 'navegador', fecha } : { estado: 'invalida', motivo: 'firma', huella, fecha };
    }
  }

  let resultado = null;

  DHCP.Firma = {
    /* Se comprueba una sola vez por carga de la página. */
    comprobar() {
      if (!resultado) resultado = comprobar();
      return resultado;
    },

    /* Huella de la clave pública para comparar a simple vista: «1A2B 3C4D …» (los 16 primeros bytes). */
    huellaCorta(huella) {
      return (huella || '').slice(0, 32).toUpperCase().replace(/(.{4})(?!$)/g, '$1 ');
    }
  };
})();

  <script data-firma>
/* js/app.js */
/* DHCP Network Lab — Aplicación: pantallas (inicio, misiones, misión, teoría, perfil), partida de una
   misión (laboratorio DORA → ejercicios → resultados), puntuación y arranque. */
(function () {
  'use strict';
  const { util, Store, Router, Modal, CONFIG } = DHCP;
  const { h } = util;

  const principal = () => document.getElementById('principal');

  /* Nota del examen: «8,5». La calificación sigue la escala habitual en España. */
  /* Números con coma decimal, como se escriben en español: 1,5 · 8,0. */
  const coma = (n, decimales) => (decimales === undefined ? String(n) : n.toFixed(decimales)).replace('.', ',');
  const multiplicador = () => '×' + coma(CONFIG.racha.multiplicador);
  const formatoNota = (n) => (typeof n === 'number' ? coma(n, 1) : '—');
  const calificacion = (n) => (n < 5 ? 'Insuficiente' : n < 6 ? 'Suficiente' : n < 7 ? 'Bien' : n < 9 ? 'Notable' : 'Sobresaliente');
  /* «A, B y C» (o «e» delante de i-/hi-, como en «PC e impresora»). */
  const listaEs = (items) => (items.length < 2 ? items.join('') : `${items.slice(0, -1).join(', ')} ${/^h?i(?!e)/i.test(items[items.length - 1]) ? 'e' : 'y'} ${items[items.length - 1]}`);
  const NUMEROS = { 2: 'dos', 3: 'tres', 4: 'cuatro', 5: 'cinco', 6: 'seis' };
  const fechaCorta = (iso) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
  };
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const fechaLarga = (iso) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? `${Number(m[3])} de ${MESES[Number(m[2]) - 1]} de ${m[1]}` : '';
  };

  const TITULO_PAGINA = 'DHCP Network Lab';
  const NOMBRES_SECCION = { misiones: 'Misiones', practica: 'Práctica', teoria: 'Teoría', perfil: 'Perfil' };

  /* Firma digital del autor (DHCP.Firma): aviso del pie y explicación de la ventana para cada estado (y motivo).
     tipo ok/mal colorea el sello de la cabecera, el botón del pie y la ficha de la ventana. */
  const ESTADOS_FIRMA = {
    comprobando: { tipo: '', boton: 'Firma digital', titulo: 'Comprobando la firma…', texto: () => 'Un momento: el navegador está comprobando la firma digital del archivo.' },
    valida: {
      tipo: 'ok',
      boton: 'Firma digital válida',
      titulo: 'Firma válida',
      texto: (f) => `El código de este juego es el que firmó ${f.autor}${f.fecha ? ' el ' + fechaLarga(f.fecha) : ''} y no se ha modificado.`
    },
    invalida: {
      tipo: 'mal',
      boton: 'Firma digital no válida',
      titulo: 'La firma no coincide',
      texto: (f) =>
        f.motivo === 'anadido'
          ? 'Alguien ha añadido código a este archivo después de firmarlo, así que no es el original de su autor.'
          : f.motivo === 'autoria'
            ? 'El nombre de autor que muestra el juego no es el que se firmó: el archivo se ha modificado.'
            : 'Este archivo se ha modificado después de firmarlo, así que no es el original de su autor.'
    },
    'sin-firma': { tipo: 'mal', boton: 'Sin firma digital', titulo: 'Este archivo no lleva firma', texto: () => 'Le han quitado la firma digital de su autor: puede ser una copia modificada.' },
    trabajo: { tipo: '', boton: 'Versión de trabajo, sin firmar', titulo: 'Versión de trabajo', texto: () => 'Son los archivos del proyecto, sin firmar. La firma se añade al generar dist/index.html.' },
    'no-disponible': {
      tipo: '',
      boton: 'Firma digital',
      titulo: 'No se puede comprobar aquí',
      texto: (f) =>
        f.motivo === 'inseguro'
          ? 'El navegador solo comprueba firmas en páginas seguras: abre el archivo con doble clic o desde una dirección https.'
          : 'Este navegador no permite comprobar firmas digitales. Abre el juego con Chrome, Edge, Firefox o Safari actualizados.'
    }
  };

  /* ═════════════ Partida de una misión ═════════════ */
  class Partida {
    /* modo: normal | repaso (solo los ejercicios indicados en o.ids) | practica (los de o.ejercicios, de la
       práctica libre). El examen final (mision.examen) elige 20 ejercicios del banco cada vez que empieza. */
    constructor(mision, opciones) {
      const o = opciones || {};
      this.mision = mision;
      this.modo = o.modo || 'normal';
      this.examen = !!mision.examen;
      if (o.ejercicios) this.ejercicios = o.ejercicios.slice();
      else if (this.examen) this.ejercicios = o.ids ? DHCP.data.preguntas.filter((p) => o.ids.includes(p.id)).sort(DHCP.Examen.orden) : DHCP.Examen.seleccionar(mision.examen);
      else {
        const banco = DHCP.data.preguntas.filter((p) => p.mision === mision.id).sort((a, b) => a.id.localeCompare(b.id));
        this.ejercicios = o.ids ? banco.filter((p) => o.ids.includes(p.id)) : banco;
      }
      this.etapas = this.modo === 'normal' ? mision.etapas : [{ tipo: 'ejercicios' }];
      this.etapaIndice = 0;
      this.indice = 0;
      this.resultados = {};
      this.puntos = 0;
      this.racha = 0;
      this.rachaMax = 0;
      this.pistasUsadas = 0;
      /* Solo la partida normal es un intento de la misión: los repasos y la práctica no suman intentos. */
      this.intento = this.modo === 'normal' ? Store.mision(mision.id).intentos + 1 : null;
      this.tiempoAcumulado = 0;
      this.inicioTramo = null;
      this.pausada = false;
      this.terminada = false;
      this.estados = {};
      /* Etapas interactivas (laboratorios, simulación, mapa): hecha = ya se puede continuar; estado = su progreso. */
      this.etapaHecha = {};
      this.estadoEtapa = {};
    }

    get etapaActual() {
      return this.etapas[this.etapaIndice];
    }

    /* Estado persistente de la etapa actual: sobrevive a salir y volver con «Continuar». */
    estadoDeEtapa(inicial) {
      const k = this.etapaIndice;
      if (!this.estadoEtapa[k]) this.estadoEtapa[k] = inicial();
      return this.estadoEtapa[k];
    }

    get etapa() {
      return this.terminada ? 'resultados' : this.etapas[this.etapaIndice].tipo;
    }

    get ejercicioActual() {
      return this.ejercicios[this.indice];
    }

    reanudarTiempo() {
      /* Una partida ya registrada (resumenFinal) no suma más tiempo aunque se siga viendo su última explicación. */
      if (this.inicioTramo === null && !this.terminada && !this.resumenFinal) this.inicioTramo = performance.now();
    }

    pausarTiempo() {
      if (this.inicioTramo !== null) {
        this.tiempoAcumulado += performance.now() - this.inicioTramo;
        this.inicioTramo = null;
      }
    }

    tiempo() {
      return this.tiempoAcumulado + (this.inicioTramo !== null ? performance.now() - this.inicioTramo : 0);
    }

    avanzarEtapa() {
      if (this.etapaIndice < this.etapas.length - 1) this.etapaIndice += 1;
      else this.terminada = true;
    }

    avanzarEjercicio() {
      if (this.indice >= this.ejercicios.length - 1) this.avanzarEtapa();
      else this.indice += 1;
    }

    /* Hay algo que continuar: se avanzó, se resolvió algo, se falló, se pidió una pista o se vio el laboratorio. */
    tieneProgreso() {
      return (
        this.etapaIndice + this.indice > 0 ||
        Object.keys(this.etapaHecha).length > 0 ||
        Object.keys(this.estadoEtapa).length > 0 ||
        Object.keys(this.resultados).length > 0 ||
        Object.values(this.estados).some((e) => e.errores || e.pistas)
      );
    }

    /* Errores y pistas de cada ejercicio: sobreviven a salir y volver con «Continuar». */
    estadoDe(id) {
      return this.estados[id] || (this.estados[id] = { errores: 0, pistas: 0 });
    }

    /* Puntuación de un ejercicio (§9): la de un ejercicio nunca baja de 0. */
    puntuar(info) {
      /* Un ejercicio solo puntúa una vez por partida. */
      if (this.resultados[info.id]) return { puntos: this.resultados[info.id].puntos, detalle: '', repetido: true };
      const c = CONFIG.puntos;
      const detalle = [];
      let puntos = 0;
      if (info.correcto && !info.verSolucion) {
        puntos = c.acierto;
        /* En el examen no hay pistas, así que tampoco bonificación por no usarlas. */
        if (!info.pistas && !this.examen) {
          puntos += c.sinPistas;
          detalle.push(`+${c.sinPistas} sin pistas`);
        }
        const costePistas = c.pistas.slice(0, info.pistas).reduce((a, b) => a + b, 0);
        if (costePistas) detalle.push(`−${costePistas} por pistas`);
        if (info.errores) detalle.push(`−${c.error * info.errores} por ${info.errores === 1 ? 'un error' : info.errores + ' errores'}`);
        puntos = Math.max(0, puntos - costePistas - c.error * info.errores);
      }
      this.racha = info.primerIntento ? this.racha + 1 : 0;
      this.rachaMax = Math.max(this.rachaMax, this.racha);
      if (info.primerIntento && this.racha >= CONFIG.racha.desde && puntos > 0) {
        puntos = Math.round(puntos * CONFIG.racha.multiplicador);
        detalle.push(`${multiplicador()} por racha de ${this.racha}`);
      }
      this.puntos += puntos;
      this.pistasUsadas += info.pistas;
      this.resultados[info.id] = Object.assign({}, info, { puntos });
      return { puntos, detalle: detalle.join(' · ') };
    }

    resumen() {
      const total = this.ejercicios.length;
      const lista = this.ejercicios.map((e) => this.resultados[e.id]).filter(Boolean);
      const aciertos = lista.filter((r) => r.primerIntento).length;
      const precision = total ? aciertos / total : 0;
      const criterio = this.mision.criterio;
      /* Un requisito (p. ej. la reconstrucción sin ayuda) solo se cumple si se acierta a la primera. */
      const requeridos = (criterio.requiere || []).filter((id) => this.resultados[id]).map((id) => ({ id, ok: !!this.resultados[id].primerIntento }));
      const falladas = this.ejercicios.filter((e) => !(this.resultados[e.id] && this.resultados[e.id].primerIntento)).map((e) => e.id);
      const acertadas = this.ejercicios.filter((e) => this.resultados[e.id] && this.resultados[e.id].primerIntento).map((e) => e.id);
      /* Resueltas sin ver la solución (aunque sea con errores): sirve para el criterio «todas corregidas». */
      const resueltas = this.ejercicios.filter((e) => this.resultados[e.id] && this.resultados[e.id].correcto && !this.resultados[e.id].verSolucion).map((e) => e.id);
      const solucionesVistas = lista.filter((r) => r.verSolucion).length;
      /* Aciertos a la primera de cada misión (el examen y la práctica mezclan misiones). */
      const porMision = [];
      for (const e of this.ejercicios) {
        let fila = porMision.find((f) => f.mision === e.mision);
        if (!fila) porMision.push((fila = { mision: e.mision, total: 0, aciertos: 0 }));
        fila.total += 1;
        if (this.resultados[e.id] && this.resultados[e.id].primerIntento) fila.aciertos += 1;
      }
      /* Examen: nota sobre 10, con un decimal, de los aciertos a la primera. Un repaso no cambia la nota. */
      const nota = this.examen && this.modo === 'normal' && total ? Math.round((aciertos / total) * 100) / 10 : null;
      return { total, aciertos, precision, requeridos, falladas, acertadas, resueltas, solucionesVistas, porMision, nota, puntos: this.puntos, tiempoMs: this.tiempo(), rachaMax: this.rachaMax };
    }
  }

  /* ═════════════ Aplicación ═════════════ */
  const App = {
    /* La partida en pantalla, y las que están sin terminar en cada misión y en la práctica libre: cambiar de
       una a otra (por ejemplo, del examen a la práctica) no pierde nada mientras la página siga abierta. */
    partida: null,
    partidas: {},
    vista: null,
    todoDesbloqueado: false,

    init() {
      Store.init();
      this.prepararCabecera();
      this.prepararAutoria();
      /* «Saltar al contenido» mueve el foco sin tocar la ruta. */
      document.querySelector('.saltar').addEventListener('click', (e) => {
        e.preventDefault();
        const main = principal();
        const destino = main.querySelector('h1, h2') || main;
        if (!destino.hasAttribute('tabindex') && destino !== main) destino.setAttribute('tabindex', '-1');
        destino.focus();
      });
      if (!Store.disponible) this.mostrarAvisoGuardado();
      else if (Store.guardadoIlegible) this.mostrarAvisoGuardado('El progreso guardado estaba dañado y no se ha podido leer, así que empiezas de cero. A partir de ahora se vuelve a guardar con normalidad.');
      Router.add('/inicio', () => this.pantalla('inicio', () => this.pintarInicio()));
      Router.add('/misiones', () => this.pantalla('misiones', () => this.pintarMisiones()));
      Router.add('/mision/:id', (p) => this.pantalla('misiones', () => this.pintarMision(Number(p.id))));
      Router.add('/repaso/:id', (p) => this.pantalla('misiones', () => this.empezarRepaso(Number(p.id))));
      Router.add('/practica', () => this.pantalla('practica', () => this.pintarPractica()));
      Router.add('/teoria', () => this.pantalla('teoria', () => this.pintarTeoria()));
      Router.add('/teoria/:id', (p) => this.pantalla('teoria', () => this.pintarFicha(p.id)));
      Router.add('/glosario', () => this.pantalla('teoria', () => this.pintarGlosario()));
      Router.add('/perfil', () => this.pantalla('perfil', () => this.pintarPerfil()));
      Router.start('/inicio');
      if (util.debug) DHCP.Validator.mostrar();
    },

    /* ── Utilidades de navegación y misiones ── */
    misiones() {
      return DHCP.data.misiones.slice().sort((a, b) => a.id - b.id);
    },

    mision(id) {
      return DHCP.data.misiones.find((m) => m.id === id) || null;
    },

    siguienteMision(id) {
      const lista = this.misiones();
      const i = lista.findIndex((m) => m.id === id);
      return i >= 0 && i < lista.length - 1 ? lista[i + 1] : null;
    },

    anteriorMision(id) {
      const lista = this.misiones();
      const i = lista.findIndex((m) => m.id === id);
      return i > 0 ? lista[i - 1] : null;
    },

    desbloqueada(id) {
      if (this.todoDesbloqueado || Store.mision(id).completada) return true;
      const anterior = this.anteriorMision(id);
      return !anterior || Store.mision(anterior.id).completada;
    },

    /* Ejercicios del banco que pertenecen a una misión. */
    idsDeMision(id) {
      return DHCP.data.preguntas.filter((p) => p.mision === id).map((p) => p.id);
    },

    /* Los que cuentan para el criterio «todas corregidas»: la máscara del día es Ampliación y cambia cada día, así
       que suma en los aciertos y en las insignias, pero no impide completar la misión. */
    idsDeTodas(id) {
      return DHCP.data.preguntas.filter((p) => p.mision === id && !p.mascaraDelDia).map((p) => p.id);
    },

    proximaMision() {
      const lista = this.misiones();
      return lista.find((m) => this.desbloqueada(m.id) && !Store.mision(m.id).completada) || null;
    },

    tramo(id) {
      return CONFIG.tramos.find((t) => id >= t.misiones[0] && id <= t.misiones[1]);
    },

    desbloquearTodo(valor) {
      this.todoDesbloqueado = !!valor;
      Router.resolver();
    },

    /* Cada cambio de pantalla: limpia la vista anterior y pausa el tiempo de una partida abandonada. */
    pantalla(seccion, pintar) {
      this.limpiarVista();
      Modal.abiertos.slice().forEach((m) => m.cerrar(false));
      document.querySelectorAll('.nav-enlace').forEach((a) => {
        if (a.dataset.seccion === seccion) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      const main = principal();
      util.vaciar(main);
      if (this.partida && !this.partida.terminada) this.partida.pausarTiempo();
      pintar();
      /* El título de la pestaña dice en qué sección se está (lo oyen los lectores de pantalla y se ve en la barra). */
      document.title = seccion === 'inicio' ? TITULO_PAGINA : `${NOMBRES_SECCION[seccion] || seccion} · ${TITULO_PAGINA}`;
      this.actualizarMarcador();
      window.scrollTo(0, 0);
      main.focus({ preventScroll: true });
    },

    limpiarVista() {
      if (this.vista && this.vista.destruir) this.vista.destruir();
      this.vista = null;
    },

    /* Hueco donde se guarda una partida sin terminar: uno por misión (partida normal) y otro para la práctica.
       Los repasos no se guardan: se vuelven a crear desde los resultados o el perfil. */
    huecoDe(p) {
      return p.modo === 'practica' ? 'practica' : p.modo === 'normal' ? 'mision-' + p.mision.id : null;
    },

    /* Pone en pantalla una partida nueva o guardada y pone en marcha su reloj. */
    jugar(p) {
      if (this.partida && this.partida !== p) this.partida.pausarTiempo();
      this.partida = p;
      const hueco = this.huecoDe(p);
      if (hueco) this.partidas[hueco] = p;
      p.reanudarTiempo();
      this.refrescarPartida();
    },

    /* Partida sin terminar y con algo hecho de un hueco, o null. */
    aMedias(hueco) {
      const p = this.partidas[hueco];
      return p && !p.terminada && p.tieneProgreso() ? p : null;
    },

    actualizarMarcador() {
      const el = document.getElementById('marcador-puntos');
      if (el) el.textContent = util.numero(Store.puntuacionTotal());
    },

    prepararCabecera() {
      document.getElementById('btn-sonido').addEventListener('click', () => {
        Store.ajuste('sonido', !Store.ajuste('sonido'));
        this.pintarBotonSonido();
        DHCP.Sonido.acierto();
      });
      this.pintarBotonSonido();
      /* La práctica se juega dentro de #/practica: pulsar su enlace con esa ruta ya puesta no cambia el hash y el
         navegador no avisa, así que se vuelve a resolver la ruta a mano. */
      document.querySelectorAll('.nav-enlace').forEach((a) => {
        a.addEventListener('click', (e) => {
          if (window.location.hash !== a.getAttribute('href')) return;
          e.preventDefault();
          Router.resolver();
        });
      });
    },

    pintarBotonSonido() {
      const btn = document.getElementById('btn-sonido');
      const activo = !!Store.ajuste('sonido');
      btn.setAttribute('aria-pressed', String(activo));
      util.vaciar(btn);
      btn.append(util.icono(activo ? 'i-sonido' : 'i-silencio'), h('span', { class: 'btn-sonido-texto', text: activo ? 'Sonido: sí' : 'Sonido: no' }));
    },

    /* ── Autoría: «by …» en la cabecera, crédito en el pie y comprobación de la firma digital ── */
    prepararAutoria() {
      const a = DHCP.data.autoria;
      /* Si el navegador no ha ejecutado autoria.js o firma.js (en dist, la CSP bloquea un script cuyo texto ya no
         coincide con su hash), no hay autoría que enseñar: se avisa de que la firma no es válida y el juego sigue. */
      if (!a || !DHCP.Firma) {
        document.getElementById('btn-firma').addEventListener('click', () => this.abrirFirma());
        this.firma = { estado: 'invalida', motivo: 'firma' };
        this.pintarFirma();
        return;
      }
      document.querySelector('.marca-autor-nombre').textContent = a.autor;
      document.querySelector('.marca').setAttribute('aria-label', `DHCP Network Lab by ${a.autor}: inicio`);
      document.getElementById('pie-credito').textContent = `DHCP Network Lab · © ${a.anio} ${a.autor}`;
      document.getElementById('btn-firma').addEventListener('click', () => this.abrirFirma());
      this.firma = { estado: 'comprobando' };
      this.pintarFirma();
      DHCP.Firma.comprobar().then((r) => {
        this.firma = r.estado === 'valida' && !this.autoriaComoSeFirmo(r.autor) ? Object.assign({}, r, { estado: 'invalida', motivo: 'autoria' }) : r;
        this.pintarFirma();
        if (this.ventanaFirma) this.ventanaFirma();
      });
    },

    /* El autor que se ve en la cabecera y en el pie tiene que ser el firmado (alguien podría cambiar los datos en
       memoria o el texto de la página sin tocar el código firmado), y el nombre tiene que verse. */
    autoriaComoSeFirmo(autor) {
      const nombre = document.querySelector('.marca-autor-nombre');
      if (!autor || DHCP.data.autoria.autor !== autor || nombre.textContent !== autor || !document.getElementById('pie-credito').textContent.endsWith(' ' + autor)) return false;
      for (let el = nombre; el && el !== document.body; el = el.parentElement) {
        const e = getComputedStyle(el);
        if (e.display === 'none' || e.visibility !== 'visible' || Number(e.opacity) < 0.5) return false;
      }
      return parseFloat(getComputedStyle(nombre).fontSize) >= 8;
    },

    pintarFirma() {
      const e = ESTADOS_FIRMA[this.firma.estado];
      const icono = e.tipo === 'ok' ? 'i-sello' : e.tipo === 'mal' ? 'i-aviso' : 'i-info';
      const sello = document.querySelector('.marca-sello');
      sello.className = 'marca-sello ' + e.tipo;
      util.vaciar(sello);
      if (e.tipo) sello.appendChild(util.icono(icono));
      const btn = document.getElementById('btn-firma');
      btn.className = 'btn-firma ' + e.tipo;
      util.vaciar(btn);
      btn.append(util.icono(icono), h('span', { text: e.boton }));
    },

    /* Ventana con el estado de la firma, la autoría y cómo se comprueba. Si la comprobación termina con la
       ventana abierta, se actualiza sola. */
    abrirFirma() {
      const contenido = h('div', { class: 'firma' });
      const pintar = () => {
        const a = DHCP.data.autoria;
        const f = this.firma;
        const e = ESTADOS_FIRMA[f.estado];
        /* La autoría solo se presenta como cierta cuando la firma es válida. */
        const fiable = f.estado === 'valida';
        util.vaciar(contenido);
        contenido.append(
          h(
            'div',
