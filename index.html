    let vista = null;
    const cerrar = () => {
      if (pendientes.length) est.paquetes.push(...pendientes);
      pendientes = [];
      const f = despues;
      despues = null;
      if (f) f();
    };
    return {
      get ocupado() {
        return !!despues;
      },
      usar(v) {
        vista = v;
      },
      async enviar(paquetes, alTerminar) {
        const mio = ++gen;
        pendientes = paquetes.slice();
        despues = alTerminar;
        for (const p of paquetes) {
          if (!util.movimientoReducido()) await reloj.esperar(240);
          if (mio !== gen) return;
          pendientes.shift();
          est.paquetes.push(p);
          if (vista) vista.anadir([p]);
        }
        if (mio === gen) cerrar();
      },
      detener() {
        gen += 1;
        cerrar();
      }
    };
  }

  /* ═════════════ Misión 9 · Laboratorio de captura ═════════════ */
  Etapas['lab-captura'] = function ({ partida, zona, etapa, terminar }) {
    const e = etapa;
    const est = partida.estadoDeEtapa(() => ({
      semilla: 1 + Math.floor(Math.random() * 2147483000),
      paso: 'escuchar',
      sitio: null,
      capturando: false,
      accion: null,
      paquetes: [],
      elegido: null,
      desdeOffer: false,
      erroresAnalizar: 0,
      respuesta: '',
      mensaje: null,
      hecho: false
    }));
    const esc = DHCP.Captura.escenarioLaboratorio(est.semilla, e);
    const sitio = () => e.sitios.find((s) => s.id === est.sitio) || null;
    const accion = () => e.acciones.find((a) => a.id === est.accion) || null;
    const reloj = new DHCP.Reloj();
    const transmisor = crearTransmisor(est, reloj);
    let vista = null;
    let montado = true;

    const pasos = h('div', { class: 'pasos-lab-zona' });
    const panel = h('section', { class: 'panel panel-paso' });
    const zonaCaptura = h('div', { class: 'zona-captura' });
    const elPie = pie(est.hecho, 'Responde el Lease Time para continuar.', 'Lease Time encontrado. Ya puedes pasar a los ejercicios.', terminar);
    zona.appendChild(
      h(
        'section',
        { class: 'lab lab-captura' },
        h('h1', { class: 'titulo-pantalla', tabindex: '-1', text: 'Laboratorio de captura: encuentra el Lease Time' }),
        h('p', { class: 'nota nota-escenario' }, util.icono('i-info'), rellenar(e.nota, esc)),
        h('p', { class: 'pregunta-lab' }, h('strong', { text: 'Pregunta (diap. 32): ' }), rellenar(e.pregunta, esc)),
        h('p', { class: 'lab-objetivo' }, util.icono('i-pc'), 'Tu equipo: ', h('strong', { text: esc.cliente.nombre }), ' · MAC ', h('span', { class: 'mono objetivo-mac', text: esc.cliente.mac })),
        pasos,
        panel,
        zonaCaptura,
        elPie.el
      )
    );

    /* Si la etapa ya no está en pantalla (se ha salido a mitad de una captura), el mensaje se guarda sin anunciarlo. */
    const nuevoMensaje = (clase, texto, titulo) => {
      est.mensaje = { clase, texto, titulo };
      if (montado) util.anunciar((titulo ? titulo + ' ' : '') + texto);
    };

    /* La captura existe desde que se elige dónde escuchar. */
    function asegurarVista() {
      const s = sitio();
      if (!s) {
        if (vista) vista.destruir();
        vista = null;
        transmisor.usar(null);
        return;
      }
      if (vista) return;
      /* «Usar este paquete» solo está activo con un paquete seleccionado y visible (un filtro puede ocultarlo). */
      const actualizarUsar = () => {
        const boton = panel.querySelector('.btn-usar-paquete');
        if (boton) boton.disabled = transmisor.ocupado || !vista || vista.seleccionado === null;
      };
      vista = new DHCP.Captura.Vista(zonaCaptura, {
        contexto: esc.contexto,
        interfaz: s.iface,
        titulo: `Captura en ${rellenar(s.equipo, esc)} ·`,
        alSeleccionar: actualizarUsar,
        alFiltrar: actualizarUsar
      });
      vista.cargar(est.paquetes);
      transmisor.usar(vista);
    }

    function desde() {
      const ultimo = est.paquetes[est.paquetes.length - 1];
      return ultimo ? { no: ultimo.no, t: Number(ultimo.time) } : { no: 0, t: 0 };
    }

    function elegirSitio(id) {
      est.sitio = id;
      est.paso = 'capturar';
      est.mensaje = null;
      pintar(true);
    }

    function volverAEscuchar() {
      transmisor.detener();
      est.sitio = null;
      est.capturando = false;
      est.accion = null;
      est.paquetes = [];
      est.paso = 'escuchar';
      est.mensaje = null;
      pintar(true);
    }

    function iniciarCaptura() {
      if (transmisor.ocupado) return;
      est.capturando = true;
      const paquetes = DHCP.Captura.flujoLaboratorio(esc, sitio(), null, desde());
      transmisor.enviar(paquetes, () => {
        est.paso = 'generar';
        nuevoMensaje('aviso', 'Llevas un rato capturando y solo llega tráfico de fondo de otros protocolos. No aparece DHCP porque ningún equipo está pidiendo IP: para capturar DHCP, lo primero es generarlo (diap. 30).', 'Ningún paquete DHCP.');
        if (montado) pintar(true);
      });
      /* Se pinta después de empezar a enviar, para que los botones vean que está ocupado. Con movimiento reducido
         el envío ya ha terminado (y repintado) al volver. */
      if (transmisor.ocupado) pintar(false);
    }

    function generar(id) {
      if (transmisor.ocupado) return;
      const a = e.acciones.find((x) => x.id === id);
      const razon = rellenar(a.razon, esc);
      est.accion = id;
      if (a.lento) {
        nuevoMensaje('aviso', razon, 'Funcionaría, pero muy despacio.');
        pintar(false, true);
        return;
      }
      /* Reiniciar el mismo equipo en el que se captura cierra Wireshark: la captura se pierde y hay que volver a
         iniciarla (desde el paso «Escuchar», con el mismo sitio). */
      if (a.cortaCapturaEn && sitio().nodo === a.cortaCapturaEn) {
        est.capturando = false;
        est.paquetes = [];
        est.paso = 'capturar';
        if (vista) vista.cargar([]);
        nuevoMensaje('mal', rellenar(a.razonCorte, esc), 'Te has quedado sin captura.');
        pintar(false, true);
        return;
      }
      const paquetes = DHCP.Captura.flujoLaboratorio(esc, sitio(), id, desde());
      transmisor.enviar(paquetes, () => {
        const s = sitio();
        if (!a.genera) nuevoMensaje('mal', razon, 'Eso no genera DHCP.');
        else if (s.ok) {
          est.paso = 'localizar';
          nuevoMensaje('ok', `${razon} ${rellenar(s.razon, esc)}`, 'Ya tienes el DORA en la captura.');
        } else {
          est.paso = 'fallido';
          nuevoMensaje('mal', `${razon} Pero desde aquí no ves el DORA completo: ${rellenar(s.razon, esc)}`, 'La acción era buena, el sitio no.');
        }
        if (montado) pintar(est.paso !== 'generar', est.paso === 'generar');
      });
      if (transmisor.ocupado) pintar(false);
    }

    function usarPaquete() {
      const p = vista && vista.paquete(vista.seleccionado);
      if (!p) return;
      const d = p.dhcp;
      const propio = esc.cliente;
      let ok = false;
      if (!d) nuevoMensaje('mal', `Ese paquete es ${p.proto}, no DHCP: es tráfico de fondo de otros protocolos.`, 'No es ese.');
      else if (d.tipo === 'RELEASE') nuevoMensaje('mal', 'Es el RELEASE de tu equipo: lo envía el cliente para liberar su IP (diap. 19) y no lleva el Lease Time.', 'No es ese.');
      else if (d.mac !== propio.mac) nuevoMensaje('mal', `Ese ${DHCP.Captura.TIPOS[d.tipo].nombre} es de otro intercambio: su Transaction ID es ${d.xid} y la MAC del cliente ${d.mac}, que no es la de tu equipo. Compara el Transaction ID y la MAC en el detalle.`, 'Es de otro equipo.');
      else if (d.tipo === 'DISCOVER' || d.tipo === 'REQUEST') nuevoMensaje('mal', `Lo envía el cliente (sale de 0.0.0.0). El Lease Time lo da el servidor, así que solo puede ir en el OFFER o en el ACK (diap. 35).`, 'No es ese.');
      else {
        ok = true;
        est.elegido = p.no;
        est.desdeOffer = d.tipo === 'OFFER';
        est.paso = 'analizar';
        if (est.desdeOffer) nuevoMensaje('ok', 'Vale: el OFFER también lleva la opción 51. Aun así, la presentación elige el ACK, cuando el servidor ya da el trato por cerrado y envía los parámetros definitivos (diap. 19 y 35).', 'Paquete del servidor para tu equipo.');
        else nuevoMensaje('ok', `Es el ACK de tu equipo: mismo Transaction ID (${d.xid}) y misma MAC. El servidor da el trato por cerrado y envía los parámetros definitivos (diap. 35).`, 'Bien localizado.');
      }
      if (!ok) vista.marcar(p.no, 'mal');
      pintar(ok, !ok);
    }

    function responder(valor) {
      est.respuesta = valor;
      const seg = DHCP.Captura.leerDuracion(valor);
      const p = vista.paquete(est.elegido);
      if (seg === null) {
        nuevoMensaje('aviso', 'Escribe el valor en segundos o con su unidad (por ejemplo, en horas).');
      } else if (seg === esc.lease) {
        est.paso = 'hecho';
        est.hecho = true;
        elPie.marcar();
        DHCP.Sonido.fin();
        nuevoMensaje('ok', `Option (51) IP Address Lease Time = ${esc.lease} s, es decir, ${DHCP.Captura.duracionEs(esc.lease)}.`, '¡Correcto!');
      } else {
        est.erroresAnalizar += 1;
        DHCP.Sonido.error();
        let texto = seg === p.len ? 'Eso es la longitud del paquete (Length), no el Lease Time.' : 'Ese no es el valor de la opción (51) IP Address Lease Time.';
        texto += ' Despliega «Dynamic Host Configuration Protocol» y, dentro, «Option: (51) IP Address Lease Time».';
        if (est.erroresAnalizar >= 2) texto += ' El valor aparece entre paréntesis, en segundos: (…s).';
        nuevoMensaje('mal', texto, 'Todavía no.');
      }
      /* Si falla, el foco vuelve a la respuesta (con el texto seleccionado) para corregirla; el mensaje se anuncia. */
      pintar(est.paso === 'hecho', false);
      if (est.paso !== 'hecho') {
        const input = panel.querySelector('#lab-lease');
        input.focus();
        input.select();
      }
    }

    /* Mapa de la red con los sitios donde se puede escuchar. */
    function mapaRed() {
      const boton = (s) =>
        h('button', { type: 'button', class: 'btn btn-secundario btn-sitio', 'data-sitio': s.id, 'aria-label': `Escuchar en ${rellenar(s.equipo, esc)}, ${s.tarjeta} (${s.iface})`, onclick: () => elegirSitio(s.id) }, util.icono('i-escuchar'), 'Escuchar aquí');
      const tarjeta = (s) => h('li', { class: 'mapa-tarjeta' }, h('span', { class: 'mapa-tarjeta-texto' }, util.icono('i-tarjeta'), h('span', { class: 'mono', text: s.iface }), h('span', { text: ` · ${s.tarjeta}` }), s.ip ? h('span', { class: 'mono', text: ' · ' + rellenar(s.ip, esc) }) : null), boton(s));
      const sitiosDe = (nodo) => e.sitios.filter((s) => s.nodo === nodo);
      const equipo = (icono, titulo, sub, lista, rol) => h('div', { class: 'mapa-nodo' + (rol ? ' mapa-nodo-' + rol : '') }, h('p', { class: 'mapa-nodo-titulo' }, util.icono(icono), h('strong', { text: titulo })), sub ? h('p', { class: 'mapa-nodo-sub', text: sub }) : null, lista && lista.length ? h('ul', { class: 'mapa-tarjetas' }, lista.map(tarjeta)) : null);
      return h(
        'figure',
        { class: 'mapa-red' },
        h('figcaption', { text: 'Mapa de la red (escenario del juego)' }),
        equipo('i-nube', 'Internet', null),
        h('div', { class: 'mapa-enlace', 'aria-hidden': 'true' }),
        equipo('i-router', 'Router de salida a Internet', 'Une la red con Internet'),
        h('div', { class: 'mapa-enlace', 'aria-hidden': 'true' }),
        equipo('i-servidor', 'Servidor Debian', `Servidor DHCP y puerta de enlace de la Intranet (${esc.contexto.servidor})`, sitiosDe('servidor'), 'servidor'),
        h('div', { class: 'mapa-enlace', 'aria-hidden': 'true' }),
        equipo('i-switch', `Switch de la Intranet (${esc.red}.0/24)`, null),
        h('div', { class: 'mapa-enlace', 'aria-hidden': 'true' }),
        h(
          'div',
          { class: 'mapa-fila' },
          equipo('i-pc', esc.cliente.nombre, 'Tu equipo: el cliente DHCP', sitiosDe('cliente'), 'cliente'),
          equipo('i-pc', rellenar(e.otroPc, esc), 'Otro equipo de la Intranet', sitiosDe('otro')),
          equipo('i-impresora', 'Impresora', 'No se puede instalar Wireshark en ella')
        )
      );
    }

    function contenidoPanel() {
      const s = sitio();
      const titulo = (texto) => h('h2', { class: 'panel-subtitulo', tabindex: '-1', text: texto });
      const fb = mensajeEtapa(est.mensaje);
      const ocupado = transmisor.ocupado;
      switch (est.paso) {
        case 'escuchar':
          return [titulo('Paso 1 · Escuchar'), h('p', { text: '¿Dónde vas a lanzar Wireshark o tshark? Elige el equipo y la tarjeta en el mapa de la red. Puede haber más de un sitio válido (diap. 33).' }), mapaRed(), fb];
        case 'capturar':
          return [
            titulo('Paso 1 · Escuchar'),
            h('p', null, 'Vas a escuchar en ', h('strong', { text: rellenar(s.equipo, esc) }), ', tarjeta ', h('span', { class: 'mono', text: s.iface }), ` (${s.tarjeta}). Inicia la captura y observa qué llega.`),
            h(
              'div',
              { class: 'acciones' },
              h('button', { type: 'button', class: 'btn btn-primario btn-iniciar-captura', disabled: est.capturando, onclick: iniciarCaptura }, util.icono('i-play'), est.capturando ? 'Capturando…' : `Iniciar captura en ${s.iface}`),
              h('button', { type: 'button', class: 'btn btn-fantasma btn-volver-escuchar', disabled: ocupado, onclick: volverAEscuchar }, 'Cambiar de sitio')
            ),
            fb
          ];
        case 'generar':
          return [
            titulo('Paso 2 · Generar tráfico'),
            h('p', null, '¿Cómo consigues que ', h('strong', { text: esc.cliente.nombre }), ' pida una IP? Elige una acción y mira qué aparece en la captura.'),
            h(
              'div',
              { class: 'acciones-lab' },
              e.acciones.map((a) => h('button', { type: 'button', class: 'btn btn-secundario btn-accion', 'data-accion': a.id, disabled: ocupado, onclick: () => generar(a.id) }, h('span', null, util.conCodigo(rellenar(a.texto, esc)))))
            ),
            fb
          ];
        case 'fallido':
          return [titulo('Paso 2 · Generar tráfico'), fb, h('div', { class: 'acciones' }, h('button', { type: 'button', class: 'btn btn-primario btn-volver-escuchar', onclick: volverAEscuchar }, util.icono('i-escuchar'), 'Volver a escuchar en otro sitio'))];
        case 'localizar':
          return [
            titulo('Paso 3 · Localizar'),
            h('p', { text: `Busca el paquete en el que el servidor le da a tu equipo el Lease Time. Filtra la captura (dhcp o bootp), selecciona el paquete y pulsa «Usar este paquete». Comprueba el Transaction ID y la MAC del cliente (${esc.cliente.mac}): puede haber otros equipos pidiendo IP.` }),
            h('div', { class: 'acciones' }, h('button', { type: 'button', class: 'btn btn-primario btn-usar-paquete', disabled: !(vista && vista.seleccionado !== null) || ocupado, onclick: usarPaquete }, util.icono('i-localizar'), 'Usar este paquete')),
            fb
          ];
        case 'analizar': {
          const input = h('input', { id: 'lab-lease', type: 'text', inputmode: 'text', autocomplete: 'off', spellcheck: 'false', 'aria-describedby': 'lab-lease-ayuda', value: est.respuesta || null });
          const form = h(
            'form',
            { class: 'form-respuesta' },
            h('label', { for: 'lab-lease', text: 'Lease Time de la IP concedida' }),
            h('div', { class: 'form-respuesta-fila' }, input, h('button', { type: 'submit', class: 'btn btn-primario btn-responder' }, util.icono('i-check'), 'Responder')),
            h('p', { class: 'campo-ayuda', id: 'lab-lease-ayuda', text: 'Puedes responder en segundos o con su equivalente (por ejemplo, en horas).' })
          );
          form.addEventListener('submit', (ev) => {
            ev.preventDefault();
            responder(input.value);
          });
          return [titulo('Paso 4 · Analizar'), h('p', { text: 'El Lease Time es un concepto DHCP: está en la capa de Aplicación (diap. 37). En el detalle del paquete, despliega «Dynamic Host Configuration Protocol» y busca la opción (51) IP Address Lease Time.' }), form, fb];
        }
        default: {
          const a = accion();
          const p = vista ? vista.paquete(est.elegido) : null;
          return [
            titulo('Respuesta'),
            fb,
            h(
              'ol',
              { class: 'resumen-lab' },
              h('li', null, h('strong', { text: 'Escuchar: ' }), `en ${rellenar(s.equipo, esc)}, tarjeta ${s.iface} (${s.tarjeta}).`),
              h('li', null, h('strong', { text: 'Generar tráfico: ' }), a ? [util.conCodigo(rellenar(a.texto, esc)), '.'] : '—'),
              h('li', null, h('strong', { text: 'Localizar: ' }), p ? `el ${DHCP.Captura.TIPOS[p.dhcp.tipo].nombre} nº ${p.no}, Transaction ID ${p.dhcp.xid}.` : '—'),
              h('li', null, h('strong', { text: 'Analizar: ' }), 'capa DHCP, Option (51) IP Address Lease Time.')
            )
          ];
        }
      }
    }

    function pintar(enfocarTitulo, enfocarMensaje) {
      if (!montado) return;
      util.vaciar(pasos);
      pasos.appendChild(listaPasos(est.paso));
      util.vaciar(panel);
      panel.setAttribute('data-paso', est.paso);
      contenidoPanel().forEach((n) => n && panel.appendChild(n));
      asegurarVista();
      if (vista) {
        vista.estado(est.capturando && ['capturar', 'generar', 'fallido'].includes(est.paso) ? 'capturando' : 'detenida');
        const fijo = ['analizar', 'hecho'].includes(est.paso);
        if (fijo && vista.seleccionado !== est.elegido) vista.seleccionar(est.elegido, false);
        vista.bloquear(fijo);
        /* Resuelto: la captura señala el dato, como la diap. 40. */
        if (est.paso === 'hecho') {
          vista.marcar(est.elegido, 'ok');
          vista.abrir('opcion-51');
          vista.destacar('lease');
        }
      }
      if (enfocarTitulo) {
        const t = panel.querySelector('h2');
        if (t) t.focus({ preventScroll: false });
      } else if (enfocarMensaje) {
        const m = panel.querySelector('.feedback[tabindex]');
        if (m) m.focus({ preventScroll: false });
      }
    }

    pintar(false);
    return {
      destruir() {
        montado = false;
        transmisor.detener();
      },
      relojes: () => [reloj]
    };
  };

  /* ═════════════ Misión 10 · Avería con el terminal ═════════════ */
  Etapas['lab-terminal'] = function ({ partida, zona, etapa, terminar }) {
    const e = etapa;
    const eq = e.equipo;
    const est = partida.estadoDeEtapa(() => ({
      semilla: 1 + Math.floor(Math.random() * 2147483000),
      maquina: null,
      salida: null,
      tareas: { diagnostico: false, activar: false, dora: false },
      sitio: null,
      paquetes: [],
      mensajeSitio: null,
      hecho: false
    }));
    const maquina = new DHCP.Terminal.Maquina(Object.assign({ semilla: est.semilla }, eq), est.maquina);
    const ctx = { servidor: eq.servidor, macServidor: e.macServidor, mascara: '255.255.255.0', router: eq.servidor, dns: eq.servidor };
    const red = eq.servidor.split('.').slice(0, 3).join('.');
    const reloj = new DHCP.Reloj();
    const r = DHCP.Captura.azar(est.semilla + 7);
    let vista = null;
    let animador = null;

    const listaTareas = h('ol', { class: 'tareas-lab' });
    const panelSitio = h('section', { class: 'panel panel-sitio', 'aria-label': 'Dónde capturar' });
    const figura = h('figure', { class: 'mini-escalera' }, h('figcaption', { text: 'Último intercambio DHCP' }), h('div', { class: 'lienzo' }), h('p', { class: 'nota mini-escalera-vacia', text: 'Aquí verás los mensajes DHCP que genere el terminal.' }));
    const zonaTerminal = h('div', { class: 'zona-terminal' });
    const zonaCaptura = h('div', { class: 'zona-captura' });
    const elPie = pie(est.hecho, 'Completa las cuatro tareas para continuar.', 'Avería resuelta y DORA capturado. Ya puedes pasar a los ejercicios.', terminar);
    zona.appendChild(
      h(
        'section',
        { class: 'lab lab-terminal' },
        h('h1', { class: 'titulo-pantalla', tabindex: '-1', text: e.titulo }),
        h('p', { class: 'nota nota-escenario' }, util.icono('i-info'), e.nota),
        h('p', { class: 'aviso incidencia' }, util.icono('i-terminal'), h('span', { text: e.incidencia })),
        listaTareas,
        h('div', { class: 'terminal-grid' }, zonaTerminal, figura),
        panelSitio,
        zonaCaptura,
        elPie.el
      )
    );

    const TAREAS = [
      { id: 'diagnostico', texto: `Diagnostica: mira con ip a cómo está la tarjeta ${eq.iface}.` },
      { id: 'activar', texto: `Repara: consigue que ${eq.iface} tenga IP del servidor DHCP.` },
      { id: 'sitio', texto: 'Para el informe: decide dónde capturar el DORA.' },
      { id: 'dora', texto: 'Captura un DORA completo: provócalo desde el terminal.' }
    ];
    const hecha = (id) => (id === 'sitio' ? !!est.sitio : est.tareas[id]);

    function pintarTareas() {
      util.vaciar(listaTareas);
      TAREAS.forEach((t) => listaTareas.appendChild(h('li', { class: 'tarea-lab ' + (hecha(t.id) ? 'estado-hecho' : 'estado-pendiente'), 'data-tarea': t.id }, util.icono(hecha(t.id) ? 'i-check' : 'i-paso'), h('span', { text: t.texto }), h('span', { class: 'sr-only', text: hecha(t.id) ? ' (hecha)' : ' (pendiente)' }))));
    }

    function comprobarFin() {
      if (est.hecho || !TAREAS.every((t) => hecha(t.id))) return;
      est.hecho = true;
      elPie.marcar();
      DHCP.Sonido.fin();
      util.anunciar('Avería resuelta y DORA capturado. Ya puedes continuar.');
    }

    /* Diagrama del último intercambio: se rehace con cada orden que genera tráfico DHCP. */
    async function animar(ev) {
      if (animador) animador.destruir();
      const lienzo = figura.querySelector('.lienzo');
      figura.querySelector('.mini-escalera-vacia').hidden = true;
      const nombre = { dora: 'DORA completo', renovacion: 'REQUEST y ACK (INIT-REBOOT: ya tenía concesión)', release: 'RELEASE' }[ev.flujo];
      figura.querySelector('figcaption').textContent = 'Último intercambio DHCP: ' + nombre;
      const escenario = {
        nodos: [
          { id: 'cliente', tipo: 'cliente', etiqueta: 'Portátil', ip: ev.flujo === 'dora' ? null : eq.ip, mac: eq.mac },
          { id: 'servidor', tipo: 'servidor', etiqueta: 'Servidor DHCP', ip: eq.servidor }
        ],
        mensajes: ev.mensajes
      };
      const anim = new DHCP.PacketAnimator(lienzo, escenario, { layout: 'escalera', filas: ev.mensajes.length, reloj, titulo: 'Diagrama del último intercambio DHCP', alClicPaquete: (msg) => DHCP.App.abrirFichaMensaje(msg, escenario) });
      animador = anim;
      for (let i = 0; i < ev.mensajes.length; i++) {
        if (animador !== anim) return;
        await anim.send(ev.mensajes[i], { fila: i });
      }
    }

    function capturar(ev) {
      const s = e.sitios.find((x) => x.id === est.sitio);
      const ultimo = est.paquetes[est.paquetes.length - 1];
      let no = ultimo ? ultimo.no : 0;
      let t = ultimo ? Number(ultimo.time) : 0;
      const ruido = () => DHCP.Captura.paqueteDeFondo(r.elegir(DHCP.data.capturas.ruido.intranet), red, 'intranet');
      const lista = [ruido()].concat(ev.dhcp.map((d) => Object.assign(DHCP.Captura.paqueteDhcp(d, ctx), { ambito: 'intranet' })), [ruido()]);
      const nuevos = lista
        .filter((p) => DHCP.Captura.visibleDesde(p, s, { cliente: { ip: eq.ip } }))
        .map((p) => {
          no += 1;
          t += 0.05 + r() * 0.4;
          return Object.assign(p, { no, time: t.toFixed(9) });
        });
      est.paquetes.push(...nuevos);
      if (vista) vista.anadir(nuevos);
    }

    const doraCompleto = () => {
      const porXid = {};
      for (const p of est.paquetes) if (p.dhcp) (porXid[p.dhcp.xid] = porXid[p.dhcp.xid] || new Set()).add(p.dhcp.tipo);
      return Object.values(porXid).some((tipos) => ['DISCOVER', 'OFFER', 'REQUEST', 'ACK'].every((x) => tipos.has(x)));
    };

    const terminal = new DHCP.Terminal.Terminal(zonaTerminal, {
      maquina,
      atajos: e.atajos,
      lineas: est.salida || [{ texto: `# Terminal del ${e.equipoNombre} (simulación). Escribe help para ver las órdenes.`, clase: 'pista' }],
      alEjecutar: (res) => {
        for (const ev of res.eventos) {
          if (ev.tipo === 'ipa') est.tareas.diagnostico = true;
          if (ev.tipo !== 'dhcp') continue;
          animar(ev);
          if (est.sitio) capturar(ev);
          else if (est.tareas.activar && ev.flujo !== 'release') terminal.escribir([{ texto: '# No estás capturando: elige antes dónde escuchar (tarea 3) y vuelve a generar el tráfico.', clase: 'pista' }]);
          if (maquina.concesion && !est.tareas.activar) {
            est.tareas.activar = true;
            util.anunciar(`Avería resuelta: ${eq.iface} tiene la IP ${eq.ip}.`);
          }
          if (est.sitio && doraCompleto()) est.tareas.dora = true;
        }
        est.maquina = maquina.exportar();
        est.salida = terminal.exportarSalida();
        pintarTareas();
        comprobarFin();
      }
    });

    function crearVista() {
      const s = e.sitios.find((x) => x.id === est.sitio);
      vista = new DHCP.Captura.Vista(zonaCaptura, { contexto: ctx, interfaz: s.iface, titulo: `Captura en ${s.equipo} ·`, estado: 'capturando' });
      vista.cargar(est.paquetes);
    }

    function elegirSitio(id) {
      const s = e.sitios.find((x) => x.id === id);
      if (!s.ok) {
        est.mensajeSitio = { clase: 'mal', titulo: 'Ahí no.', texto: s.razon };
      } else {
        est.sitio = id;
        est.mensajeSitio = { clase: 'ok', titulo: 'Bien elegido.', texto: s.razon };
        crearVista();
      }
      util.anunciar(est.mensajeSitio.titulo + ' ' + est.mensajeSitio.texto);
      pintarSitio(true);
      pintarTareas();
      comprobarFin();
    }

    function pintarSitio(enfocar) {
      util.vaciar(panelSitio);
      const s = e.sitios.find((x) => x.id === est.sitio);
      /* util.anadir descarta los null (Element.append los escribiría como texto). */
      util.anadir(panelSitio, [
        h('h2', { class: 'panel-subtitulo', text: 'Tarea 3 · ¿Dónde capturas el DORA?' }),
        s
          ? h('p', null, 'Capturando en ', h('strong', { text: s.equipo }), ', ', h('span', { class: 'mono', text: s.iface }), ` (${s.tarjeta}).`)
          : h('p', { text: 'Elige dónde lanzar Wireshark o tshark para ver el intercambio completo (diap. 33).' }),
        s ? null : h('div', { class: 'acciones-lab' }, e.sitios.map((x) => h('button', { type: 'button', class: 'btn btn-secundario btn-sitio', 'data-sitio': x.id, onclick: () => elegirSitio(x.id) }, util.icono('i-escuchar'), `${x.equipo} · ${x.tarjeta}`))),
        mensajeEtapa(est.mensajeSitio)
      ]);
      if (enfocar) {
        const m = panelSitio.querySelector('.feedback[tabindex]');
        if (m) m.focus({ preventScroll: false });
      }
    }

    pintarTareas();
    pintarSitio(false);
    if (est.sitio) crearVista();
    return {
      destruir() {
        if (animador) animador.destruir();
        animador = null;
      },
      relojes: () => [reloj]
    };
  };

  /* ═════════════ Misión 11 · Línea temporal de una concesión (Ampliación, RFC 2131) ═════════════ */
  /* «8 h», «7 h», «1 h 30 min», «45 min». */
  function duracionCorta(seg) {
    const total = Math.round(seg / 60);
    const horas = Math.floor(total / 60);
    const min = total % 60;
    if (!horas) return `${min} min`;
    return min ? `${horas} h ${min} min` : `${horas} h`;
  }
  const quedan = (seg) => `${seg === 3600 ? 'queda' : 'quedan'} ${duracionCorta(seg)}`;
  /* Momento de la línea temporal: «0 h», «4 h»… */
  const hora = (seg) => (seg ? duracionCorta(seg) : '0 h');
  const porcentajeEs = (x) => `${String(Math.round(x * 1000) / 10).replace('.', ',')}\u00a0%`;

  Etapas['lab-concesion'] = function ({ partida, zona, etapa, terminar }) {
    const e = etapa;
    const lease = e.lease;
    const t1 = Math.round(lease * e.t1);
    const t2 = Math.round(lease * e.t2);
    /* «el portátil» en las frases; «Portátil» como etiqueta de emisor o receptor. */
    const mayus = (t) => t.charAt(0).toUpperCase() + t.slice(1);
    const etiqueta = mayus(e.cliente.replace(/^(el|la) /i, ''));
    const servidor = `servidor ${e.servidor}`;
    const MOMENTOS = [
      {
        id: 'inicio',
        nombre: 'Inicio',
        segundos: 0,
        titulo: 'Inicio: el cliente recibe la IP',
        mensajes: [{ tipo: 'ACK', modo: 'unicast', ruta: `${mayus(servidor)} → ${etiqueta}` }],
        texto: `El servidor confirma la concesión con un ACK (diap. 16) y ${e.cliente} empieza a usar la ${e.ip}. La concesión dura el Lease Time: ${duracionCorta(lease)} en este escenario (diap. 10 y 13).`,
        estado: `Usa la ${e.ip}: ${quedan(lease)}.`
      },
      {
        id: 't1',
        nombre: 'T1',
        segundos: t1,
        titulo: 'T1: renovación (renew)',
        mensajes: [
          { tipo: 'REQUEST', modo: 'unicast', ruta: `${etiqueta} → ${servidor}` },
          { tipo: 'ACK', modo: 'unicast', ruta: `${mayus(servidor)} → ${etiqueta}` }
        ],
        texto: `A mitad de la concesión, ${e.cliente} pide alargarla al servidor que se la dio con un REQUEST en unicast: ya tiene IP y sabe a quién preguntar. Si el servidor contesta con un ACK, la concesión vuelve a empezar con el Lease Time completo.`,
        estado: `Sigue usando la ${e.ip}: ${quedan(lease - t1)}. Si renueva, vuelve a tener ${duracionCorta(lease)}.`
      },
      {
        id: 't2',
        nombre: 'T2',
        segundos: t2,
        titulo: 'T2: revinculación (rebind)',
        mensajes: [{ tipo: 'REQUEST', modo: 'broadcast', ruta: `${etiqueta} → todos` }],
        texto: `Si su servidor no ha contestado (por ejemplo, porque está apagado), al llegar a T2 ${e.cliente} pide la concesión a cualquier servidor DHCP, con un REQUEST en broadcast.`,
        estado: `Sigue usando la ${e.ip}: ${quedan(lease - t2)}.`
      },
      {
        id: 'fin',
        nombre: 'Fin',
        segundos: lease,
        titulo: 'Fin del Lease Time',
        mensajes: [{ tipo: 'DISCOVER', modo: 'broadcast', ruta: `${etiqueta} → todos` }],
        texto: `Si nadie ha contestado, ${e.cliente} deja de usar la IP, que vuelve a quedar libre en el servidor (diap. 10), y empieza de nuevo con un DISCOVER (diap. 16).`,
        estado: `Sin IP: empieza un DORA nuevo.`
      }
    ];
    const est = partida.estadoDeEtapa(() => ({ actual: 0, vistos: { inicio: true }, hecho: false }));

    /* Pista con los tres tramos de la concesión y un cursor que se desplaza con transform. */
    const cursor = h('div', { class: 'concesion-cursor', 'aria-hidden': 'true' }, h('span', { class: 'concesion-marca' }));
    const pista = h(
      'div',
      { class: 'concesion-pista', style: { gridTemplateColumns: `${t1}fr ${t2 - t1}fr ${lease - t2}fr` } },
      h('span', { class: 'concesion-tramo tramo-uso' }),
      h('span', { class: 'concesion-tramo tramo-renovar' }),
      h('span', { class: 'concesion-tramo tramo-revincular' }),
      MOMENTOS.map((m) => h('span', { class: 'concesion-tic tic-' + m.id, style: { left: `${(m.segundos / lease) * 100}%` } }, h('span', { class: 'concesion-tic-texto', text: m.segundos ? m.nombre : '0 h' }))),
      cursor
    );
    const leyenda = h(
      'ul',
      { class: 'concesion-leyenda' },
      h('li', null, h('span', { class: 'muestra tramo-uso' }), `En uso (hasta T1, el ${porcentajeEs(e.t1)} del Lease Time)`),
      h('li', null, h('span', { class: 'muestra tramo-renovar' }), `Renovando con su servidor (hasta T2, el ${porcentajeEs(e.t2)})`),
      h('li', null, h('span', { class: 'muestra tramo-revincular' }), 'Revinculando con cualquier servidor')
    );

    const botones = MOMENTOS.map((m, i) =>
      h(
        'button',
        { type: 'button', class: 'momento-boton', onclick: () => elegir(i, false) },
        h('strong', { class: 'momento-nombre', text: m.nombre }),
        h('span', { class: 'momento-hora', text: hora(m.segundos) }),
        h('span', { class: 'momento-visto' })
      )
    );
    const info = h('div', { class: 'panel concesion-info', role: 'status', 'aria-live': 'polite' });
    const btnSiguiente = h('button', { type: 'button', class: 'btn btn-secundario', onclick: () => elegir(est.actual + 1, true) });
    const elPie = pie(est.hecho, 'Recorre los cuatro momentos de la concesión para continuar.', 'Ya has recorrido la concesión completa. Puedes repasarla o continuar a los ejercicios.', terminar);

    function pintar() {
      const m = MOMENTOS[est.actual];
      cursor.style.transform = `translateX(${(m.segundos / lease) * 100}%)`;
      botones.forEach((b, i) => {
        const visto = !!est.vistos[MOMENTOS[i].id];
        if (i === est.actual) b.setAttribute('aria-current', 'step');
        else b.removeAttribute('aria-current');
        b.classList.toggle('visto', visto);
        b.setAttribute('aria-label', `${MOMENTOS[i].segundos ? `${MOMENTOS[i].nombre}, tras ${duracionCorta(MOMENTOS[i].segundos)} de concesión` : 'Inicio de la concesión'}${visto ? ', visto' : ''}`);
        const marca = b.querySelector('.momento-visto');
        util.vaciar(marca);
        if (visto) marca.appendChild(util.icono('i-check'));
      });
      util.vaciar(info);
      info.append(
        h('h2', { class: 'panel-subtitulo', text: `${m.titulo} · ${hora(m.segundos)}` }),
        h(
          'ul',
          { class: 'concesion-mensajes' },
          m.mensajes.map((x) => {
            const def = DHCP.data.mensajes[x.tipo];
            return h(
              'li',
              null,
              h('span', { class: 'sobre', style: { '--color-msg': def.color } }, util.icono(def.icono), h('strong', { text: def.nombre })),
              h('span', { class: 'etiqueta-modo modo-' + x.modo }, util.icono(x.modo === 'broadcast' ? 'i-broadcast' : 'i-unicast'), x.modo),
              h('span', { class: 'concesion-ruta', text: x.ruta })
            );
          })
        ),
        h('p', { text: m.texto }),
        h('p', { class: 'concesion-estado' }, h('strong', { text: 'Estado de la IP: ' }), m.estado)
      );
      const siguiente = MOMENTOS[est.actual + 1];
      btnSiguiente.hidden = !siguiente;
      util.vaciar(btnSiguiente);
      if (siguiente) btnSiguiente.append(`Siguiente: ${siguiente.nombre}`, util.icono('i-paso'));
    }

    function elegir(i, desdeSiguiente) {
      if (i < 0 || i >= MOMENTOS.length) return;
      est.actual = i;
      est.vistos[MOMENTOS[i].id] = true;
      /* Si el botón «Siguiente» desaparece (último momento), el foco pasa al momento elegido. */
      if (desdeSiguiente && i === MOMENTOS.length - 1) botones[i].focus({ preventScroll: true });
      pintar();
      if (!est.hecho && MOMENTOS.every((x) => est.vistos[x.id])) {
        est.hecho = true;
        elPie.marcar();
        DHCP.Sonido.fin();
        util.anunciar('Has recorrido la concesión completa. Ya puedes continuar a los ejercicios.');
      }
    }

    zona.appendChild(
      h(
        'section',
        { class: 'lab concesion' },
        h('h1', { class: 'titulo-pantalla', tabindex: '-1', text: 'La vida de una concesión' }),
        h('div', { class: 'ejercicio-chips' }, h('span', { class: 'chip chip-ampliacion', text: 'Ampliación' }), h('span', { class: 'chip chip-fuente' }, util.icono('i-libro'), util.textoFuente([10, 13, 16, 18, 41]))),
        h('p', { class: 'nota nota-escenario' }, util.icono('i-info'), e.nota),
        h('p', { class: 'concesion-escenario' }, `${mayus(e.cliente)} recibe la `, h('span', { class: 'mono', text: e.ip }), ' del servidor ', h('span', { class: 'mono', text: e.servidor }), ` con un Lease Time de ${duracionCorta(lease)}. Elige un momento para ver qué hace el cliente.`),
        h('figure', { class: 'concesion-figura' }, h('figcaption', { class: 'sr-only', text: `Línea temporal de una concesión de ${duracionCorta(lease)}: T1 llega tras ${duracionCorta(t1)} y T2 tras ${duracionCorta(t2)}.` }), pista, leyenda),
        h('div', { class: 'momentos', role: 'group', 'aria-label': 'Momentos de la concesión' }, botones),
        info,
        h('div', { class: 'acciones' }, btnSiguiente),
        elPie.el
      )
    );
    pintar();
    return { destruir() {}, relojes: () => [] };
  };

  DHCP.Etapas = Etapas;
  DHCP.EtapasUtil = { ip4, motivoIp, motivoCampo, duracionLarga, duracionCorta };
})();

</script>
  <script data-firma>
/* js/validator.js */
/* DHCP Network Lab — Validador del contenido (se activa con ?debug=1).
   Revisa el banco de ejercicios, las fichas de teoría, las misiones y los escenarios animados, y además
   ejecuta cada escenario en un animador oculto para comprobar el sentido y el modo de cada paquete. */
(function () {
  'use strict';
  const { util } = DHCP;

  const TIPOS_VALIDOS = ['multiple', 'vf', 'relacionar', 'huecos', 'ordenar', 'paso-falta', 'clasificar', 'escenario', 'captura'];
  const NIVELES = ['principiante', 'intermedio', 'experto'];
  const ULTIMA_DIAPOSITIVA = 41;
  const MAX_PROPORCION_MULTIPLE = 0.4;

  /* Expresiones que contradirían la presentación (Anexo A) o convertirían una errata en contenido. */
  const PROHIBIDOS = [
    { re: /TCP[\s-]?30\b/i, motivo: 'errata de la diap. 2 (HTTP usa el puerto 80)' },
    { re: /puerto\s+30\b/i, motivo: 'errata de la diap. 2 (HTTP usa el puerto 80)' },
    { re: /DHCP\s+(usa|utiliza|viaja\s+sobre|funciona\s+sobre)\s+(transporte\s+)?TCP/i, motivo: 'DHCP usa UDP (diap. 1)' },
    { re: /capa\s+de\s+(red|transporte|enlace)\s*,?\s*(como\s+)?DHCP/i, motivo: 'DHCP es de capa de Aplicación (diap. 1)' },
    { re: /\bISC\s+DHCP[^.]*\b(actual|recomendado|mantenido)\b/i, motivo: 'ISC DHCP está discontinuado desde 2022 (diap. 22)' }
  ];
  const EQUIVALENCIAS = /\b(DISCOVERY|ACKNOWLEDGE)\b/;

  /* Cálculos de red hechos por otro camino que js/mascaras.js (con cadenas de bits), para comprobar las redes y las
     máscaras del día sin fiarse de las mismas funciones que las generan. */
  const bitsDe = (ip) => ip.split('.').map((o) => Number(o).toString(2).padStart(8, '0')).join('');
  const deBits = (b) => b.match(/.{8}/g).map((o) => parseInt(o, 2)).join('.');
  const redBits = (ip, p) => deBits(bitsDe(ip).slice(0, p) + '0'.repeat(32 - p));
  const broadcastBits = (ip, p) => deBits(bitsDe(ip).slice(0, p) + '1'.repeat(32 - p));
  const mascaraBits = (p) => deBits('1'.repeat(p) + '0'.repeat(32 - p));
  const esIp = (ip) => /^\d{1,3}(\.\d{1,3}){3}$/.test(ip) && ip.split('.').every((o) => Number(o) <= 255);
  /* ¿Es un equipo (ni la dirección de red ni la de broadcast) de la red red/p? */
  const equipoDeLaRed = (ip, red, p) => esIp(ip) && redBits(ip, p) === red && ip !== red && ip !== broadcastBits(red, p);
  const PREFIJOS_POR_NIVEL = { principiante: [8, 16, 24], intermedio: [22, 23, 25, 26, 27], experto: [19, 20, 21, 28, 29, 30] };
  const NIVEL_MASCARA_DEL_DIA = { 'M2-MD': 'principiante', 'M5-MD': 'intermedio', 'M8-MD': 'intermedio', 'M10-MD': 'experto', 'M11-MD': 'experto' };

  function palabras(texto) {
    return String(texto)
      .toLowerCase()
      .replace(/[¿?¡!.,;:«»"()]/g, ' ')
      .split(/\s+/)
      .filter(Boolean);
  }

  /* Distancia de edición entre dos listas de palabras. */
  function distanciaPalabras(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
    }
    return d[a.length][b.length];
  }

  function textosDe(obj) {
    const out = [];
    (function rec(v) {
      if (typeof v === 'string') out.push(v);
      else if (Array.isArray(v)) v.forEach(rec);
      else if (v && typeof v === 'object') Object.values(v).forEach(rec);
    })(obj);
    return out;
  }

  const Validator = {
    resultado: null,

    run() {
      const errores = [];
      const avisos = [];
      const err = (donde, texto) => errores.push({ donde, texto });
      const aviso = (donde, texto) => avisos.push({ donde, texto });
      const D = DHCP.data;
      const preguntas = D.preguntas || [];
      const teoria = D.teoria || [];
      const misiones = D.misiones || [];
      const idsTeoria = new Set(teoria.map((t) => t.id));
      const tiposImplementados = Object.keys(DHCP.Ejercicios.Tipos);

      const comprobarFuente = (donde, fuente) => {
        if (!Array.isArray(fuente) || !fuente.length) return err(donde, 'falta «fuente» (diapositivas de origen)');
        for (const f of fuente) if (!Number.isInteger(f) || f < 1 || f > ULTIMA_DIAPOSITIVA) err(donde, `diapositiva fuera de rango en «fuente»: ${f}`);
      };
      const comprobarPorQueNo = (donde, ej, correctas) => {
        ej.opciones.forEach((_, i) => {
          if (correctas.includes(i)) return;
          if (!ej.porQueNo || !ej.porQueNo[i]) err(donde, `falta «porQueNo» para el distractor ${i} («${ej.opciones[i]}»)`);
        });
        for (const k of Object.keys(ej.porQueNo || {})) {
          const n = Number(k);
          if (!(n >= 0 && n < ej.opciones.length)) err(donde, `«porQueNo» tiene una clave inexistente: ${k}`);
          if (correctas.includes(n)) err(donde, `«porQueNo» explica la opción correcta ${k}`);
        }
      };

      /* ── Ejercicios ── */
      const ids = new Set();
      preguntas.forEach((ej, n) => {
        const donde = ej.id || `pregunta #${n}`;
        if (!ej.id) err(donde, 'falta «id»');
        else if (ids.has(ej.id)) err(donde, 'id duplicado');
        ids.add(ej.id);
        if (!misiones.some((m) => m.id === ej.mision)) err(donde, `la misión ${ej.mision} no existe`);
        if (!NIVELES.includes(ej.nivel)) err(donde, `nivel no válido: ${ej.nivel}`);
        if (!TIPOS_VALIDOS.includes(ej.tipo)) err(donde, `tipo no válido: ${ej.tipo}`);
        else if (!tiposImplementados.includes(ej.tipo)) err(donde, `el tipo «${ej.tipo}» aún no tiene manejador en ExerciseRenderer`);
        for (const campo of ['intro', 'enunciado', 'explicacion']) if (!ej[campo] || !String(ej[campo]).trim()) err(donde, `falta «${campo}»`);
        if (!Array.isArray(ej.pistas) || ej.pistas.length !== 2 || ej.pistas.some((p) => !p || !p.trim())) err(donde, 'debe tener exactamente dos pistas');
        if (!ej.repasar) err(donde, 'falta «repasar»');
        else if (!idsTeoria.has(ej.repasar)) err(donde, `la ficha «${ej.repasar}» no existe`);
        comprobarFuente(donde, ej.fuente);
        if (typeof ej.ampliacion !== 'boolean') err(donde, '«ampliacion» debe ser true o false');

        switch (ej.tipo) {
          case 'multiple':
          case 'vf':
          case 'paso-falta': {
            if (!Array.isArray(ej.opciones) || ej.opciones.length < 2) {
              err(donde, 'necesita al menos dos opciones');
              break;
            }
            if (new Set(ej.opciones).size !== ej.opciones.length) err(donde, 'hay opciones repetidas');
            const correctas = Array.isArray(ej.correcta) ? ej.correcta : [ej.correcta];
            if (Array.isArray(ej.correcta) && !/vari[ao]s|más de una|todas las que/i.test(ej.enunciado)) err(donde, '«correcta» es una lista pero el enunciado no dice que haya varias respuestas');
            for (const c of correctas) if (!Number.isInteger(c) || c < 0 || c >= ej.opciones.length) err(donde, `«correcta» (${c}) no existe en «opciones»`);
            comprobarPorQueNo(donde, ej, correctas);
            if (ej.tipo === 'vf' && (ej.opciones.length !== 2 || ej.opciones[0] !== 'Verdadero' || ej.opciones[1] !== 'Falso')) err(donde, 'un V/F debe tener las opciones ["Verdadero", "Falso"]');
            if (ej.tipo === 'paso-falta') this._pasoFalta(ej, donde, err);
            break;
          }
          case 'ordenar': {
            const n = (ej.opciones || []).length;
            if (n < 3) err(donde, 'ordenar necesita al menos tres elementos');
            const c = ej.correcta || [];
            if (c.length !== n || new Set(c).size !== n || c.some((x) => !Number.isInteger(x) || x < 0 || x >= n)) err(donde, '«correcta» debe ser una permutación de los índices de «opciones»');
            if (!Array.isArray(ej.razones) || ej.razones.length !== n || ej.razones.some((r) => !r)) err(donde, 'cada elemento necesita su razón («razones»)');
            (ej.atributos || []).forEach((a) => {
              if (!a.id || !a.nombre || !Array.isArray(a.valores) || a.valores.length < 2) err(donde, `atributo mal definido: ${a.id}`);
              if (!Array.isArray(a.correctas) || a.correctas.length !== n || a.correctas.some((x) => !(x >= 0 && x < a.valores.length))) err(donde, `«correctas» del atributo ${a.id} no es válido`);
              if (!Array.isArray(a.razones) || a.razones.length !== n || a.razones.some((r) => !r)) err(donde, `faltan razones del atributo ${a.id}`);
            });
            break;
          }
          case 'relacionar': {
            const pares = ej.pares || [];
            if (pares.length < 3) err(donde, 'relacionar necesita al menos tres pares');
            const der = pares.map((p) => p.der).concat((ej.extras || []).map((x) => x.texto));
            if (new Set(der).size !== der.length) err(donde, 'hay descripciones repetidas');
            if (new Set(pares.map((p) => p.izq)).size !== pares.length) err(donde, 'hay elementos repetidos en la columna izquierda');
            (ej.extras || []).forEach((x) => !x.porQueNo && err(donde, `el sobrante «${x.texto}» necesita «porQueNo»`));
            pares.forEach((p) => !p.razon && err(donde, `el par «${p.izq}» necesita «razon» (el razonamiento que se muestra si se falla)`));
            break;
          }
          case 'huecos': {
            const marcas = (ej.texto || '').match(/\{\{(\d+)\}\}/g) || [];
            const indices = marcas.map((m) => Number(m.replace(/\D/g, ''))).sort((a, b) => a - b);
            const huecos = ej.huecos || [];
            if (!huecos.length) err(donde, 'faltan «huecos»');
            if (indices.length !== huecos.length || indices.some((v, i) => v !== i)) err(donde, 'los marcadores {{n}} del texto no coinciden con «huecos»');
            if (!Array.isArray(ej.razonesHuecos) || ej.razonesHuecos.length !== huecos.length || ej.razonesHuecos.some((r) => !r)) err(donde, 'cada hueco necesita su razonamiento («razonesHuecos»)');
            (ej.distractores || []).forEach((d) => {
              if (!d.porQueNo) err(donde, `el distractor «${d.texto}» necesita «porQueNo»`);
              if (huecos.includes(d.texto)) err(donde, `el distractor «${d.texto}» también es una respuesta correcta`);
            });
            if (ej.estiloTexto !== undefined && ej.estiloTexto !== 'consola') err(donde, `estilo de texto no válido: ${ej.estiloTexto}`);
            break;
          }
          case 'clasificar': {
            const cats = new Set((ej.categorias || []).map((c) => c.id));
            if (cats.size < 2) err(donde, 'clasificar necesita al menos dos categorías');
            (ej.elementos || []).forEach((e) => {
              if (!cats.has(e.categoria)) err(donde, `el elemento «${e.texto}» apunta a una categoría inexistente`);
              if (!e.explicacion) err(donde, `el elemento «${e.texto}» necesita «explicacion»`);
            });
            for (const c of cats) if (!(ej.elementos || []).some((e) => e.categoria === c)) aviso(donde, `la categoría «${c}» no tiene ningún elemento`);
            break;
          }
          case 'escenario': {
            const s = ej.situacion || {};
            if (!s.titulo || !s.texto) err(donde, 'la situación necesita «titulo» y «texto»');
            (s.datos || []).forEach((d) => (!d.etiqueta || !d.valor) && err(donde, 'cada dato de la situación necesita «etiqueta» y «valor»'));
            if (s.rango) this._rango(s.rango, donde, err);
            if (s.consola !== undefined && (typeof s.consola !== 'string' || !s.consola.trim())) err(donde, '«consola» debe ser el texto de la salida del terminal');
            if (s.diagrama && (typeof s.diagrama.hueco !== 'number' || s.diagrama.mostrar !== 'al-acertar')) err(donde, 'el diagrama de la situación necesita «hueco» y «mostrar: al-acertar»');
            const qs = ej.preguntas || [];
            if (qs.length < 2) err(donde, 'un escenario necesita al menos dos preguntas');
            qs.forEach((q, qi) => {
              const dq = `${donde} · pregunta ${qi + 1}`;
              if (!q.enunciado) err(dq, 'falta «enunciado»');
              if (!Array.isArray(q.opciones) || q.opciones.length < 2) return err(dq, 'necesita al menos dos opciones');
              if (new Set(q.opciones).size !== q.opciones.length) err(dq, 'hay opciones repetidas');
              if (!Number.isInteger(q.correcta) || q.correcta < 0 || q.correcta >= q.opciones.length) err(dq, `«correcta» (${q.correcta}) no existe en «opciones»`);
              comprobarPorQueNo(dq, q, [q.correcta]);
            });
            break;
          }
          case 'captura':
            this._captura(ej, donde, err, aviso);
            break;
          default:
            break;
        }
      });

      /* ── Capturas simuladas ── */
      this._capturas(err, comprobarFuente);

      /* ── Máscaras del día ── */
      this._mascaras(err);

      /* Dos enunciados no pueden diferir solo en una palabra. */
      for (let i = 0; i < preguntas.length; i++) {
        for (let j = i + 1; j < preguntas.length; j++) {
          const a = palabras(preguntas[i].enunciado);
          const b = palabras(preguntas[j].enunciado);
          if (distanciaPalabras(a, b) <= 1) err(`${preguntas[i].id} / ${preguntas[j].id}`, 'los enunciados difieren como mucho en una palabra');
        }
      }

      /* Como máximo un 40 % de opción múltiple. */
      const nMultiple = preguntas.filter((p) => p.tipo === 'multiple').length;
      if (preguntas.length && nMultiple / preguntas.length > MAX_PROPORCION_MULTIPLE) err('banco', `demasiada opción múltiple: ${nMultiple} de ${preguntas.length}`);

      /* ── Fichas de teoría ── */
      const idsVistos = new Set();
      teoria.forEach((t) => {
        const donde = t.id || 'ficha sin id';
        if (idsVistos.has(t.id)) err(donde, 'id de ficha duplicado');
        idsVistos.add(t.id);
        if (!t.titulo || !t.contenido) err(donde, 'la ficha necesita título y contenido');
        comprobarFuente(donde, t.fuente);
        if (typeof t.ampliacion !== 'boolean') err(donde, '«ampliacion» debe ser true o false');
      });
      /* Entre todas las fichas deben cubrir las diapositivas 1 a 41. */
      const cubiertas = new Set(teoria.flatMap((t) => t.fuente || []));
      const sinFicha = [];
      for (let d = 1; d <= ULTIMA_DIAPOSITIVA; d++) if (!cubiertas.has(d)) sinFicha.push(d);
      if (sinFicha.length) err('teoría', 'diapositivas sin ninguna ficha de teoría: ' + sinFicha.join(', '));

      /* ── Glosario ── */
      const glosario = D.glosario || [];
      const terminos = new Set();
      glosario.forEach((g, i) => {
        const donde = 'glosario · ' + (g.termino || '#' + i);
        if (!g.termino || !g.definicion) err(donde, 'cada término necesita «termino» y «definicion»');
        if (terminos.has(g.termino)) err(donde, 'término repetido');
        terminos.add(g.termino);
        if (!idsTeoria.has(g.ficha)) err(donde, `la ficha «${g.ficha}» no existe`);
        comprobarFuente(donde, g.fuente);
      });
      const conEquivalencias = glosario.filter((g) => g.equivalencias);
      if (conEquivalencias.length !== 1) err('glosario', `la equivalencia DISCOVERY/ACKNOWLEDGE debe citarse exactamente una vez (hay ${conEquivalencias.length})`);

      /* ── Misiones ── */
      const ordenadas = misiones.slice().sort((a, b) => a.id - b.id);
      if (misiones.filter((m) => m.examen).length > 1) err('misiones', 'solo puede haber una misión de examen final');
      ordenadas.forEach((m, k) => {
        const donde = 'Misión ' + m.id;
        const propias = preguntas.filter((p) => p.mision === m.id);
        if (m.examen) this._examen(m, donde, propias, k === ordenadas.length - 1, err);
        else if (!propias.length) err(donde, 'no tiene ejercicios');
        if (m.minimoEjercicios && propias.length < m.minimoEjercicios) err(donde, `tiene ${propias.length} ejercicios y necesita al menos ${m.minimoEjercicios}`);
        if (!m.criterio || typeof m.criterio.precisionMinima !== 'number' || !m.criterio.texto) err(donde, 'falta el criterio de completado');
        else {
          const pm = m.criterio.precisionMinima;
          /* Fracción entre 0 y 1, y como mínimo el 60 % que exige la regla de desbloqueo (§6). El examen final
             se completa al registrar la nota (puede ser 0): es la última misión y no desbloquea ninguna. */
          if (m.examen ? !(pm >= 0 && pm <= 1) : !(pm > 0 && pm <= 1)) err(donde, `«precisionMinima» debe ser una fracción entre 0 y 1 (es ${pm})`);
          else if (!m.examen && pm < DHCP.CONFIG.desbloqueo) err(donde, `«precisionMinima» (${pm}) es menor que la regla de desbloqueo (${DHCP.CONFIG.desbloqueo})`);
          (m.criterio.requiere || []).forEach((id) => !propias.some((p) => p.id === id) && err(donde, `el criterio requiere ${id}, que no pertenece a la misión`));
        }
        for (const campo of ['titulo', 'objetivo', 'cierre']) if (!m[campo]) err(donde, `falta «${campo}»`);
        if (!Array.isArray(m.instrucciones) || !m.instrucciones.length) err(donde, 'faltan instrucciones');
        comprobarFuente(donde, m.fuente);
        (m.etapas || []).forEach((e) => this._etapa(e, donde, err, aviso));
        if (!Number.isInteger(m.id) || ordenadas.filter((x) => x.id === m.id).length > 1) err(donde, 'el id de la misión debe ser un entero único');
        if (k > 0 && !m.etapas.some((e) => e.tipo === 'ejercicios')) err(donde, 'no tiene etapa de ejercicios: no se podría completar ni desbloquear la siguiente');
      });

      /* ── Insignias ── */
      this._insignias(D.insignias, misiones, preguntas, err);

      /* ── Mensajes y escenarios animados ── */
      const tipos = Object.keys(D.mensajes || {});
      if (tipos.length !== 8) err('mensajes', `deben definirse los 8 mensajes de la diap. 19 (hay ${tipos.length})`);
      const colores = new Set();
      const iconos = new Set();
      for (const t of tipos) {
        const def = D.mensajes[t];
        if (colores.has(def.color)) err('mensaje ' + t, 'color repetido');
        if (iconos.has(def.icono)) err('mensaje ' + t, 'icono repetido');
        colores.add(def.color);
        iconos.add(def.icono);
        if (!document.getElementById(def.icono)) err('mensaje ' + t, `el icono #${def.icono} no existe en el sprite`);
        comprobarFuente('mensaje ' + t, def.fuente);
      }
      const escenarios = [];
      for (const [id, e] of Object.entries(D.escenarios || {})) escenarios.push({ donde: 'escenario ' + id, e, layout: 'topologia' });
      preguntas.forEach((p) => p.escenario && escenarios.push({ donde: p.id, e: p.escenario, layout: 'escalera' }));
      preguntas.forEach((p) => p.situacion && p.situacion.diagrama && escenarios.push({ donde: p.id + ' · diagrama', e: p.situacion.diagrama, layout: 'escalera' }));
      for (const { donde, e, layout } of escenarios) {
        /* La forma del escenario se revisa antes de animarlo: un dato mal formado se informa, no rompe el validador. */
        if (!Array.isArray(e.nodos) || !Array.isArray(e.mensajes) || !e.mensajes.length) {
          err(donde, 'el escenario necesita «nodos» y «mensajes»');
          continue;
        }
        const sinPosicion = layout === 'topologia' ? e.nodos.filter((n) => !n.pos || typeof n.pos.x !== 'number' || typeof n.pos.y !== 'number') : [];
        if (sinPosicion.length) {
          err(donde, 'nodos sin posición «pos: {x, y}»: ' + sinPosicion.map((n) => n.id).join(', '));
          continue;
        }
        e.mensajes.forEach((m, i) => this.comprobarMensaje(m, e).forEach((t) => err(`${donde} · mensaje ${i + 1}`, t)));
        if (typeof e.hueco === 'number' && !e.mensajes[e.hueco]) err(donde, 'el hueco no apunta a ningún mensaje');
        this._pendientes = this._pendientes || [];
        this._pendientes.push(this._ejecutarEscenario(e, layout).then((fallos) => fallos.forEach((t) => err(donde, t))));
      }

      /* ── Textos que contradicen la presentación ── */
      const fuentesTexto = [
        ...preguntas.map((p) => ({ donde: p.id, textos: textosDe(p) })),
        ...teoria.map((t) => ({ donde: t.id, textos: textosDe(t) })),
        ...(D.glosario || []).map((g) => ({ donde: 'glosario · ' + g.termino, textos: textosDe(g), equivalencias: g.equivalencias })),
        ...misiones.map((m) => ({ donde: 'Misión ' + m.id, textos: textosDe(m) })),
        ...tipos.map((t) => ({ donde: 'mensaje ' + t, textos: textosDe(D.mensajes[t]) })),
        ...Object.keys(D.escenarios || {}).map((k) => ({ donde: 'escenario ' + k, textos: textosDe(D.escenarios[k]) })),
        ...Object.keys(D.capturas || {}).map((k) => ({ donde: 'captura ' + k, textos: textosDe(D.capturas[k]) })),
        ...(D.insignias || []).map((i) => ({ donde: 'insignia ' + i.id, textos: textosDe(i) }))
      ];
      for (const f of fuentesTexto) {
        for (const texto of f.textos) {
          for (const p of PROHIBIDOS) if (p.re.test(texto)) err(f.donde, `texto a revisar (${p.motivo}): «${texto.slice(0, 80)}…»`);
          if (!f.equivalencias && EQUIVALENCIAS.test(texto)) err(f.donde, 'usa DISCOVERY/ACKNOWLEDGE fuera de su entrada del glosario; usa DISCOVER/ACK');
        }
      }

      const resumen = {
        ejercicios: preguntas.length,
        porTipo: preguntas.reduce((acc, p) => ((acc[p.tipo] = (acc[p.tipo] || 0) + 1), acc), {}),
        porMision: preguntas.reduce((acc, p) => ((acc[p.mision] = (acc[p.mision] || 0) + 1), acc), {}),
        fichas: teoria.length,
        glosario: (D.glosario || []).length,
        misiones: misiones.length,
        escenarios: escenarios.length,
        insignias: (D.insignias || []).length
      };
      this.resultado = { errores, avisos, resumen };
      return this.resultado;
    },

    /* Comprueba un mensaje de un escenario contra la tabla de §7.1 (emisor, modo, receptor y puertos). */
    comprobarMensaje(m, escenario) {
      const fallos = [];
      const def = DHCP.data.mensajes[m.tipo];
      if (!def) return [`tipo de mensaje desconocido: ${m.tipo}`];
      const nodo = (id) => escenario.nodos.find((n) => n.id === id);
      const rol = (n) => (n ? (n.tipo === 'servidor' ? 'servidor' : n.tipo === 'cliente' ? 'cliente' : 'otro') : null);
      const de = nodo(m.de);
      if (!de) fallos.push(`emisor inexistente: ${m.de}`);
      else if (rol(de) !== def.emisor) fallos.push(`${m.tipo} debe enviarlo un ${def.emisor}, no «${de.etiqueta}»`);
      if (m.modo !== def.modo) fallos.push(`${m.tipo} va en ${def.modo}, no en ${m.modo}`);
      if (m.modo === 'broadcast') {
        if (m.a !== '*') fallos.push(`${m.tipo} es broadcast: el destino debe ser «*» (todos)`);
        if (m.ipDestino && m.ipDestino !== '255.255.255.255') fallos.push(`${m.tipo} broadcast debe ir a 255.255.255.255`);
        /* Un broadcast del servidor (NACK) va dirigido a un cliente concreto, aunque lo reciban todos. */
        if (def.emisor === 'servidor' && rol(nodo(m.para)) !== 'cliente') fallos.push(`${m.tipo} es un broadcast del servidor: necesita «para» con el cliente al que va dirigido`);
      } else {
        const a = nodo(m.a);
        if (!a) fallos.push(`receptor inexistente: ${m.a}`);
        else if (rol(a) !== def.receptor) fallos.push(`${m.tipo} debe recibirlo un ${def.receptor}, no «${a.etiqueta}»`);
        if (m.ipDestino === '255.255.255.255') fallos.push(`${m.tipo} es unicast y no puede ir a 255.255.255.255`);
      }
      if ((m.tipo === 'DISCOVER' || m.tipo === 'REQUEST') && m.ipOrigen && m.ipOrigen !== '0.0.0.0') fallos.push(`${m.tipo} sale de 0.0.0.0 en la captura de referencia (diap. 36)`);
      const puertoDe = (r) => (r === 'servidor' ? 67 : 68);
      if (m.puertoOrigen && de && m.puertoOrigen !== puertoDe(rol(de))) fallos.push(`puerto de origen incorrecto (${m.puertoOrigen}); el ${rol(de)} usa el ${puertoDe(rol(de))}`);
      if (m.puertoDestino) {
        const esperado = def.receptor === 'todos' ? 67 : puertoDe(def.receptor);
        if (m.puertoDestino !== esperado) fallos.push(`puerto de destino incorrecto (${m.puertoDestino}); debería ser ${esperado}`);
      }
      return fallos;
    },

    /* Etapas de una misión: tipo conocido y datos completos y coherentes. */
    _etapa(e, donde, err, aviso) {
      const dd = `${donde} · etapa ${e.tipo}`;
      const tiposEtapa = ['ejercicios', 'lab-dora', 'sim-manual', 'lab-nic', 'lab-rango', 'lab-captura', 'lab-terminal', 'lab-concesion'];
      if (!tiposEtapa.includes(e.tipo)) return err(donde, `etapa desconocida: ${e.tipo}`);
      if (e.tipo === 'ejercicios') return;
      if (!e.nombre) err(dd, 'falta «nombre» (se muestra en el marcador)');
      if (e.tipo !== 'lab-dora' && !DHCP.Etapas[e.tipo]) err(dd, 'no hay manejador para esta etapa');
      if (e.tipo === 'lab-dora') this._labDora(e, dd, err);
      if (e.tipo === 'lab-concesion') this._labConcesion(e, dd, err);
      const ip4 = DHCP.EtapasUtil.ip4;
      if (e.tipo === 'sim-manual' || e.tipo === 'lab-nic') {
        for (const c of ['red', 'prefijo', 'mascara', 'puertaEnlace', 'dns', 'nota']) if (!e[c]) err(dd, `falta «${c}»`);
        if (e.red && e.prefijo) {
          if (!esIp(e.red) || redBits(e.red, e.prefijo) !== e.red) err(dd, `«red» (${e.red}) no es una dirección de red /${e.prefijo}`);
          if (e.mascara !== mascaraBits(e.prefijo)) err(dd, `la máscara ${e.mascara} no corresponde a /${e.prefijo}`);
          for (const c of ['puertaEnlace', 'dns']) if (e[c] && (!ip4(e[c]) || !equipoDeLaRed(e[c], e.red, e.prefijo))) err(dd, `«${c}» no es una IP de la red ${e.red}/${e.prefijo}`);
        }
        if (!(e.ocupadas || []).some((o) => o.ip === e.puertaEnlace) || !(e.ocupadas || []).some((o) => o.ip === e.dns)) err(dd, 'la puerta de enlace y el DNS deben figurar entre las IP ocupadas');
      }
      if (e.tipo === 'sim-manual') {
        if (!(e.equipos || []).length) err(dd, 'faltan los equipos que se configuran a mano');
        if (!(e.cola || []).length) err(dd, 'falta la cola de equipos que crece');
        (e.cola || []).forEach((n, i) => {
          if (!(n.cantidad > 0) || !n.titulo || !n.texto) err(dd, `el nivel ${i + 1} de la cola necesita «cantidad», «titulo» y «texto»`);
          if (i && n.cantidad <= e.cola[i - 1].cantidad) err(dd, 'la cola tiene que crecer en cada nivel');
        });
      }
      if (e.tipo === 'lab-nic') {
        if (!e.equipo || !e.mac) err(dd, 'faltan «equipo» y «mac»');
        const d = e.destinos || {};
        const local = d.local || {};
        const remota = d.remota || {};
        if (!local.nombre || !ip4(local.ip) || !equipoDeLaRed(local.ip, e.red, e.prefijo) || !(e.ocupadas || []).some((o) => o.ip === local.ip)) err(dd, `el destino «local» debe ser un equipo ocupado de la red ${e.red}/${e.prefijo}`);
        if (!remota.nombre || !ip4(remota.ip) || redBits(remota.ip, e.prefijo) === e.red) err(dd, 'el destino «remota» debe ser una IP de otra red');
        if (!d.web) err(dd, 'falta el nombre que se abre en la prueba de DNS («destinos.web»)');
      }
      if (e.tipo === 'lab-rango') {
        const tiposId = new Set((e.tipos || []).map((t) => t.id));
        if ((e.bloques || []).length !== tiposId.size) err(dd, 'debe haber un bloque por cada tipo');
        (e.bloques || []).forEach((b, i) => {
          if (!tiposId.has(b.tipo)) err(dd, `el bloque ${b.id} apunta a un tipo inexistente`);
          if (i && b.desde !== e.bloques[i - 1].hasta + 1) err(dd, 'los bloques deben ser consecutivos y no solaparse');
        });
        (e.tipos || []).forEach((t) => (!t.nombre || !t.uso || !t.razon) && err(dd, `el tipo «${t.id}» necesita «nombre», «uso» y «razon»`));
        (e.equipos || []).forEach((q) => (!tiposId.has(q.zona) || !q.razon) && err(dd, `el equipo «${q.id}» necesita una «zona» válida y «razon»`));
      }
      if (e.tipo === 'lab-captura') this._labCaptura(e, dd, err);
      if (e.tipo === 'lab-terminal') this._labTerminal(e, dd, err, aviso);
    },

    /* Máscaras del día (js/mascaras.js): 400 días seguidos. Cada día, la red de los laboratorios 1 y 2 es de
       Principiante (y distinta en cada uno) y cada ejercicio usa un prefijo de su nivel, con la respuesta y los
       distractores calculados de nuevo por otro camino. El prefijo de cada elemento no se repite dos días seguidos y
       el mismo día sale lo mismo. */
    _mascaras(err) {
      const M = DHCP.Mascaras;
      if (!M) return err('máscaras del día', 'falta js/mascaras.js');
      const avisados = new Set();
      const fallo = (donde, texto) => {
        if (avisados.has(texto) || avisados.size >= 12) return;
        avisados.add(texto);
        err('máscaras del día · ' + donde, texto);
      };
      const anterior = {};
      const usados = {};
      const contar = (clave, p, dia) => {
        if (anterior[clave] === p) fallo(`${dia} · ${clave}`, `el prefijo /${p} se repite dos días seguidos`);
        anterior[clave] = p;
        (usados[clave] = usados[clave] || new Set()).add(p);
      };
      const inicio = Date.UTC(2026, 0, 1);
      for (let i = 0; i < 400; i++) {
        const dia = new Date(inicio + i * 86400000).toISOString().slice(0, 10);
        const g = M.generar(dia);
        if (i < 3 && JSON.stringify(g) !== JSON.stringify(M.generar(dia))) fallo(dia, 'el mismo día genera datos distintos');
        for (const id of [1, 2]) {
          const l = g.labs[id];
          const d = `${dia} · laboratorio de la misión ${id}`;
          if (!PREFIJOS_POR_NIVEL.principiante.includes(l.prefijo)) fallo(d, `/${l.prefijo} no es una máscara de Principiante`);
          if (l.mascara !== mascaraBits(l.prefijo)) fallo(d, `la máscara ${l.mascara} no corresponde a /${l.prefijo}`);
          if (!esIp(l.red) || redBits(l.red, l.prefijo) !== l.red) fallo(d, `${l.red} no es una dirección de red /${l.prefijo}`);
          for (const c of ['puertaEnlace', 'dns']) if (!equipoDeLaRed(l[c], l.red, l.prefijo)) fallo(d, `«${c}» (${l[c]}) no es un equipo de la red`);
          contar('laboratorio ' + id, l.prefijo, dia);
        }
        if (g.labs[1].prefijo === g.labs[2].prefijo) fallo(dia, `los laboratorios de las misiones 1 y 2 usan la misma máscara (/${g.labs[1].prefijo})`);
        if (g.ejercicios.map((e) => e.id).join() !== Object.keys(NIVEL_MASCARA_DEL_DIA).join()) fallo(dia, 'los ejercicios del día no son los de las misiones 2, 5, 8, 10 y 11');
        for (const e of g.ejercicios) {
          const d = `${dia} · ${e.id}`;
          const md = e.mascaraDelDia || {};
          const p = md.prefijo;
          const nivel = NIVEL_MASCARA_DEL_DIA[e.id];
          if (e.nivel !== nivel) fallo(d, `debería ser de nivel ${nivel}`);
          if (!(PREFIJOS_POR_NIVEL[nivel] || []).includes(p)) fallo(d, `/${p} no es una máscara de nivel ${nivel}`);
          if (e.ampliacion !== true) fallo(d, 'calcular con máscaras distintas de /24 es Ampliación');
          if (new Set(e.opciones).size !== e.opciones.length) fallo(d, 'hay opciones repetidas');
          if (e.tipo === 'multiple' && (e.opciones.length !== 4 || !e.opciones.every(esIp))) fallo(d, 'necesita cuatro opciones con forma de dirección');
          e.opciones.forEach((o, k) => k !== e.correcta && !(e.porQueNo || {})[k] && fallo(d, `falta «porQueNo» para la opción ${k}`));
          if (!Array.isArray(e.pistas) || e.pistas.length !== 2 || !e.explicacion) fallo(d, 'necesita dos pistas y una explicación');
          const ok = e.opciones[e.correcta];
          if (md.tipo === 'mascara') {
            if (ok !== mascaraBits(p)) fallo(d, `la respuesta ${ok} no es la máscara de /${p}`);
            if (redBits(md.red, p) !== md.red) fallo(d, `${md.red} no es una dirección de red /${p}`);
          } else if (md.tipo === 'ip-valida') {
            if (!equipoDeLaRed(ok, md.red, p)) fallo(d, `la respuesta ${ok} no es un equipo de ${md.red}/${p}`);
            e.opciones.forEach((o, k) => k !== e.correcta && equipoDeLaRed(o, md.red, p) && fallo(d, `el distractor ${o} también es un equipo válido`));
          } else if (md.tipo === 'misma-red') {
            const misma = redBits(md.a, p) === redBits(md.b, p);
            if ((e.correcta === 0) !== misma) fallo(d, 'la respuesta no coincide con el cálculo de las dos redes');
            if (md.a === md.b || !equipoDeLaRed(md.a, redBits(md.a, p), p) || !equipoDeLaRed(md.b, redBits(md.b, p), p)) fallo(d, 'las dos IP tienen que ser equipos distintos');
          } else if (md.tipo === 'broadcast') {
            if (ok !== broadcastBits(md.ip, p)) fallo(d, `la respuesta ${ok} no es el broadcast de ${md.ip}/${p}`);
          } else if (md.tipo === 'nack') {
            if (redBits(ok, p) === md.red) fallo(d, `la respuesta ${ok} está dentro de la red: no daría NACK`);
            e.opciones.forEach((o, k) => k !== e.correcta && !equipoDeLaRed(o, md.red, p) && fallo(d, `el distractor ${o} debería ser un equipo de la red`));
          } else fallo(d, `tipo de ejercicio de máscara desconocido: ${md.tipo}`);
          contar(e.id, p, dia);
        }
      }
      /* Variedad: cada elemento usa al menos tres máscaras distintas a lo largo del año. */
      for (const [clave, ps] of Object.entries(usados)) if (ps.size < 3) fallo(clave, `solo usa ${ps.size} máscaras distintas en 400 días`);
      /* Lo que está en los datos del juego es lo de hoy. */
      const hoy = M.generar(M.dia);
      for (const id of [1, 2]) {
        const e = DHCP.data.misiones.find((m) => m.id === id).etapas[0];
        if (e.red !== hoy.labs[id].red || e.prefijo !== hoy.labs[id].prefijo) fallo('hoy', `el laboratorio de la misión ${id} no tiene la red del día`);
      }
      for (const e of hoy.ejercicios) {
        const actual = (DHCP.data.preguntas || []).find((p) => p.id === e.id);
        if (!actual || actual.enunciado !== e.enunciado) fallo('hoy', `${e.id} no es el ejercicio del día`);
      }
    },

    /* Laboratorio animado: un escenario (DORA) o varios en pestañas, cada uno con su narración paso a paso. */
    _labDora(e, dd, err) {
      const todos = DHCP.data.escenarios || {};
      const ids = e.escenarios || (e.escenario ? [e.escenario] : []);
      if (!ids.length) return err(dd, 'necesita «escenario» o una lista de «escenarios»');
      if (e.escenarios && e.escenario) err(dd, 'usa «escenario» o «escenarios», no los dos');
      if (new Set(ids).size !== ids.length) err(dd, 'hay escenarios repetidos');
      if (e.escenarios && (e.escenarios.length < 2 || !e.titulo)) err(dd, 'con varios escenarios hacen falta al menos dos y un «titulo» para el laboratorio');
      ids.forEach((id) => {
        const esc = todos[id];
        if (!esc) return err(dd, `el escenario «${id}» no existe`);
        if (!esc.nota) err(dd, `el escenario «${id}» necesita una «nota» que lo presente`);
        (esc.mensajes || []).forEach((m, i) => (!m.antes || !m.despues) && err(dd, `el mensaje ${i + 1} del escenario «${id}» necesita «antes» y «despues» para la narración`));
        /* En pestañas, cada escenario se presenta con su mensaje protagonista (nombre e icono de la pestaña). */
        if (e.escenarios) {
          if (!esc.titulo || !esc.tituloPasos) err(dd, `el escenario «${id}» necesita «titulo» y «tituloPasos»`);
          if (!DHCP.data.mensajes[esc.mensaje]) err(dd, `el escenario «${id}» necesita en «mensaje» uno de los ocho mensajes DHCP`);
          else if (!(esc.mensajes || []).some((m) => m.tipo === esc.mensaje)) err(dd, `el escenario «${id}» no contiene ningún ${esc.mensaje}`);
        }
      });
      if (e.escenarios) {
        const protagonistas = ids.map((id) => todos[id] && todos[id].mensaje);
        if (new Set(protagonistas).size !== protagonistas.length) err(dd, 'dos pestañas no pueden tener el mismo mensaje protagonista');
      }
    },

    /* Línea temporal de una concesión (Ampliación): T1 y T2 dentro del Lease Time, en orden. */
    _labConcesion(e, dd, err) {
      const ip4 = DHCP.EtapasUtil.ip4;
      for (const c of ['cliente', 'nota']) if (!e[c]) err(dd, `falta «${c}»`);
      if (!Number.isInteger(e.lease) || e.lease < 60) err(dd, '«lease» debe ser el Lease Time en segundos (un entero de 60 o más)');
      if (!(typeof e.t1 === 'number' && typeof e.t2 === 'number' && e.t1 > 0 && e.t1 < e.t2 && e.t2 < 1)) err(dd, '«t1» y «t2» son fracciones del Lease Time con 0 < t1 < t2 < 1');
      for (const c of ['ip', 'servidor']) if (!ip4(e[c])) err(dd, `«${c}» debe ser una IP`);
      if (!/Ampliación/.test(e.nota || '')) err(dd, 'la nota debe avisar de que la línea temporal es Ampliación (no está en la presentación)');
    },

    /* Examen final: sin ejercicios propios, al final de la campaña y con un banco que permita montarlo. */
    _examen(m, donde, propias, esUltima, err) {
      const x = m.examen;
      if (propias.length) err(donde, `el examen elige sus ejercicios del banco: sobran sus ${propias.length} ejercicios propios`);
      if (!esUltima) err(donde, 'el examen final debe ser la última misión: su criterio no aplica la regla de desbloqueo');
      if (!Number.isInteger(x.total) || x.total < 1) return err(donde, '«examen.total» debe ser un entero positivo');
      if (!x.porNivel || typeof x.porNivel !== 'object') return err(donde, 'falta «examen.porNivel» con cuántos ejercicios de cada nivel lleva el examen');
      const niveles = Object.keys(DHCP.Ejercicios.NOMBRES_NIVEL);
      const porNivel = x.porNivel;
      Object.keys(porNivel).forEach((n) => {
        if (!niveles.includes(n)) err(donde, `nivel desconocido en «examen.porNivel»: ${n}`);
        else if (!Number.isInteger(porNivel[n]) || porNivel[n] < 0) err(donde, `«examen.porNivel.${n}» debe ser un entero`);
      });
      if (x.total < DHCP.Examen.misiones().length) err(donde, `con ${x.total} ejercicios no cabe uno de cada una de las ${DHCP.Examen.misiones().length} misiones`);
      const problema = DHCP.Examen.problema(x);
      if (problema) err(donde, 'el banco no permite montar el examen: ' + problema);
    },

    /* Insignias: al menos 8, con condiciones que el motor entiende y que se pueden cumplir. */
    _insignias(lista, misiones, preguntas, err) {
      const insignias = lista || [];
      if (insignias.length < 8) err('insignias', `hacen falta al menos 8 insignias (hay ${insignias.length})`);
      const ids = new Set();
      const porMision = (id) => misiones.find((m) => m.id === id);
      insignias.forEach((ins, i) => {
        const donde = 'insignia ' + (ins.id || '#' + i);
        for (const c of ['id', 'nombre', 'descripcion', 'icono']) if (!ins[c]) err(donde, `falta «${c}»`);
        if (ids.has(ins.id)) err(donde, 'id repetido');
        ids.add(ins.id);
        if (ins.icono && !document.getElementById(ins.icono)) err(donde, `el icono #${ins.icono} no existe en el sprite`);
        const c = ins.condicion || {};
        const mision = c.mision !== undefined ? porMision(c.mision) : null;
        if (c.mision !== undefined && !mision) err(donde, `la condición apunta a una misión que no existe: ${c.mision}`);
        switch (c.tipo) {
          case 'completar':
          case 'sinSoluciones':
            if (c.mision === undefined) err(donde, `la condición «${c.tipo}» necesita una misión`);
            break;
          case 'precision':
            if (c.mision === undefined) err(donde, 'la condición «precision» necesita una misión');
            else if (mision && (mision.examen || !preguntas.some((p) => p.mision === mision.id))) err(donde, 'la condición «precision» necesita una misión con ejercicios propios');
            if (!(c.valor > 0 && c.valor <= 1)) err(donde, '«valor» de «precision» debe ser una fracción entre 0 y 1');
            break;
          case 'sinPistas':
            if (mision && mision.examen) err(donde, 'en el examen no hay pistas: «sinPistas» no tiene sentido ahí');
            break;
          case 'racha':
            if (!Number.isInteger(c.valor) || c.valor < 2) err(donde, '«valor» de «racha» debe ser un entero de 2 o más');
            break;
          case 'nota':
            if (!misiones.some((m) => m.examen)) err(donde, 'la condición «nota» necesita una misión de examen');
            if (!(c.valor > 0 && c.valor <= 10)) err(donde, '«valor» de «nota» debe estar entre 0 y 10');
            break;
          case 'campana':
            break;
          default:
            err(donde, `tipo de condición desconocido: ${c.tipo}`);
        }
      });
    },

    /* Sitios de escucha de un laboratorio: datos completos y un «ve» que la simulación entienda. */
    _sitios(sitios, dd, err) {
      if (!Array.isArray(sitios) || sitios.length < 3) return err(dd, 'hacen falta al menos tres sitios donde escuchar');
      sitios.forEach((s) => {
        if (!s.id || !s.equipo || !s.tarjeta || !s.iface || !s.razon || typeof s.ok !== 'boolean') err(dd, `el sitio «${s.id}» necesita «id», «equipo», «tarjeta», «iface», «ok» y «razon»`);
        if (!['todo', 'propio', 'broadcast', 'internet'].includes(s.ve)) err(dd, `el sitio «${s.id}» tiene un «ve» no válido: ${s.ve}`);
      });
      if (new Set(sitios.map((s) => s.id)).size !== sitios.length) err(dd, 'hay sitios con el mismo id');
      if (sitios.filter((s) => s.ok).length < 2) err(dd, 'suele haber al menos dos sitios válidos donde escuchar (diap. 33)');
      if (!sitios.some((s) => s.ve === 'internet' && !s.ok)) err(dd, 'falta la tarjeta de Internet del servidor como sitio no válido (§7.3)');
    },

    /* Laboratorio de captura (misión 9): datos y, con varias semillas, que lo que se ve desde cada sitio
       coincida con lo que la etapa explica (DORA completo solo desde los sitios válidos). */
    _labCaptura(e, dd, err) {
      const C = DHCP.Captura;
      for (const c of ['pregunta', 'nota', 'cliente', 'otroCliente', 'otroPc']) if (!e[c]) err(dd, `falta «${c}»`);
      if (!Array.isArray(e.redes) || !e.redes.length || e.redes.some((n) => !Number.isInteger(n) || n < 0 || n > 255)) return err(dd, '«redes» debe ser una lista de números del 0 al 255');
      if (!Array.isArray(e.leases) || e.leases.length < 3 || e.leases.some((n) => !Number.isInteger(n) || n <= 0)) return err(dd, '«leases» necesita al menos tres duraciones en segundos, para que el valor no se memorice');
      e.leases.forEach((l) => {
        if (C.leerDuracion(String(l)) !== l || C.leerDuracion(C.duracionEs(l)) !== l || C.leerDuracion(C.leaseWireshark(l)) !== l) err(dd, `el Lease Time ${l} no se reconoce bien al escribirlo en segundos, en español o como en Wireshark`);
      });
      this._sitios(e.sitios, dd, err);
      const sitios = e.sitios || [];
      sitios.forEach((s) => {
        if (!['cliente', 'servidor', 'otro'].includes(s.nodo)) err(dd, `el sitio «${s.id}» necesita un «nodo» del mapa (cliente, servidor u otro)`);
        if (s.nodo === 'otro' && s.equipo !== e.otroPc) err(dd, `el sitio «${s.id}» debe ser el equipo «${e.otroPc}» del mapa`);
      });
      if (!sitios.some((s) => s.ok && s.ve === 'todo' && s.nodo === 'servidor')) err(dd, 'falta la solución de la diap. 33: la tarjeta de Intranet del servidor');
      const acciones = e.acciones || [];
      acciones.forEach((a) => {
        if (!a.id || !a.texto || !a.razon || typeof a.genera !== 'boolean') err(dd, `la acción «${a.id}» necesita «id», «texto», «genera» y «razon»`);
        if (a.cortaCapturaEn && (!a.razonCorte || !sitios.some((s) => s.nodo === a.cortaCapturaEn))) err(dd, `la acción «${a.id}» necesita «razonCorte» y un nodo existente en «cortaCapturaEn»`);
      });
